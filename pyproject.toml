[project]
name = "bot-jovani-vazquez"
dynamic = ["version"]
description = "Bot de Discord con arquitectura modular en Python."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    # discord.py los usa solos si están: orjson lee los eventos de Discord más rápido
    # y zstandard comprime la conexión con zstd en vez de zlib.
    "orjson>=3.10",
    "zstandard>=0.23",
    "python-dotenv>=1.0,<2",
    "yt-dlp>=2024.1",
    "PyNaCl>=1.5,<2",
    "davey>=0.1.6",
    "Pillow>=10.3",
    "numpy>=1.26",
    # Zonas horarias Atlantic/Canary (días de las rachas) y Asia/Hong_Kong
    # (`hongkong`): la imagen python:slim no trae la base de datos del sistema.
    "tzdata>=2024.1",
    # Chromium sin ventana para dibujar las carreras de caballos, cara o cruz y los
    # dados con canvas y HTML/CSS (`bot.services.horses_scene`,
    # `bot.services.coin_scene`, `bot.services.craps_scene`). Sin el navegador, se
    # dibuja con Pillow.
    "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Reparte las pruebas entre todos los núcleos (`-n auto` en `addopts`).
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# El código vive en src/, así que se añade al path de importación de pytest; tests/
# también, para los dobles compartidos entre pruebas (`interaction_fakes`).
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
# En paralelo, un proceso por núcleo; `worksteal` reparte de nuevo las pruebas
# cuando un proceso se queda libre, para que las lentas no se acumulen en uno.
# `-n 0` lo apaga (para depurar con `pdb` o ver un `print`).
addopts = "-n auto --dist worksteal"
# `lenta`: lo que tarda y casi nunca rompe un commit (dibujo repartido, Node contra Chromium,
# estadística, auditorías de todo el código). Antes de cada commit, `pytest -m "not lenta"`;
# la tanda entera, antes de subir a `main` (Biblia, «Pruebas rápidas»).
markers = ["lenta: prueba de más de 2 s que solo corre en la tanda entera"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# La versión vive en `bot.__version__` (ver «Versiones» en Biblia.txt).
version = { attr = "bot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Todo `assets/` va en el paquete: la imagen de Docker instala el paquete y borra
# `src/`, así que lo que no entre aquí no existe en el NAS. Una lista carpeta a
# carpeta dejó fuera las escenas de la moneda, los dados y la ruleta, que se
# dibujaban con Pillow sin que nadie lo notara (lo vigila test_packaging.py).
[tool.setuptools.package-data]
bot = ["assets/**/*"]
