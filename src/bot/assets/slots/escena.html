<!doctype html>
<!--
Escena de la tragaperras clásica, dibujada con canvas. La pinta Node con Skia
(assets/escena_node.cjs) y, si no hay Node, un Chromium sin ventana (ver
bot/services/slots_scene.py).

No decide nada: Python le pasa, fotograma a fotograma, dónde está cada rodillo, las luces,
el marcador, los carteles y el doble o nada. Aquí solo se pinta. Funciones que llama Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                {strips: [3 cadenas], symbols: {clave: data URL de un PNG de
                             200x200}, symbolsKey}. Carga los símbolos solo si cambia
                             symbolsKey y prepara una vez los sprites y el fondo.
- renderFrames(states, first) dibuja los fotogramas y devuelve, de cada uno, el recuadro que
                             ha cambiado (PNG en Chromium, píxeles crudos en Node) y dónde va.
- paintState(st)             pinta un estado y devuelve el lienzo grande (W·S × H·S). Lo usan las
                             tragaperras de la plaza del Jovaniverso, que importan escena.js con
                             window.TRAGAS_S = 1 y la pintan en directo (universo/src/casino/).

Un estado es (ver `_base`, `_celebration` y `double_states` en slots_scene.py):
  reels[3]   posición de la tira (float): la celda de la línea es strip[floor(p)] y la fila r
             (0 arriba, 1 la línea, 2 abajo) muestra strip[(floor(p) + r - 1) mod n].
  blur[3]    desenfoque vertical por velocidad, 0..1.
  flash[3]   destello de la ventana al tocar fondo, 0..1.
  bulbs      {shape: round|diamond|star|burst, lit: [12 colores o null]}, la 0 abajo.
  glow, glowColor   aura del tercer rodillo (anticipación).
  dim        oscurece la máquina menos el tercer rodillo y las casillas de `hits`.
  line       marco dorado de la fila de pago, 0..1.
  hits, pulse   casillas [rodillo, fila] que se iluminan y su intensidad.
  banner     null o {tier: big|mega|epic, scale, spin, flash}.
  meter      null o {text, fit, glow}: el marcador del premio.
  coins      [[x, y, fase 0..3, alfa]]       sparkles   [[x, y, intensidad]]
  gamble     null o el doble o nada (ver `_gamble`).       ms   (lo ignora la escena)

Se dibuja al doble de tamaño (S = 2) y se reduce al copiar. El recuadro que cambia se calcula
comparando con el fotograma anterior, así que montar los recuadros da exactamente lo mismo
que pintar cada fotograma entero. Todo lo fijo (mueble, marcos, sprites de símbolos nítidos y
desenfocados, luces, cartas) se pinta una vez; cada fotograma solo compone. Nada de
Math.random y nada de emojis: el Chromium del Docker no trae su fuente, los palos son trazados.

El código está en escena.js (aparte del HTML porque la página del Jovaniverso lo importa como módulo y el
CSP de las Activities de Discord no deja scripts en línea). Los pintores que comparte con las tragaperras de Botes están en ../tragas.js (objeto Tragas, que
se carga con un <script src> antes de este): utilidades de dibujo, sprites de símbolos, bombillas,
monedas que caen y destellos, carteles (GRAN PREMIO, MEGAPREMIO, ÉPICO), marcador del premio y la
reducción de salida con el recuadro que cambia (Tragas.output). Esos colores son los de serie de
Tragas.TINT. Aquí se queda lo solo de la clásica: mueble, cristal, rodillos, flechas, línea de pago,
aura del tercer rodillo, cartas, doble o nada y `paint`.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script src="../tragas.js"></script>
<script src="escena.js"></script>
</body>
</html>
