<!doctype html>
<!--
Escena de `mascota`, dibujada con canvas: la ficha de una mascota, como las pantallas de los
negocios de `pala` (assets/negocio/escena.html). La pinta Node con Skia (assets/escena_node.cjs) y,
si no hay Node, un Chromium sin ventana (ver bot/services/pet_scene.py). Si no hay ninguno, el panel
sale en texto.

No decide nada: Python le pasa el estado ya hecho (`pet_scene.portrait_state`, contrato en el
docstring de ese módulo) y aquí solo se pinta. Mide 1000 × 640. Funciones que llama Python:

- loadFonts()                  espera a las fuentes (canvas no las carga solo).
- setup(meta)                  sin estado entre imágenes: cada una se pinta entera.
- renderFrames(states, first)  un PNG por estado: {x: 0, y: 0, u}.

Tres composiciones: la ficha (`paintCard`: cabecera con el nombre, la escena en un marco, la cita
con su personalidad y las tarjetas de vínculo, rareza, racha y ropa), la visita (`paintVisit`, con
dos mascotas) y la foto del álbum (`paintAlbum`, con `caption`: una instantánea grande). Los textos
llegan en `st.card`.

La escena de la mascota mide W × H (640 × 400) y se pinta dentro del marco con una escala. Todo va
al doble (S = 2) y se reduce a la mitad justa en un paso al copiar. Cada plan de cuerpo
(`PLANS.gato`, `PLANS.perro`...) pinta una mascota sentada de frente en un espacio propio: el suelo
en y = 0, el centro en x = 0 y unos 235 de alto (la cabeza, la mitad). La mascota se coloca con una
traslación y una escala; los planes leen los parámetros de la raza (`pet.look`, `pets_looks.py`) y
devuelven los ANCLAJES para las prendas: `head` (centro de lo alto de la cabeza, ancho,
inclinación), `eyes` (centro entre los ojos, separación), `neck` (centro, ancho) y `body` (centro,
ancho, alto del tronco). `placeAnchors` los pasa a coordenadas del lienzo (con el espejo de la
visita) y `drawOutfit` pinta cada prenda con ropa.js (`Ropa.item`). Lo que va detrás (capas, alas,
el cono) se pinta antes que la mascota con los anclajes sacados en seco (`g = NOOP`). La mascota y lo
que lleva delante se pintan en una capa aparte (`layer`) que recibe su volumen (`volume`: luz
cálida arriba a la izquierda y sombra abajo, solo sobre su silueta) y se pega encima. Los planes sin
hueco (`PLAN_SLOTS`, como en pets_looks.py) devuelven ese anclaje a null. Con `meta.debug` o
`state.debug` se pintan los anclajes: puntos y cajas de colores.

Nada de Math.random: el azar de la decoración (corazones, confeti, brillos) sale de `rnd(semilla, i)`.
Los textos del usuario se limpian de lo que la fuente no tiene (emojis) para no pintar cuadrados.
Solo canvas 2D, sin filtros: Skia en Node y Chromium no siempre coinciden en ellos.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  @font-face { font-family: "RobotoM"; src: url("../memes/fonts/robotomedium.ttf"); }
  @font-face { font-family: "RobotoR"; src: url("../memes/fonts/robotoregular.ttf"); }
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script src="ropa.js"></script>
<script>
(() => {
"use strict";
const S = 2;
const W = 640;
const H = 400;
const TAU = Math.PI * 2;
// La escena de la mascota mide W × H (640 × 400) y va dentro de una ficha de CW × CH, como las
// pantallas de los negocios: cabecera, la escena enmarcada, tarjetas a la derecha y un pie.
const CW = 1000;
const CH = 640;
const big = document.createElement("canvas"); big.width = CW * S; big.height = CH * S;
const out = document.createElement("canvas"); out.width = CW; out.height = CH;
// La mascota se pinta aparte para darle volumen (luz y sombra sobre su silueta) y se pega encima.
const layer = document.createElement("canvas"); layer.width = CW * S; layer.height = CH * S;
const lctx = layer.getContext("2d");
// `let`: para sacar los anclajes sin pintar se cambia un momento por `NOOP` (ver `anchorsOf`).
let g = big.getContext("2d");
// Un lienzo que no hace nada: acepta cualquier llamada y cualquier propiedad.
const NOOP = new Proxy(function () {}, {
  get: (_t, prop) => (prop === "measureText" ? () => ({ width: 0 }) : NOOP),
  set: () => true,
  apply: () => NOOP,
});
const octx = out.getContext("2d");

const MONT = "Montserrat, RobotoM, sans-serif";
const BODY = "RobotoM, sans-serif";
const SOFT = "RobotoR, sans-serif";
const INK = "#2a1d33";

// Huecos de ropa que tiene cada plan (los que no salen aquí, los cuatro). Igual que PLAN_SLOTS.
const PLAN_SLOTS = {
  pez: ["cabeza", "ojos"],
  mosquito: ["cabeza", "ojos"],
  pulpo: ["cabeza", "ojos", "cuello"],
  cucaracha: ["cabeza", "ojos", "cuerpo"],
};
// Escala de cada plan para que todos ocupen lo mismo de alto (~60 % del retrato).
const PLAN_SIZE = { tortuga: 1.1, rana: 1.2, piedra: 1.15, hamster: 1.18, pez: 1.08, lagarto: 1.05, pajaro: 1.04, caballo: 0.94 };
const SLOT_ANCHOR = { cabeza: "head", ojos: "eyes", cuello: "neck", cuerpo: "body" };
// Mitad del ancho de la sombra del suelo, por plan.
const SHADOW = { gato: 92, perro: 96, hamster: 100, conejo: 92, huron: 74, oso: 118, cabra: 96,
  caballo: 104, pajaro: 82, gallo: 92, pavo: 110, pez: 88, tortuga: 128, lagarto: 100, rana: 100,
  pulpo: 120, piedra: 100, cucaracha: 96, mosquito: 76 };

// -- Utilidades ------------------------------------------------------------------------------

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rgb(hex) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex || "");
  const n = m ? parseInt(m[1], 16) : 0x808080;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function toHex(r, gg, b) {
  return "#" + [r, gg, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("");
}
function mix(a, b, t) {
  const A = rgb(a), B = rgb(b);
  return toHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function alpha(hex, a) { const [r, gg, b] = rgb(hex); return `rgba(${r},${gg},${b},${a})`; }
function lum(hex) { const [r, gg, b] = rgb(hex); return (0.299 * r + 0.587 * gg + 0.114 * b) / 255; }
// El tono de sombra (violeta suave) y el del contorno (más oscuro que el relleno, nunca negro puro).
const shadeOf = (c) => mix(c, "#5a3a78", 0.26);
const lineOf = (c) => mix(c, "#2b1630", lum(c) < 0.3 ? 0.5 : 0.66);
const light = (c, t = 0.4) => mix(c, "#ffffff", t);
const dark = (c, t = 0.3) => mix(c, "#2b1630", t);
// Azar repetible: el mismo (semilla, i) da siempre lo mismo.
function rnd(seed, i) {
  let h = (Math.imul(seed | 0, 374761393) + Math.imul(i | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  h = Math.imul(h, 2246822519);
  h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}
// La fuente no trae emojis ni escrituras raras: se deja lo latino y la puntuación.
function clean(text) {
  const keep = (n) => (n >= 32 && n < 0x250) || (n >= 0x2010 && n <= 0x203a) || n === 0x20ac || n === 0x2212;
  return Array.from(String(text ?? "")).filter((c) => keep(c.codePointAt(0))).join("").replace(/\s+/g, " ").trim();
}
function font(weight, size, family) { g.font = `${weight} ${size}px ${family}`; }
function fitText(str, x, y, maxW, size, min, fam, color, align = "left", weight = "") {
  let s = size;
  font(weight, s, fam);
  while (s > min && g.measureText(str).width > maxW) { s -= 1; font(weight, s, fam); }
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(str, x, y);
  return s;
}
function rr(x, y, w, h, r) {
  const k = Math.max(0, Math.min(r, w / 2, h / 2));
  g.moveTo(x + k, y); g.arcTo(x + w, y, x + w, y + h, k); g.arcTo(x + w, y + h, x, y + h, k);
  g.arcTo(x, y + h, x, y, k); g.arcTo(x, y, x + w, y, k); g.closePath();
}
// Subtrayectos que se suman a lo que haya en el camino (sin la línea de enlace del ellipse).
function ell(x, y, rx, ry, rot = 0) {
  g.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot));
  g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU);
  g.closePath();
}
function poly(pts, close = true) {
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  if (close) g.closePath();
}
function fillEll(x, y, rx, ry, color, rot = 0) { g.beginPath(); ell(x, y, rx, ry, rot); g.fillStyle = color; g.fill(); }
function fillPath(fn, color) { g.beginPath(); fn(); g.fillStyle = color; g.fill(); }
function strokePath(fn, color, w, cap = "round") {
  g.beginPath(); fn(); g.strokeStyle = color; g.lineWidth = w; g.lineCap = cap; g.lineJoin = "round"; g.stroke();
}
// Puntos de una curva de Bézier cúbica entre t0 y t1 (para colas y tentáculos).
function bez(p0, p1, p2, p3, t0 = 0, t1 = 1, n = 16) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = t0 + (t1 - t0) * (i / n), u = 1 - t;
    pts.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
    ]);
  }
  return pts;
}

// Una forma con contorno grueso de un tono más oscuro, sombra plana abajo a la derecha (cel) y,
// si acaso, `inside()` para manchas: se pinta recortado a la forma. El contorno se traza primero
// al doble de grueso y el relleno lo tapa por dentro, así una unión de elipses no enseña las
// costuras.
function blob(path, fill, o = {}) {
  const lw = o.lw ?? 5;
  const line = o.line ?? lineOf(fill);
  g.save();
  g.beginPath(); path(); g.lineWidth = lw * 2; g.strokeStyle = line; g.lineJoin = "round"; g.lineCap = "round"; g.stroke();
  g.save();
  g.beginPath(); path(); g.clip();
  g.fillStyle = o.shade ?? shadeOf(fill);
  g.fillRect(-500, -600, 1000, 800);
  g.translate(o.dx ?? -6, o.dy ?? -8);
  g.beginPath(); path(); g.fillStyle = fill; g.fill();
  g.restore();
  if (o.inside) {
    g.save(); g.beginPath(); path(); g.clip(); o.inside(); g.restore();
  }
  g.restore();
}
// Un trazo grueso con contorno (cola, tentáculo): la línea, el relleno y una tira de sombra.
function tube(pts, w, fill, o = {}) {
  const lw = o.lw ?? 5;
  const line = () => { g.beginPath(); poly(pts, false); };
  g.save();
  g.lineCap = "round"; g.lineJoin = "round";
  line(); g.strokeStyle = o.line ?? lineOf(fill); g.lineWidth = w + lw * 2; g.stroke();
  line(); g.strokeStyle = fill; g.lineWidth = w; g.stroke();
  if (!o.flat) {
    g.translate(w * 0.17, w * 0.2);
    line(); g.strokeStyle = o.shade ?? shadeOf(fill); g.lineWidth = w * 0.4; g.stroke();
  }
  g.restore();
}
function heart(x, y, s, color, line = "#a02a52") {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath();
  g.moveTo(0, 8); g.bezierCurveTo(-14, -2, -10, -14, 0, -7); g.bezierCurveTo(10, -14, 14, -2, 0, 8);
  g.closePath();
  g.fillStyle = color; g.fill(); g.lineWidth = 2.2 / Math.max(s, 0.5); g.strokeStyle = line; g.lineJoin = "round"; g.stroke();
  g.fillStyle = "rgba(255,255,255,0.7)"; g.beginPath(); ell(-4.5, -4.2, 2.4, 1.6, -0.6); g.fill();
  g.restore();
}
function star(x, y, r, color, points = 4, inner = 0.4) {
  g.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / points, rad = i % 2 ? r * inner : r;
    g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath(); g.fillStyle = color; g.fill();
}

// -- Caras --------------------------------------------------------------------------------------
// Los ojos y la boca los dibuja cada plan con estos pintores. Las caras del momento (`c.mood`)
// mandan sobre la de siempre: contenta (ojos en arco, sonrisa), dormida (ojos cerrados) y fiesta
// (ojos en pico, boca abierta). La cara de siempre sale de `look.face`.

function highlights(x, y, r) {
  g.fillStyle = "#ffffff";
  g.beginPath(); ell(x - r * 0.32, y - r * 0.36, r * 0.36, r * 0.36); g.fill();
  g.beginPath(); ell(x + r * 0.34, y + r * 0.34, r * 0.17, r * 0.17); g.fill();
}
function eyeOpen(x, y, r, side, o) {
  const kind = o.kind || "dulce";
  const ink = o.ink || INK;
  const rx = r * (o.wide ?? 1), ry = r * 1.18;
  if (kind === "iris") {
    g.beginPath(); ell(x, y, rx * 1.05, ry); g.fillStyle = o.iris; g.fill();
    g.lineWidth = 3; g.strokeStyle = dark(o.iris, 0.6); g.stroke();
    if (o.slit) fillEll(x, y, rx * 0.2, ry * 0.9, ink); else fillEll(x, y, rx * 0.58, ry * 0.66, ink);
    highlights(x, y - 1, r * 0.9);
  } else if (kind === "sclera") {
    const sc = o.sclera || "#ffffff";
    g.beginPath(); ell(x, y, rx * 1.12, ry * 1.05); g.fillStyle = sc; g.fill();
    g.lineWidth = 3.4; g.strokeStyle = o.rim || dark(sc, 0.6); g.stroke();
    const lk = o.look ? o.look(side) : [0, 0];
    const px = x + lk[0] * r * 0.4, py = y + lk[1] * r * 0.4;
    if (o.rect) {
      g.save(); g.translate(px, py); g.rotate(o.rect(side));
      g.beginPath(); rr(-r * 0.62, -r * 0.2, r * 1.24, r * 0.4, r * 0.16); g.fillStyle = ink; g.fill();
      g.restore();
      g.fillStyle = "#fff"; g.beginPath(); ell(px - r * 0.36, py - r * 0.04, r * 0.11, r * 0.11); g.fill();
    } else {
      fillEll(px, py, r * (o.pupil ?? 0.55), r * (o.pupil ?? 0.55) * 1.1, ink);
      highlights(px, py, r * (o.pupil ?? 0.55) * 1.2);
    }
  } else {
    g.beginPath(); ell(x, y, rx, ry); g.fillStyle = ink; g.fill();
    highlights(x, y, r);
  }
  if (o.lid) {
    const ey = kind === "sclera" ? ry * 1.05 : ry;
    const edge = y - ey + 2 * ey * o.lid;
    g.save(); g.beginPath(); ell(x, y, rx * 1.2, ey * 1.06); g.clip();
    g.fillStyle = o.lidColor; g.fillRect(x - rx * 2, y - ey * 2, rx * 4, edge - (y - ey * 2));
    g.beginPath(); g.moveTo(x - rx * 1.3, edge); g.lineTo(x + rx * 1.3, edge);
    g.lineWidth = 3.4; g.strokeStyle = o.lidLine || lineOf(o.lidColor); g.stroke();
    g.restore();
  }
}
// ^ (contenta), ‿ (dormida), > < (fiesta)
function eyeMood(x, y, r, side, mood, ink) {
  g.beginPath();
  if (mood === "contenta") g.arc(x, y + r * 0.45, r * 1.0, Math.PI * 1.12, Math.PI * 1.88);
  else if (mood === "dormida") g.arc(x, y - r * 0.5, r * 1.0, Math.PI * 0.12, Math.PI * 0.88);
  else {
    g.moveTo(x - side * r * 0.75, y - r * 0.75); g.lineTo(x + side * r * 0.65, y); g.lineTo(x - side * r * 0.75, y + r * 0.75);
  }
  g.lineWidth = Math.max(4.4, r * 0.4); g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = ink; g.stroke();
}
// Los dos ojos centrados en (cx, cy). `o` lleva el estilo de la cara de siempre.
function eyes(c, cx, cy, sep, r, o = {}) {
  const ink = o.ink || INK;
  for (const side of [-1, 1]) {
    const x = cx + side * sep / 2;
    if (c.mood !== "tranquila") eyeMood(x, cy, r, side, c.mood, o.moodInk || ink);
    else if (o.wink === side) {
      g.beginPath(); g.moveTo(x - r * 1.0, cy + r * 0.1); g.quadraticCurveTo(x, cy + r * 0.55, x + r * 1.0, cy + r * 0.1);
      g.lineWidth = 4.6; g.lineCap = "round"; g.strokeStyle = ink; g.stroke();
    } else eyeOpen(x, cy, r, side, o);
  }
  if (o.scar) {
    const x = cx + o.scar * sep / 2;
    strokePath(() => { g.moveTo(x - r * 0.5, cy - r * 1.9); g.lineTo(x + r * 0.5, cy + r * 1.6); }, "#f6ecf0", 5.6);
    strokePath(() => { g.moveTo(x - r * 0.5, cy - r * 1.9); g.lineTo(x + r * 0.5, cy + r * 1.6); }, "#b64a62", 2.6);
    for (const k of [-0.8, 0, 0.8]) {
      strokePath(() => { g.moveTo(x - r * 0.7, cy + k * r * 0.9 - r * 0.2); g.lineTo(x + r * 0.4, cy + k * r * 0.9 + r * 0.25); }, "#b64a62", 2.4);
    }
  }
}
function brows(cx, cy, sep, w, ang, color, th = 5) {
  for (const side of [-1, 1]) {
    const x = cx + side * sep / 2;
    strokePath(() => {
      g.moveTo(x - w / 2, cy + side * ang * w / 2); g.lineTo(x + w / 2, cy - side * ang * w / 2);
    }, color, th);
  }
}
function cheeks(cx, cy, sep, r, color = "rgba(255,108,138,0.5)") {
  for (const side of [-1, 1]) fillEll(cx + side * sep / 2, cy, r, r * 0.66, color);
}
// La boca. `kind` es la de siempre; las caras del momento la cambian. `x, y` es la comisura central.
function mouth(c, x, y, w, kind, ink = INK, o = {}) {
  const k = c.mood === "contenta" ? (o.happy || "smile") : c.mood === "fiesta" ? "open"
    : c.mood === "dormida" ? "sleep" : kind;
  if (k === "w") { // la boquita de gato, ω
    strokePath(() => { g.moveTo(x - w, y - 2); g.quadraticCurveTo(x - w * 0.5, y + w * 0.7, x, y); g.quadraticCurveTo(x + w * 0.5, y + w * 0.7, x + w, y - 2); }, ink, 3.6);
  } else if (k === "smile") {
    strokePath(() => { g.moveTo(x - w, y - 2); g.quadraticCurveTo(x, y + w * 0.85, x + w, y - 2); }, ink, 3.8);
  } else if (k === "flat") {
    strokePath(() => { g.moveTo(x - w, y); g.lineTo(x + w, y); }, ink, 3.8);
  } else if (k === "smirk") {
    strokePath(() => { g.moveTo(x - w, y + 2); g.quadraticCurveTo(x, y + w * 0.55, x + w, y - w * 0.4); }, ink, 3.8);
  } else if (k === "sleep") {
    strokePath(() => { g.moveTo(x - w * 0.4, y); g.quadraticCurveTo(x, y + w * 0.35, x + w * 0.4, y); }, ink, 3.4);
  } else if (k === "tongue") {
    g.beginPath(); rr(x - w * 0.42, y - 2, w * 0.84, w * 1.15, w * 0.42); g.fillStyle = "#ff8fa8"; g.fill();
    g.lineWidth = 3; g.strokeStyle = "#b64a62"; g.stroke();
    strokePath(() => { g.moveTo(x, y + 2); g.lineTo(x, y + w * 0.6); }, "#d4607e", 2.4);
    strokePath(() => { g.moveTo(x - w, y - 2); g.quadraticCurveTo(x - w * 0.5, y + w * 0.65, x, y - 1); g.quadraticCurveTo(x + w * 0.5, y + w * 0.65, x + w, y - 2); }, ink, 3.8);
  } else if (k === "open") { // riendo: D grande con lengua
    const h = w * 1.05;
    const shape = () => {
      g.moveTo(x - w, y - 2); g.quadraticCurveTo(x, y + 0, x + w, y - 2);
      g.bezierCurveTo(x + w * 0.9, y + h * 1.25, x - w * 0.9, y + h * 1.25, x - w, y - 2); g.closePath();
    };
    g.save();
    g.beginPath(); shape(); g.fillStyle = "#7a2236"; g.fill(); g.clip();
    fillEll(x, y + h * 1.05, w * 0.6, h * 0.5, "#ff7f9c");
    g.restore();
    strokePath(shape, ink, 3.6);
  }
}
function whiskers(x, y, len, color, n = 3, spread = 9) {
  for (const side of [-1, 1]) {
    for (let i = 0; i < n; i++) {
      const k = i - (n - 1) / 2;
      strokePath(() => {
        g.moveTo(x + side * 6, y + k * 4);
        g.quadraticCurveTo(x + side * len * 0.6, y + k * spread * 0.9 - 4, x + side * len, y + k * spread * 1.5);
      }, color, 2.6);
    }
  }
}

// Mueve la cabeza (la inclina y la baja al dormirse) alrededor del pivote del cuello. Devuelve
// cómo se mueve un punto de la cabeza, para los anclajes.
function headMove(c, px, py, fn) {
  g.save();
  g.translate(0, c.dy); g.translate(px, py); g.rotate(c.rot); g.translate(-px, -py);
  fn();
  g.restore();
  const cos = Math.cos(c.rot), sin = Math.sin(c.rot);
  return (x, y) => {
    const dx = x - px, dy = y - py;

// -- Pájaros -----------------------------------------------------------------------------------
// El pico: arriba el superior y abajo la mandíbula, con lo que se abre. `kind`: "corto", "ganchudo"
// o "grande" (guacamayo). `x, y` es la raíz del pico, entre los ojos y la boca.
function beakDraw(x, y, kind, color, open, c) {
  const k = kind === "grande" ? 1.4 : kind === "ganchudo" ? 1.22 : 0.62;
  const up = () => {
    if (kind === "corto") { g.moveTo(x - 12, y); g.quadraticCurveTo(x, y - 12, x + 12, y); g.quadraticCurveTo(x + 6, y + 18, x, y + 22); g.quadraticCurveTo(x - 6, y + 18, x - 12, y); }
    else { g.moveTo(x - 17 * k, y - 4); g.quadraticCurveTo(x, y - 26 * k, x + 17 * k, y - 4); g.quadraticCurveTo(x + 21 * k, y + 28 * k, x + 4 * k, y + 38 * k); g.quadraticCurveTo(x - 6 * k, y + 22 * k, x - 17 * k, y - 4); }
    g.closePath();
  };
  const len = kind === "corto" ? 22 : 30 * k;
  if (open > 0) {
    const my = y + len * 0.55 + open * 0.3;
    g.beginPath(); ell(x, my, 17 * k, 4 * k + open * 0.6); g.fillStyle = "#7a2236"; g.fill();
    fillEll(x, my + open * 0.3, 8 * k, 3.4 * k, "#ff7f9c");
    blob(() => ell(x, y + len * 0.55 + open * 1.1 + 6 * k, 12 * k, 6 * k), shadeOf(color), { lw: 3.5 });
  }
  blob(up, color, { lw: 4 });
  fillEll(x - 5 * k, y + 3, 2.4, 2.4, dark(color, 0.55));
  fillEll(x + 5 * k, y + 3, 2.4, 2.4, dark(color, 0.55));
  fillEll(x - 7 * k, y - 6 * k, 5 * k, 2.6 * k, "rgba(255,255,255,0.4)", -0.5);
}

  } });

  blob(() => { g.moveTo(-34, by - 66); g.quadraticCurveTo(-30, by - 112, -6, by - 92); g.quadraticCurveTo(10, by - 124, 22, by - 88); g.quadraticCurveTo(44, by - 100, 40, by - 62); g.closePath(); }, fin, { lw: 4 });
  const map = headMove(c, 0, by + 70, () => {
    for (const s of [-1, 1]) blob(() => { g.moveTo(s * 86, by + 6); g.quadraticCurveTo(s * 126, by - 2, s * 124, by + 42); g.quadraticCurveTo(s * 100, by + 46, s * 82, by + 32); g.closePath(); }, fin, { lw: 4 });

const FLOOR_Y = 292;
// El salón de casa: pared, ventana con cortina, planta, cuadro, suelo de tablas y alfombra.
function backdropHome(cols, night) {
  const wall = cols[0] || "#f3e3c8", floor = cols[1] || "#c98f5a", accent = cols[2] || "#7a9e7e";
  g.fillStyle = wall; g.fillRect(0, 0, W, H);
  g.fillStyle = alpha(dark(wall, 0.25), 0.1);
  for (let x = 0; x < W; x += 40) g.fillRect(x, 0, 20, FLOOR_Y);
  // zócalo
  g.fillStyle = mix(wall, floor, 0.28); g.fillRect(0, FLOOR_Y - 46, W, 46);
  g.fillStyle = alpha("#ffffff", 0.4); g.fillRect(0, FLOOR_Y - 48, W, 4);
  // suelo
  g.fillStyle = floor; g.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  g.fillStyle = dark(floor, 0.18); g.fillRect(0, FLOOR_Y, W, 6);
  g.strokeStyle = alpha(dark(floor, 0.4), 0.35); g.lineWidth = 2;
  for (let r = 0; r < 4; r++) {
    const y = FLOOR_Y + 6 + r * 26;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    for (let x = ((r * 97) % 150) - 30; x < W; x += 150) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 26); g.stroke(); }
  }
  // ventana
  const wx = 62, wy = 38, ww = 132, wh = 150;
  const sky = g.createLinearGradient(0, wy, 0, wy + wh);
  if (night) { sky.addColorStop(0, "#1b2250"); sky.addColorStop(1, "#46568f"); } else { sky.addColorStop(0, "#a9dcff"); sky.addColorStop(1, "#e6f6ff"); }
  g.beginPath(); rr(wx, wy, ww, wh, 10); g.fillStyle = sky; g.fill();
  g.save(); g.beginPath(); rr(wx, wy, ww, wh, 10); g.clip();
  if (night) {
    for (let i = 0; i < 9; i++) star(wx + 10 + rnd(5, i) * (ww - 20), wy + 10 + rnd(6, i) * 80, 2 + rnd(7, i) * 2.4, "#fff6c8", 4, 0.35);
    fillEll(wx + 98, wy + 38, 17, 17, "#fff3c0"); fillEll(wx + 106, wy + 33, 15, 15, "#2a3470");
  } else {
    fillEll(wx + 40, wy + 40, 22, 11, "#ffffff"); fillEll(wx + 58, wy + 36, 17, 12, "#ffffff"); fillEll(wx + 100, wy + 70, 18, 9, "#ffffffcc");
    fillEll(wx + 90, wy + wh, 70, 26, "#a8d49a");

function kIcon(key, cx, cy, s, color) {
  g.save(); g.translate(cx, cy); g.scale(s / 20, s / 20);
  g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round"; g.lineWidth = 3.4;
  const dot = (x, y, rx, ry = rx, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); };
  if (key === "pata") {
    dot(0, 6, 10, 8.5);
    dot(-11, -5, 4.2, 5.4, -0.4); dot(-4, -12, 4.2, 5.4, -0.15); dot(4, -12, 4.2, 5.4, 0.15); dot(11, -5, 4.2, 5.4, 0.4);
  } else if (key === "cabeza") {
    g.beginPath(); g.ellipse(0, 8, 17, 4.5, 0, 0, TAU); g.fill();
    g.beginPath(); rr(-9, -14, 18, 21, 3); g.fill();
  } else if (key === "ojos") {
    g.beginPath(); g.arc(-8, 2, 7, 0, TAU); g.stroke(); g.beginPath(); g.arc(8, 2, 7, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(-1.5, 0); g.quadraticCurveTo(0, -3, 1.5, 0); g.stroke();
  } else if (key === "cuello") {
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-14, -9); g.lineTo(-14, 9); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(0, 0); g.lineTo(14, -9); g.lineTo(14, 9); g.closePath(); g.fill(); dot(0, 0, 4);
  } else if (key === "cuerpo") {
    g.beginPath(); g.moveTo(-7, -14); g.lineTo(-17, -8); g.lineTo(-13, 0); g.lineTo(-9, -2); g.lineTo(-9, 14);
    g.lineTo(9, 14); g.lineTo(9, -2); g.lineTo(13, 0); g.lineTo(17, -8); g.lineTo(7, -14); g.quadraticCurveTo(0, -8, -7, -14); g.fill();
  } else if (key === "fondo") {
    g.beginPath(); rr(-16, -12, 32, 24, 3); g.stroke();
    g.beginPath(); g.moveTo(-13, 9); g.lineTo(-4, -2); g.lineTo(3, 5); g.lineTo(7, 1); g.lineTo(13, 9); g.fill(); dot(7, -5, 3);
  } else if (key === "llama") {
    g.beginPath(); g.moveTo(0, -17); g.bezierCurveTo(9, -6, 15, 2, 12, 9); g.bezierCurveTo(9, 17, -9, 17, -12, 9);
    g.bezierCurveTo(-14, 2, -8, -2, -6, -9); g.bezierCurveTo(-3, -4, -1, -3, 0, -17); g.fill();
    g.fillStyle = "rgba(255,255,255,0.55)"; g.beginPath(); g.ellipse(0, 8, 5, 6.5, 0, 0, TAU); g.fill();
  } else if (key === "truco") {
    kStar(0, 0, 15, color);
  } else if (key === "casa") {
    g.beginPath(); g.moveTo(-16, -2); g.lineTo(0, -15); g.lineTo(16, -2); g.lineTo(12, -2); g.lineTo(12, 14); g.lineTo(-12, 14); g.lineTo(-12, -2); g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,0.75)"; g.fillRect(-4, 3, 8, 11);
  }
  g.restore();
}

// El papel del fondo, con un dibujo de olas muy suave (el de `pisos`).
function kPaper() {
  const gr = g.createLinearGradient(0, 0, CW * 0.35, CH);
  gr.addColorStop(0, "#fdf6e6"); gr.addColorStop(1, "#f1e2c2");
  g.fillStyle = gr; g.fillRect(0, 0, CW, CH);
  g.strokeStyle = "rgba(180,140,70,0.09)"; g.lineWidth = 2;
  for (let y = 110; y < CH; y += 46) for (let x = ((y / 46) % 2) * 30 - 20; x < CW; x += 60) {
    g.beginPath(); g.arc(x + 15, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.arc(x + 45, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
}
// La cabecera: degradado del color del pasillo, rayas, insignia con la huella, nombre y especie.
function kHeader(card, right) {
  const main = (card.theme && card.theme[0]) || "#2f7d4f", accent = (card.theme && card.theme[1]) || GOLD, hh = 92;
  const gr = g.createLinearGradient(0, 0, CW, 0);
  gr.addColorStop(0, mix(main, "#ffffff", 0.08)); gr.addColorStop(1, mix(main, "#000000", 0.22));
  g.fillStyle = gr; g.fillRect(0, 0, CW, hh);
  g.save(); g.beginPath(); g.rect(0, 0, CW, hh); g.clip(); g.globalAlpha = 0.07; g.fillStyle = accent;
  for (let x = -hh; x < CW; x += 34) { g.beginPath(); g.moveTo(x, hh); g.lineTo(x + 16, hh); g.lineTo(x + 16 + hh, 0); g.lineTo(x + hh, 0); g.closePath(); g.fill(); }
  g.restore();
  g.fillStyle = accent; g.fillRect(0, hh - 4, CW, 4);
  // la insignia
  const bx = 52, by = hh / 2 - 2, br = 33;
  g.beginPath(); g.arc(bx, by + 3, br, 0, TAU); g.fillStyle = "rgba(0,0,0,0.25)"; g.fill();
  g.beginPath(); g.arc(bx, by, br, 0, TAU); g.fillStyle = accent; g.fill();
  g.beginPath(); g.arc(bx, by, br - 5, 0, TAU); g.fillStyle = mix(main, "#000000", 0.1); g.fill();
  kIcon("pata", bx, by + 1, 19, accent);
  const rightW = right ? right(hh) : 0, maxW = CW - 104 - rightW - 30;
  kTitle(card.title || "", 100, hh / 2 - 15, maxW, 40, 20, accent, { shadow: "rgba(0,0,0,0.35)" });
  kLine(card.sub || "", 102, hh / 2 + 21, maxW, MED, 21, 14, mix(accent, main, 0.18));
}
// La escena (640 × 400) dentro de un marco redondeado.
function kFrame(x, y, w, h, draw) {
  g.save();
  g.beginPath(); rr(x, y + 4, w, h, 16); g.fillStyle = "rgba(92,58,20,0.18)"; g.fill();
  g.beginPath(); rr(x, y, w, h, 16); g.clip();
  g.translate(x, y); g.scale(w / W, h / H);
  draw();
  g.restore();
  g.beginPath(); rr(x, y, w, h, 16); g.lineWidth = 2; g.strokeStyle = "rgba(0,0,0,0.15)"; g.stroke();
}
// Diez corazones: los del nivel, llenos.
function kHearts(x, y, level, gap = 28) {
  for (let i = 0; i < 10; i++) {
    const on = i < level;
    heart(x + i * gap, y, 1.0, on ? "#ff5d8f" : "#efe3d0", on ? "#a02a52" : "#cdbb9e");
  }
}
function kBond(c, x, y, w) {
  kCard(x, y, w, 118, { top: "#ff5d8f" });
  kLabel("Vínculo", x + 18, y + 26);
  kLine(c.xp || "", x + w - 18, y + 26, w - 130, MED, 15, 11, MUTE, "right");
  kTitle(`Nivel ${c.level ?? 0}`, x + 18, y + 58, w - 36, 34, 20, "#3b2a40");
  kHearts(x + 30, y + 94, c.level ?? 0, (w - 60) / 9);
}
function kKind(c, x, y, w) {
  kCard(x, y, w, 84);
  kLabel(c.rarity || "", x + 18, y + 24);
  const n = c.stars || 1;
  for (let i = 0; i < 5; i++) kStar(x + 26 + i * 26, y + 54, 11, i < n ? GOLD : "#e3d8bc", i < n ? "rgba(160,110,10,0.5)" : null);
  kLine(c.breed || "", x + w - 18, y + 24, w - 140, BOLD, 17, 12, "#3b2a40", "right");
  kLine(c.breedNote || "", x + w - 18, y + 54, w - 160, MED, 15, 11, MUTE, "right");
}
function kStreak(c, x, y, w) {
  kCard(x, y, w, 72);
  kIcon("llama", x + 34, y + 36, 16, c.streak ? "#f58220" : "#cdbb9e");
  kLine(c.streak ? `${c.streak} día${c.streak === 1 ? "" : "s"} de racha` : "Sin racha", x + 62, y + 27, w - 80, BOLD, 19, 13, "#3b2a40");
  kLine(c.streakNote || "", x + 62, y + 50, w - 80, MED, 15, 11, MUTE);
}
function kWearing(c, x, y, w, h) {
  kCard(x, y, w, h);
  kLabel("Lleva puesto", x + 18, y + 24);
  const rows = (c.wearing || []).slice(0, 5);
  if (!rows.length) {
    kLine("Nada todavía.", x + 18, y + 58, w - 36, BOLD, 18, 12, "#3b2a40");
    kWrap("Vístela con el botón Vestir: sombreros, gafas, collares, ropa y fondos.", w - 36, MED(15), 3)
      .forEach((l, i) => kText(l, x + 18, y + 86 + i * 21, MED(15), MUTE));
    return;
  }
  const step = Math.min(34, (h - 44) / rows.length);
  rows.forEach((r, i) => {
    const ry = y + 52 + i * step;
    g.beginPath(); g.arc(x + 32, ry, 14, 0, TAU); g.fillStyle = "#f3e7cf"; g.fill();
    kIcon(r.slot, x + 32, ry, 9.5, "#8a6a3a");
    kLine(r.name || "", x + 56, ry, w - 74, MED, 17, 11, "#3b2a40");
  });
}
function kQuote(c, x, y, w, h) {
  kCard(x, y, w, h);
  g.font = LUCK(54); g.fillStyle = "rgba(160,120,60,0.22)"; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillText("«", x + 12, y + 56);
  const lines = kWrap(c.quote || "", w - 80, MED(21), 2), lh = 27;
  const top = y + (c.tricks ? 34 : h / 2 - ((lines.length - 1) * lh) / 2);
  lines.forEach((l, i) => kText(l, x + 52, top + i * lh, MED(21), "#3b2a40"));
  if (c.tricks) {
    g.fillStyle = "rgba(160,120,60,0.18)"; g.fillRect(x + 52, y + h - 40, w - 70, 1.5);
    kIcon("truco", x + 62, y + h - 20, 9, GOLD);
    kLine(c.tricks, x + 80, y + h - 20, w - 98, MED, 16, 11, MUTE);
  }
}
const MOOD_CHIP = { contenta: ["Contenta", "#e85d8f"], dormida: ["Durmiendo", "#3b4f8a"], fiesta: ["De fiesta", "#f2a900"] };

function paintCard(st, debug) {
  const c = st.card || {};
  kPaper();
  kHeader(c, (hh) => {
    let x = CW - 24, used = 0;
    if (c.active) { const w = kChip("Va contigo", x, hh / 2 - 19, "#1f9d55", "#fff", { align: "right", size: 22 }); x -= w + 10; used += w + 10; }
    const mood = MOOD_CHIP[st.mood];
    if (mood) { const w = kChip(mood[0], x, hh / 2 - 16, mood[1], "#fff", { align: "right", size: 18 }); used += w + 10; }
    return used;
  });
  const fx = 16, fy = 106, fw = 624, fh = 390;
  kFrame(fx, fy, fw, fh, () => paintPortrait(st, false, debug));
  kQuote(c, fx, fy + fh + 12, fw, CH - 16 - (fy + fh + 12));
  const px = 656, pw = CW - 16 - px;
  kBond(c, px, 106, pw);
  kKind(c, px, 236, pw);
  kStreak(c, px, 332, pw);
  kWearing(c, px, 416, pw, CH - 16 - 416);
}
// Una visita: las dos en la escena y una tarjeta por mascota.
function paintVisit(st, debug) {
  const c = st.card || {};
  kPaper();
  kHeader(c, (hh) => kChip("De visita", CW - 24, hh / 2 - 19, "#1f6fb2", "#fff", { align: "right", size: 22 }) + 10);
  const fx = 16, fy = 106, fw = 624, fh = 390;
  kFrame(fx, fy, fw, fh, () => paintPortrait(st, false, debug));
  kQuote(c, fx, fy + fh + 12, fw, CH - 16 - (fy + fh + 12));
  const px = 656, pw = CW - 16 - px, guests = (c.guests || []).slice(0, 2);
  guests.forEach((gst, i) => {
    const y = 106 + i * 172;
    kCard(px, y, pw, 160, { top: i ? "#1f6fb2" : "#ff5d8f" });
    kIcon("casa", px + 30, y + 32, 12, i ? "#1f6fb2" : "#c9c0b0");
    kLine(gst.role || "", px + 52, y + 32, pw - 70, BOLD, 14, 11, MUTE);
    kTitle(gst.name || "", px + 18, y + 66, pw - 36, 28, 16, "#3b2a40");
    kLine(gst.sub || "", px + 18, y + 98, pw - 36, MED, 16, 11, MUTE);
    kHearts(px + 30, y + 132, gst.level || 0, (pw - 60) / 9);
  });
  kCard(px, 450, pw, CH - 16 - 450);
  kIcon("pata", px + 32, 450 + 36, 13, "#ff5d8f");
  kWrap(c.note || "", pw - 70, MED(17), 4).forEach((l, i) => kText(l, px + 56, 450 + 30 + i * 23, MED(17), "#3b2a40"));
}
// Una foto del álbum: la instantánea grande sobre el papel, con su cabecera.
function paintAlbum(st, debug) {
  const c = st.card || {};
  kPaper();
  kHeader({ ...c, sub: c.sub || "" }, (hh) => kChip("Álbum", CW - 24, hh / 2 - 19, "#7a5aa8", "#fff", { align: "right", size: 22 }) + 10);
  g.save();
  const k = 1.33;
  g.translate(CW / 2 - (W * k) / 2, 104);
  g.scale(k, k);
  g.beginPath(); g.rect(0, 0, W, H); g.clip();
  paintPolaroid(st, debug, true);
  g.restore();
}

// -- Entrada -------------------------------------------------------------------------------------

function paintPortrait(st, plate, debug) {
  const night = st.mood === "dormida";
  paintBackdrop(st.backdrop, night, st.seed | 0);
  sceneLight(night);
  const pets = Array.isArray(st.pets) ? st.pets.slice(0, 2) : [];
  const duo = pets.length === 2;
  const gy = 345;
  const shift = st.cake ? (duo ? -130 : -90) : 0;
  const spots = duo ? [[190 + shift, 0.74, false, 0.1], [450 + shift, 0.74, true, 0.1]] : [[320 + shift, 1, false, 0]];
  if (st.mood === "fiesta") paintConfetti(st.seed | 0, false);
  if (st.cake) paintCake(duo ? 520 : 480, gy);
  const placed = pets.map((pet, i) => drawPet(pet, st, spots[i][0], gy, spots[i][1] * (PLAN_SIZE[pet.plan] || 1), spots[i][2], spots[i][3]));
  for (const a of placed) {
    if (st.mood === "contenta") paintHearts(a, st.seed | 0);
    if (st.mood === "dormida") paintZ(a);
  }
  if (st.mood === "fiesta") paintConfetti(st.seed | 0, true);
  if (debug) for (const a of placed) debugAnchors(a);
}
// El retrato dentro de un marco de foto instantánea, algo inclinado, con el texto abajo.
function paintPolaroid(st, debug, onPaper = false) {
  if (!onPaper) {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#dcd6cc"); bg.addColorStop(1, "#bcb4a8");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
  }
  const fw = 416, fh = 336, pw = 376, ph = 236;
  g.save();
  g.translate(320, 198); g.rotate(-0.04);
  g.beginPath(); rr(-fw / 2 + 4, -fh / 2 + 8, fw, fh, 6); g.fillStyle = "rgba(50,40,30,0.3)"; g.fill();
  g.beginPath(); rr(-fw / 2, -fh / 2, fw, fh, 6); g.fillStyle = "#fffdf8"; g.fill(); g.lineWidth = 2; g.strokeStyle = "#d9d2c4"; g.stroke();
  const px = -pw / 2, py = -fh / 2 + 20;
  g.save();
  g.beginPath(); g.rect(px, py, pw, ph); g.clip();
  const k = pw / 528;
  g.translate(px + pw / 2, py + ph / 2); g.scale(k, k); g.translate(-320, -196);
  paintPortrait({ ...st, plate: null }, false, debug);
  g.restore();
  g.lineWidth = 2; g.strokeStyle = "rgba(60,40,60,0.25)"; g.strokeRect(px, py, pw, ph);
  fitText(clean(st.caption), 0, py + ph + 50, fw - 56, 24, 12, MONT, "#4a3a50", "center", "700");
  g.restore();
}
function sceneFrame(st, debug) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, CW, CH);
  g.lineCap = "round"; g.lineJoin = "round"; g.globalAlpha = 1; g.setLineDash([]);
  if (st.caption) paintAlbum(st, debug);
  else if ((st.pets || []).length > 1) paintVisit(st, debug);
  else paintCard(st, debug);
  octx.clearRect(0, 0, CW, CH);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, CW * S, CH * S, 0, 0, CW, CH);
  return { x: 0, y: 0, u: window.exportFrame(out) };
}

let META = {};
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("700 20px Montserrat"), document.fonts.load("20px RobotoM"), document.fonts.load("20px RobotoR"), document.fonts.load("20px Luckiest")]);
  await document.fonts.ready;
  return true;
};
window.setup = async (meta) => { META = meta || {}; return true; };
window.renderFrames = (states, first = 0) => states.map((st) => {
  if (!st || typeof st !== "object" || !Array.isArray(st.pets)) throw new Error("Estado del retrato incompleto");
  return sceneFrame(st, !!(META.debug || st.debug));
});

})();
</script>
