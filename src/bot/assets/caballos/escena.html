<!doctype html>
<!--
Escena de las carreras de caballos (ver bot/services/horses_scene.py). La
carrera (setupRace, renderFrames, renderPodium) es solo canvas y la pinta Node
con Skia, sin navegador (assets/escena_node.cjs); la parrilla y el boleto
(renderCard, renderTicket) son HTML/CSS con captura de pantalla y siguen en
Chromium. Si no hay Node, la carrera también la pinta Chromium.

No decide nada: Python le pasa dónde está cada caballo en cada fotograma (la
carrera ya está resuelta) y aquí solo se pinta. Funciones que llama Python:

- setupRace(meta)      prepara el fondo de una carrera (grada, pista, postes).
- renderFrames(states) dibuja los fotogramas y devuelve cada uno entero
                       (data URL de PNG en Chromium, píxeles en Node).
- renderPodium(data)   el último fotograma: la llegada, con la foto-finish.
- renderCard(data)     la parrilla de salida (HTML), para hacerle captura.
- renderTicket(data)   el boleto (HTML), para hacerle captura.

Todo se dibuja al doble de tamaño (S = 2) y se reduce al copiarlo al lienzo de
salida: bordes suaves sin dientes de sierra. Las fuentes son las del bot
(Luckiest Guy de los Botes y Montserrat de los memes).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  @font-face { font-family: "Roboto"; src: url("../memes/fonts/robotomedium.ttf"); font-weight: 500; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Montserrat", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; }
  #stage > * { display: block; }

  /* -- Parrilla ------------------------------------------------------------- */
  .card {
    width: 640px; box-sizing: border-box; padding: 0 0 14px;
    background: linear-gradient(180deg, #16241a 0%, #111317 120px, #0e0f13 100%);
    color: #f2f3f5; border-radius: 0; overflow: hidden; position: relative;
  }
  .card.gp { background: linear-gradient(180deg, #3a2a05 0%, #17130a 130px, #0e0f13 100%); }
  .head { position: relative; padding: 18px 22px 14px; overflow: hidden; }
  .head::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 18px, transparent 18px 36px);
    pointer-events: none;
  }
  .kicker { font: 700 11px "Montserrat"; letter-spacing: .22em; color: #7fd18b; text-transform: uppercase; }
  .gp .kicker { color: #ffd34d; }
  .title { font: 30px/1.05 "Luckiest"; letter-spacing: .02em; margin-top: 4px; text-shadow: 0 2px 0 #000a; }
  .gp .title { color: #ffd34d; }
  .facts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .fact {
    font: 700 12px "Montserrat"; padding: 5px 10px; border-radius: 999px;
    background: #ffffff12; border: 1px solid #ffffff1c; display: flex; align-items: center; gap: 6px;
  }
  .fact svg { width: 15px; height: 15px; }
  .fact.pot { background: linear-gradient(90deg, #ffcf3a, #ff9f1a); color: #231600; border: 0; }
  .cols {
    display: grid; grid-template-columns: 42px 1fr 132px 92px; gap: 10px;
    padding: 0 22px 6px; font: 700 10px "Montserrat"; color: #8b92a0; letter-spacing: .14em;
  }
  .cols div:last-child { text-align: right; }
  .row {
    display: grid; grid-template-columns: 42px 1fr 132px 92px; gap: 10px; align-items: center;
    margin: 0 12px; padding: 7px 10px; border-radius: 12px; position: relative;
  }
  .row:nth-child(even) { background: #ffffff08; }
  .row.fav { background: linear-gradient(90deg, #ffd34d1a, transparent 70%); }
  .jersey { width: 42px; height: 42px; position: relative; }
  .jersey svg { width: 42px; height: 42px; filter: drop-shadow(0 2px 2px #0008); }
  .jersey b {
    position: absolute; left: 0; right: 0; top: 13px; text-align: center;
    font: 17px "Luckiest"; color: #fff; -webkit-text-stroke: 1.2px #000; paint-order: stroke fill;
  }
  .name { font: 700 17px "Montserrat"; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; font: 500 11px "Roboto"; color: #9aa1ad; }
  .form { display: flex; gap: 3px; }
  .form i {
    font: 700 10px "Montserrat"; font-style: normal; width: 16px; height: 16px; border-radius: 4px;
    display: grid; place-items: center; background: #ffffff14; color: #c9ced6;
  }
  .form i.p1 { background: #ffcf3a; color: #241800; }
  .form i.p2 { background: #c9d1dc; color: #111; }
  .form i.p3 { background: #cd8a4a; color: #1b0d00; }
  .tag { padding: 1px 6px; border-radius: 5px; font: 700 10px "Montserrat"; }
  .tag.tired { background: #e8434326; color: #ff8a8a; }
  .tag.likes { background: #ffffff10; color: #c9ced6; display: flex; gap: 4px; align-items: center; }
  .tag.likes svg { width: 12px; height: 12px; }
  .tag.likes.match { background: #3bd16f26; color: #7ff0a4; }
  .bar { height: 8px; border-radius: 99px; background: #ffffff12; overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 99px; }
  .pct { font: 700 10px "Montserrat"; color: #8b92a0; margin-top: 4px; }
  .odds { text-align: right; font: 26px "Luckiest"; letter-spacing: .02em; }
  .fav .odds { color: #ffd34d; text-shadow: 0 0 18px #ffb80055; }
  .stamp {
    position: absolute; right: 118px; top: 1px; transform: rotate(-6deg);
    font: 700 10px "Montserrat"; color: #fff; background: #d8262f; padding: 4px 8px;
    border-radius: 6px; letter-spacing: .08em; box-shadow: 0 2px 6px #0008; border: 1.5px dashed #ffffff88;
  }
  .foot { padding: 10px 22px 0; font: 500 11px "Roboto"; color: #7c8391; }

  /* -- Boleto --------------------------------------------------------------- */
  .ticket {
    width: 560px; height: 236px; position: relative; padding: 10px; box-sizing: border-box;
    background: transparent;
  }
  .paper {
    position: absolute; inset: 10px; border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(120% 90% at 20% 0%, #fffdf3 0%, #f6eed6 55%, #eadfbf 100%);
    box-shadow: 0 8px 22px #0007, inset 0 0 0 1px #d8c79a;
    display: grid; grid-template-columns: 128px 1fr;
  }
  .paper::before {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(0deg, #00000006 0 1px, transparent 1px 3px);
  }
  .stub {
    position: relative; border-right: 2px dashed #c9b37a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; color: #2a2116;
  }
  .stub small { font: 700 10px "Montserrat"; letter-spacing: .2em; color: #8a7650; }
  .stub .num { font: 38px "Luckiest"; letter-spacing: .02em; }
  .stub .kind {
    font: 700 11px "Montserrat"; letter-spacing: .14em; background: #2a2116; color: #f6eed6;
    padding: 3px 8px; border-radius: 5px;
  }
  .barcode { width: 92px; height: 26px; margin-top: 6px;
    background: repeating-linear-gradient(90deg, #2a2116 0 2px, transparent 2px 3px, #2a2116 3px 4px, transparent 4px 7px);
  }
  .body { position: relative; padding: 16px 18px; color: #2a2116; }
  .body .race { font: 700 11px "Montserrat"; letter-spacing: .16em; color: #8a7650; text-transform: uppercase; }
  .body .player { font: 28px "Luckiest"; margin-top: 2px; }
  .picks { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .pick { display: flex; align-items: center; gap: 8px; font: 700 14px "Montserrat"; }
  .pick svg { width: 22px; height: 22px; }
  .money { display: flex; gap: 18px; margin-top: 10px; }
  .money div small { display: block; font: 700 9px "Montserrat"; letter-spacing: .16em; color: #8a7650; }
  .money div b { font: 20px "Luckiest"; }
  .pot { margin-top: 6px; font: 700 12px "Montserrat"; color: #a36a00; }
  .notch { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #1e1f24; left: 128px; }
  .notch.top { top: -11px; margin-left: -11px; }
  .notch.bot { bottom: -11px; margin-left: -11px; }
  .premiado {
    position: absolute; right: 14px; top: 66px; transform: rotate(-12deg);
    font: 40px "Luckiest"; color: #d3202bd0; padding: 2px 14px 0; border: 5px solid #d3202bd0;
    border-radius: 12px; letter-spacing: .04em; mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 60%, #0008 80%, #000 100%);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
const S = 2;                       // se dibuja al doble y se reduce
const W = 640, H = 360;
const TRACK_TOP = 144, TRACK_BOTTOM = 318, HUD_TOP = 318;
let META = null;                   // la carrera actual (setupRace)
let BG = {};                       // fondos pintados una vez: seco y mojado
let PARTICLES = [];                // polvo que levantan los cascos

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const out = document.createElement("canvas"); out.width = W; out.height = H;
const bctx = big.getContext("2d");
const octx = out.getContext("2d");
octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";

const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, k) => c.map(v => Math.max(0, Math.min(255, Math.round(v * k))));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {            // azar repetible (mulberry32): mismo dibujo para la misma carrera
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const luminance = c => 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];

// -- Carriles con profundidad: el 1 al fondo (más pequeño), el último delante --------------

function laneY(i) {             // y (a 1x) de los cascos del caballo i
  const n = META.horses.length;
  return lerp(TRACK_TOP + 26, TRACK_BOTTOM - 6, n === 1 ? 1 : i / (n - 1));
}
function laneScale(i) {
  const n = META.horses.length;
  // Con 8 caballos se encogen un poco para que no se pisen.
  const k = n >= 8 ? 0.72 : 0.8;
  return k * lerp(0.72, 1.0, n === 1 ? 1 : i / (n - 1));
}

// -- Fondo -------------------------------------------------------------------------------------

const TRACK = { seco: [196, 160, 108], blando: [160, 122, 82], barro: [112, 82, 56] };

function paintBackground(going) {
  const c = document.createElement("canvas"); c.width = W * S; c.height = H * S;
  const g = c.getContext("2d"); g.scale(S, S);
  const r = rng(META.seed);
  const wet = going !== "seco";

  // Cielo y nubes.
  const sky = g.createLinearGradient(0, 0, 0, 90);
  if (wet) { sky.addColorStop(0, "#5d6b7d"); sky.addColorStop(1, "#9aa6b4"); }
  else { sky.addColorStop(0, "#5aa7ea"); sky.addColorStop(1, "#bfe3fb"); }
  g.fillStyle = sky; g.fillRect(0, 0, W, 92);
  g.fillStyle = wet ? "rgba(70,78,92,.55)" : "rgba(255,255,255,.75)";
  for (let k = 0; k < 6; k++) {
    const x = r() * W, y = 10 + r() * 26, s = 18 + r() * 22;
    for (let j = 0; j < 4; j++) { g.beginPath(); g.ellipse(x + j * s * .6, y + Math.sin(j) * 4, s * .7, s * .38, 0, 0, 7); g.fill(); }
  }
  // Montañas al fondo (el Teide, cómo no).
  g.fillStyle = wet ? "#6c7a74" : "#7fa38a";
  g.beginPath(); g.moveTo(0, 86);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, 70 + Math.sin(x / 57) * 7 + Math.sin(x / 23) * 3);
  g.lineTo(W, 92); g.lineTo(0, 92); g.fill();
  g.fillStyle = wet ? "#77818a" : "#9c8f86";
  g.beginPath(); g.moveTo(420, 86); g.lineTo(492, 40); g.lineTo(506, 37); g.lineTo(580, 86); g.fill();
  g.fillStyle = "#f3f5f8"; g.beginPath(); g.moveTo(480, 48); g.lineTo(492, 40); g.lineTo(506, 37); g.lineTo(518, 47); g.lineTo(505, 45); g.lineTo(495, 50); g.fill();

  // Grada con tejado, columnas y público.
  const standTop = 52, standBottom = 118;
  const st = g.createLinearGradient(0, standTop, 0, standBottom);
  st.addColorStop(0, "#2a2f3c"); st.addColorStop(1, "#3c4252");
  g.fillStyle = st; g.fillRect(0, standTop + 8, W, standBottom - standTop - 8);
  const colors = ["#e85b5b", "#f2c94c", "#5b9bf0", "#f5f5f5", "#6fd38b", "#c37df0", "#ff9f43", "#2d2d36"];
  for (let row = 0; row < 7; row++) {
    for (let x = 2 + (row % 2) * 3; x < W; x += 6) {
      const y = standTop + 16 + row * 6.6;
      g.fillStyle = colors[Math.floor(r() * colors.length)];
      g.beginPath(); g.arc(x + r(), y, 2.2, 0, 7); g.fill();
      g.fillStyle = "rgba(255,224,190,.85)";
      g.beginPath(); g.arc(x + r() * .6, y - 2.6, 1.3, 0, 7); g.fill();
    }
  }
  // Tejado con voladizo y columnas.
  g.fillStyle = "#c62f3a"; g.fillRect(0, standTop, W, 9);
  g.fillStyle = "#8f1f28"; g.fillRect(0, standTop + 9, W, 2);
  for (let x = 0; x < W; x += 16) { g.fillStyle = x % 32 ? "#e6e6e6" : "#c62f3a";
    g.beginPath(); g.moveTo(x, standTop + 11); g.lineTo(x + 8, standTop + 16); g.lineTo(x + 16, standTop + 11); g.fill(); }
  g.fillStyle = "rgba(0,0,0,.35)";
  for (let x = 40; x < W; x += 120) g.fillRect(x, standTop + 11, 3, standBottom - standTop - 11);
  // Banderines.
  for (let x = 30; x < W; x += 74) {
    g.strokeStyle = "#ddd"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, standTop); g.lineTo(x, standTop - 14); g.stroke();
    g.fillStyle = ["#c62f3a", "#f2c94c", "#2f80ed"][Math.floor(x / 74) % 3];
    g.beginPath(); g.moveTo(x, standTop - 14); g.lineTo(x + 11, standTop - 11); g.lineTo(x, standTop - 8); g.fill();
  }

  // Césped del interior con franjas de corte.
  g.fillStyle = wet ? "#4f7d47" : "#5f9a4f"; g.fillRect(0, standBottom, W, TRACK_TOP - standBottom);
  for (let x = -40; x < W; x += 40) { g.fillStyle = "rgba(255,255,255,.06)";
    g.beginPath(); g.moveTo(x, standBottom); g.lineTo(x + 20, standBottom); g.lineTo(x + 34, TRACK_TOP); g.lineTo(x + 14, TRACK_TOP); g.fill(); }
  // Seto y barandilla del fondo.
  g.fillStyle = "#2f6b33"; g.fillRect(0, TRACK_TOP - 18, W, 10);
  for (let x = 0; x < W; x += 7) { g.fillStyle = "#3a7d3d"; g.beginPath(); g.arc(x, TRACK_TOP - 18, 4.5, Math.PI, 0); g.fill(); }
  rail(g, TRACK_TOP - 8);

  // Pista de tierra con textura y huellas.
  const base = TRACK[going];
  const tg = g.createLinearGradient(0, TRACK_TOP, 0, TRACK_BOTTOM);
  tg.addColorStop(0, rgb(shade(base, .86))); tg.addColorStop(1, rgb(shade(base, 1.06)));
  g.fillStyle = tg; g.fillRect(0, TRACK_TOP, W, TRACK_BOTTOM - TRACK_TOP);
  for (let k = 0; k < 2600; k++) {
    const x = r() * W, y = TRACK_TOP + r() * (TRACK_BOTTOM - TRACK_TOP);
    g.fillStyle = r() < .5 ? `rgba(0,0,0,${.05 + r() * .06})` : `rgba(255,255,255,${.04 + r() * .05})`;
    g.fillRect(x, y, 1 + r() * 1.6, .8);
  }
  if (wet) {            // charcos que reflejan el cielo
    for (let k = 0; k < 14; k++) {
      const x = r() * W, y = TRACK_TOP + 12 + r() * (TRACK_BOTTOM - TRACK_TOP - 20);
      g.fillStyle = "rgba(170,186,204,.28)"; g.beginPath(); g.ellipse(x, y, 10 + r() * 22, 2 + r() * 2.5, 0, 0, 7); g.fill();
    }
  }
  // Distancias y meta.
  for (const m of META.markers) {
    g.fillStyle = "#fff"; g.fillRect(m.x - 1.5, TRACK_TOP - 34, 3, 26);
    g.fillStyle = "#d8262f"; g.beginPath(); g.arc(m.x, TRACK_TOP - 36, 7, 0, 7); g.fill();
    g.fillStyle = "#fff"; g.font = "700 7px Montserrat"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(m.label, m.x, TRACK_TOP - 36);
  }
  // Poste de meta: franja de espejo en la pista y disco rojo arriba.
  const fx = META.finishX;
  g.fillStyle = "rgba(255,255,255,.85)"; g.fillRect(fx - 1.4, TRACK_TOP, 2.8, TRACK_BOTTOM - TRACK_TOP);
  g.fillStyle = "#fff"; g.fillRect(fx - 3, TRACK_TOP - 56, 6, 50);
  g.fillStyle = "#d8262f"; g.beginPath(); g.arc(fx, TRACK_TOP - 60, 12, 0, 7); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
  g.fillStyle = "#fff"; g.font = "9px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("META", fx, TRACK_TOP - 59);
  // Barandilla de delante (tapa un poco las patas del último carril: da profundidad).
  rail(g, TRACK_BOTTOM - 4);

  // Marcador de abajo (fondo; el texto va en cada fotograma).
  const hud = g.createLinearGradient(0, HUD_TOP, 0, H);
  hud.addColorStop(0, "#14161c"); hud.addColorStop(1, "#0b0c10");
  g.fillStyle = hud; g.fillRect(0, HUD_TOP, W, H - HUD_TOP);
  g.fillStyle = META.gp ? "#ffcf3a" : "#3bd16f"; g.fillRect(0, HUD_TOP, W, 2);
  return c;
}

function rail(g, y) {
  g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, y + 6, W, 3);
  g.fillStyle = "#f4f4f4"; g.fillRect(0, y, W, 4);
  g.fillStyle = "#d9d9d9"; g.fillRect(0, y + 4, W, 1.5);
  for (let x = 6; x < W; x += 28) { g.fillStyle = "#e9e9e9"; g.fillRect(x, y + 4, 2.4, 6); }
}

// -- El caballo ---------------------------------------------------------------------------------

// Galope: cada pata tiene su desfase en el ciclo (secuencia del galope transversal).
const LEGS = [
  { hip: [-27, -3], phase: 0.00, far: true, hind: true },
  { hip: [-24, -2], phase: 0.12, far: false, hind: true },
  { hip: [17, -1], phase: 0.48, far: true, hind: false },
  { hip: [20, 0], phase: 0.60, far: false, hind: false },
];

function leg(g, x, y, l, cycle, coat, scale) {
  const p = ((cycle + l.phase) % 1 + 1) % 1;
  const swing = Math.sin(p * Math.PI * 2);
  const lift = Math.max(0, Math.sin(p * Math.PI * 2 + 1.2));
  const upper = (l.hind ? 15 : 14), lower = (l.hind ? 15 : 14);
  const a1 = (l.hind ? 0.15 : -0.05) + swing * (l.hind ? 0.55 : 0.6);
  const kx = x + l.hip[0] + Math.sin(a1) * upper, ky = y + l.hip[1] + Math.cos(a1) * upper;
  const bend = (l.hind ? -1 : 1) * (0.25 + lift * 1.15);
  const a2 = a1 + bend;
  const hx = kx + Math.sin(a2) * lower, hy = ky + Math.cos(a2) * lower;
  const color = l.far ? rgb(shade(coat, .62)) : rgb(coat);
  g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
  g.lineWidth = l.hind ? 6.4 : 5.4;
  g.beginPath(); g.moveTo(x + l.hip[0], y + l.hip[1]); g.lineTo(kx, ky); g.stroke();
  g.lineWidth = 3.4; g.beginPath(); g.moveTo(kx, ky); g.lineTo(hx, hy); g.stroke();
  g.fillStyle = "#1c1714"; g.beginPath(); g.ellipse(hx + 1, hy + 1, 3, 2, a2, 0, 7); g.fill();
  return { x: hx, y: hy, down: lift < 0.08 };
}

function drawHorse(g, h, x, y, scale, cycle, opts) {
  // (x, y): hocico en x, cascos en y. Todo lo demás, relativo al centro del cuerpo.
  g.save();
  const bob = Math.sin(cycle * Math.PI * 4) * 1.6;
  const cx = x - 56 * scale, cy = y - 36 * scale + bob * scale;
  g.translate(cx, cy); g.scale(scale, scale);
  const coat = h.coat, dark = shade(coat, .7), light = shade(coat, 1.25);

  // Patas del lado de lejos.
  const hooves = [];
  for (const l of LEGS.filter(l => l.far)) hooves.push(leg(g, 0, 6, l, cycle, coat, scale));
  // Cola al viento.
  g.strokeStyle = rgb(shade(h.mane, 1)); g.lineWidth = 4; g.lineCap = "round";
  g.beginPath(); g.moveTo(-34, -4);
  g.quadraticCurveTo(-48, -2 + Math.sin(cycle * 6.3) * 3, -58, 4 + Math.sin(cycle * 6.3 + 1) * 4); g.stroke();
  g.lineWidth = 2; g.beginPath(); g.moveTo(-34, -2);
  g.quadraticCurveTo(-46, 4, -55, 10 + Math.sin(cycle * 6.3 + 2) * 3); g.stroke();

  // Cuerpo con volumen.
  const body = g.createRadialGradient(-4, -12, 4, 0, 0, 40);
  body.addColorStop(0, rgb(light)); body.addColorStop(.55, rgb(coat)); body.addColorStop(1, rgb(dark));
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(-36, -6);
  g.bezierCurveTo(-36, -18, -16, -18, 2, -16);
  g.bezierCurveTo(16, -16, 24, -18, 30, -12);
  g.bezierCurveTo(34, -6, 30, 10, 18, 12);
  g.bezierCurveTo(4, 15, -18, 14, -28, 10);
  g.bezierCurveTo(-36, 6, -38, 2, -36, -6);
  g.fill();
  // Cuello y cabeza, que cabecean con el galope.
  const nod = Math.sin(cycle * Math.PI * 2 + .6) * .07;
  g.save(); g.translate(24, -12); g.rotate(-0.55 + nod);
  const neck = g.createLinearGradient(0, -8, 0, 8);
  neck.addColorStop(0, rgb(light)); neck.addColorStop(1, rgb(dark));
  g.fillStyle = neck;
  g.beginPath(); g.moveTo(-4, -9); g.lineTo(26, -7); g.lineTo(30, 6); g.lineTo(0, 11); g.closePath(); g.fill();
  // Crin.
  g.fillStyle = rgb(h.mane);
  g.beginPath(); g.moveTo(-6, -9); g.quadraticCurveTo(12, -16 + Math.sin(cycle * 7) * 2, 28, -9); g.lineTo(26, -6); g.quadraticCurveTo(12, -10, -4, -6); g.fill();
  // Cabeza.
  g.translate(28, 0); g.rotate(1.25);
  g.fillStyle = rgb(coat);
  g.beginPath(); g.moveTo(-6, -7); g.bezierCurveTo(4, -9, 18, -6, 23, -2); g.bezierCurveTo(25, 1, 23, 5, 19, 5);
  g.bezierCurveTo(10, 6, 0, 7, -6, 6); g.closePath(); g.fill();
  g.fillStyle = rgb(dark); g.beginPath(); g.ellipse(21, 1.5, 2, 1.4, 0, 0, 7); g.fill();       // ollar
  g.fillStyle = "#121212"; g.beginPath(); g.arc(4, -3, 1.7, 0, 7); g.fill();                 // ojo
  g.fillStyle = "#fff"; g.beginPath(); g.arc(4.6, -3.6, .5, 0, 7); g.fill();
  g.fillStyle = rgb(dark); g.beginPath(); g.moveTo(-3, -6); g.lineTo(-6, -13); g.lineTo(0, -7); g.fill(); // oreja
  if (h.blaze) { g.fillStyle = "rgba(255,255,255,.9)"; g.beginPath(); g.moveTo(6, -6); g.lineTo(20, -3); g.lineTo(20, -1); g.lineTo(7, -4); g.fill(); }
  // Brida y anteojeras con el color de la cuadra.
  g.strokeStyle = "#2a1d14"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(1, -7); g.lineTo(1, 6); g.moveTo(1, 0); g.lineTo(18, 3); g.stroke();
  g.fillStyle = rgb(h.silks[1]); g.beginPath(); g.ellipse(4, -3, 3.4, 2.6, 0, 0, 7); g.fill();
  g.restore();

  // Mantilla con el dorsal.
  g.fillStyle = "#fafafa"; roundRect(g, -14, -15, 18, 15, 2.5); g.fill();
  g.strokeStyle = rgb(h.silks[0]); g.lineWidth = 1.6; roundRect(g, -14, -15, 18, 15, 2.5); g.stroke();
  g.fillStyle = "#111"; g.font = "13px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(String(h.n), -5, -6.5);

  // Patas del lado de cerca (encima del cuerpo).
  for (const l of LEGS.filter(l => !l.far)) hooves.push(leg(g, 0, 6, l, cycle, coat, scale));

  // Jinete agachado: bota, pierna, chaquetilla con el dibujo de la cuadra y casco.
  drawJockey(g, h, cycle);
  g.restore();
  return hooves.map(p => ({ x: cx + p.x * scale, y: cy + p.y * scale, down: p.down }));
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function drawJockey(g, h, cycle) {
  const [main, second] = h.silks;
  const sway = Math.sin(cycle * Math.PI * 4 + .4) * 1.2;
  g.save(); g.translate(0, sway);
  // Pierna y bota en el estribo.
  g.strokeStyle = "#f2f2f2"; g.lineWidth = 4.2; g.lineCap = "round";
  g.beginPath(); g.moveTo(-4, -22); g.lineTo(4, -14); g.lineTo(0, -6); g.stroke();
  g.strokeStyle = "#17171a"; g.lineWidth = 3.4; g.beginPath(); g.moveTo(0, -6); g.lineTo(3, -2); g.stroke();
  // Torso.
  g.save();
  g.beginPath();
  g.moveTo(-10, -22); g.bezierCurveTo(-8, -32, 6, -36, 16, -32); g.lineTo(18, -26);
  g.bezierCurveTo(8, -24, -2, -19, -10, -18); g.closePath();
  g.fillStyle = rgb(main); g.fill();
  g.clip();
  g.fillStyle = rgb(second); g.strokeStyle = rgb(second);
  if (h.pattern === "banda") { g.lineWidth = 4; g.beginPath(); g.moveTo(-8, -33); g.lineTo(12, -18); g.stroke(); }
  else if (h.pattern === "rayas") { g.lineWidth = 2.2; for (let x = -10; x < 20; x += 6) { g.beginPath(); g.moveTo(x, -38); g.lineTo(x + 3, -16); g.stroke(); } }
  else if (h.pattern === "lunares") { for (const [px, py] of [[-4, -26], [4, -30], [10, -26], [0, -21]]) { g.beginPath(); g.arc(px, py, 1.9, 0, 7); g.fill(); } }
  const shine = g.createLinearGradient(0, -36, 0, -18);
  shine.addColorStop(0, "rgba(255,255,255,.35)"); shine.addColorStop(1, "rgba(0,0,0,.25)");
  g.fillStyle = shine; g.fillRect(-12, -40, 34, 24);
  g.restore();
  // Brazo hacia las riendas.
  g.strokeStyle = rgb(shade(main, .85)); g.lineWidth = 3.2;
  g.beginPath(); g.moveTo(10, -29); g.lineTo(22, -24); g.lineTo(28, -21); g.stroke();
  g.strokeStyle = "#3a2a1d"; g.lineWidth = .9; g.beginPath(); g.moveTo(28, -21); g.lineTo(46, -15); g.stroke();
  // Cabeza con casco y visera.
  g.fillStyle = "#f1c7a3"; g.beginPath(); g.arc(19, -34, 3.4, 0, 7); g.fill();
  g.fillStyle = rgb(second); g.beginPath(); g.arc(18, -36, 4.6, Math.PI * 1.02, Math.PI * 2.1); g.fill();
  g.fillRect(19, -37, 7, 1.6);
  g.restore();
}

// -- Polvo, lluvia y marcador -------------------------------------------------------------------

function kickDust(hooves, scale, going) {
  const col = going === "barro" ? [92, 66, 44] : going === "blando" ? [150, 116, 80] : [216, 186, 140];
  for (const p of hooves) {
    if (!p.down || Math.random() > .55) continue;
    PARTICLES.push({ x: p.x - 2, y: p.y, vx: -1.4 - Math.random() * 1.6, vy: -.6 - Math.random() * .9,
                     r: (1.6 + Math.random() * 2.4) * scale, life: 1, col });
  }
}
function drawParticles(g) {
  for (const p of PARTICLES) {
    p.x += p.vx; p.y += p.vy; p.vy += .08; p.r *= 1.05; p.life -= .09;
    if (p.life <= 0) continue;
    g.fillStyle = rgb(p.col, .45 * p.life); g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  PARTICLES = PARTICLES.filter(p => p.life > 0);
}

function drawRain(g, seed) {
  const r = rng(seed);
  g.strokeStyle = "rgba(210,225,245,.55)"; g.lineWidth = 1;
  for (let k = 0; k < 70; k++) {
    const x = r() * W, y = 20 + r() * (HUD_TOP - 30);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y + 10); g.stroke();
  }
}

function jerseyBadge(g, h, x, y, size) {
  const [main, second] = h.silks;
  g.save(); g.translate(x, y);
  g.fillStyle = rgb(main); roundRect(g, 0, 0, size, size, size * .22); g.fill();
  g.save(); roundRect(g, 0, 0, size, size, size * .22); g.clip();
  g.fillStyle = rgb(second); g.fillRect(0, size * .74, size, size * .26);
  g.restore();
  g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1; roundRect(g, .5, .5, size - 1, size - 1, size * .22); g.stroke();
  g.font = `${Math.round(size * .62)}px Luckiest`; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineWidth = 2.4; g.strokeStyle = luminance(main) > 150 ? "#fff" : "#000";
  g.fillStyle = luminance(main) > 150 ? "#111" : "#fff";
  g.strokeText(String(h.n), size / 2, size * .46); g.fillText(String(h.n), size / 2, size * .46);
  g.restore();
}

function drawHud(g, st) {
  // Izquierda: nombre de la carrera, distancia y terreno.
  g.textBaseline = "alphabetic"; g.textAlign = "left";
  g.fillStyle = META.gp ? "#ffcf3a" : "#ffffff"; g.font = "15px Luckiest";
  g.fillText(META.name.toUpperCase(), 12, HUD_TOP + 21);
  g.fillStyle = "#9aa1ad"; g.font = "700 9.5px Montserrat";
  g.fillText(`${META.distanceText} · ${st.rain ? META.wetLabel + " · LLUEVE" : META.goingLabel}`, 12, HUD_TOP + 35);
  // Centro: lo que falta.
  const left = st.gate ? "EN LOS CAJONES" : st.remaining > 0 ? `FALTAN ${st.remaining} m` : "¡LLEGADA!";
  g.font = "700 10px Montserrat"; const tw = g.measureText(left).width + 18;
  const cx = 300;
  g.fillStyle = st.remaining > 0 || st.gate ? "#ffffff14" : "#d8262f";
  roundRect(g, cx - tw / 2, HUD_TOP + 13, tw, 20, 10); g.fill();
  g.fillStyle = "#fff"; g.textAlign = "center"; g.fillText(left, cx, HUD_TOP + 27);
  // Derecha: los cuatro primeros.
  if (st.gate) return;
  let x = W - 10;
  for (let place = Math.min(4, st.ranking.length) - 1; place >= 0; place--) {
    const h = META.horses[st.ranking[place]];
    x -= 22; jerseyBadge(g, h, x, HUD_TOP + 11, 22);
    x -= 3; g.fillStyle = place === 0 ? "#ffcf3a" : "#c9ced6"; g.font = "700 10px Montserrat"; g.textAlign = "right";
    g.fillText(`${place + 1}º`, x, HUD_TOP + 26); x -= 18;
  }
}

function drawBug(g, frame) {
  // "EN DIRECTO" de la tele, arriba a la izquierda.
  g.fillStyle = "rgba(10,10,14,.72)"; roundRect(g, 8, 8, 172, 20, 6); g.fill();
  g.fillStyle = (Math.floor(frame / 6) % 2) ? "#ff3b3b" : "#a51f1f";
  g.beginPath(); g.arc(19, 18, 4, 0, 7); g.fill();
  g.fillStyle = "#fff"; g.font = "700 9px Montserrat"; g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText("EN DIRECTO · RADIO MONCLOA", 27, 18.5);
}

function drawGate(g, open) {
  const n = META.horses.length;
  const x0 = META.startX + 6;
  for (let i = 0; i < n; i++) {
    const y = laneY(i), s = laneScale(i), h = 44 * s;
    g.fillStyle = "#1f6f3d"; g.fillRect(x0 - 2, y - h, 5 * s, h);
    g.fillStyle = "#e9eef2"; g.fillRect(x0 - 2, y - h, 5 * s, 4 * s);
    // Puertas que se abren hacia fuera.
    const w = 14 * s * (1 - open);
    g.fillStyle = "rgba(220,226,232,.95)"; g.fillRect(x0 + 3 * s, y - h * .78, w, h * .5);
    g.strokeStyle = "#1f6f3d"; g.lineWidth = 1.2; g.strokeRect(x0 + 3 * s, y - h * .78, w, h * .5);
  }
  g.fillStyle = "#17592f"; g.fillRect(x0 - 2, laneY(0) - 44 * laneScale(0) - 6, 6, 8);
}

// -- API ------------------------------------------------------------------------------------------

window.setupRace = (meta) => {
  META = meta; PARTICLES = [];
  BG = { dry: paintBackground(meta.going), wet: paintBackground(meta.wetGoing) };
  return true;
};

function paint(st) {
  const g = bctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(st.rain ? BG.wet : BG.dry, 0, 0);
  g.setTransform(S, 0, 0, S, 0, 0);
  const going = st.rain ? META.wetGoing : META.going;
  // Del fondo hacia delante: así los de cerca tapan a los de lejos.
  const order = META.horses.map((_, i) => i);
  for (const i of order) {
    const h = META.horses[i], s = laneScale(i), y = laneY(i), x = st.xs[i];
    if (x < -80 || x - 120 * s > W) continue;
    g.fillStyle = "rgba(0,0,0,.22)"; g.beginPath(); g.ellipse(x - 50 * s, y + 1, 44 * s, 5 * s, 0, 0, 7); g.fill();
    const hooves = drawHorse(g, h, x, y, s, st.cycles[i], {});
    if (!st.gate && !st.frozen) kickDust(hooves, s, going);
    if (st.stumble.includes(i)) {
      g.fillStyle = "#ffcf3a"; g.font = "16px Luckiest"; g.textAlign = "center";
      g.strokeStyle = "#000"; g.lineWidth = 3; g.strokeText("¡UY!", x - 40 * s, y - 70 * s); g.fillText("¡UY!", x - 40 * s, y - 70 * s);
    }
    if (st.bolt.includes(i)) {
      g.fillStyle = "#fff"; g.font = "700 9px Montserrat"; g.textAlign = "center";
      g.strokeStyle = "#000"; g.lineWidth = 3; g.strokeText("¡DESBOCADO!", x - 40 * s, y - 70 * s); g.fillText("¡DESBOCADO!", x - 40 * s, y - 70 * s);
    }
  }
  drawParticles(g);
  if (st.gate || st.gateOpen < 1) drawGate(g, st.gateOpen);
  if (st.rain) drawRain(g, st.frame * 7 + 3);
  if (st.flash > 0) { g.fillStyle = `rgba(255,255,255,${st.flash})`; g.fillRect(0, 0, W, HUD_TOP); }
  drawBug(g, st.frame);
  drawHud(g, st);
}

// En Chromium cada fotograma va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");

function snapshot() {
  octx.clearRect(0, 0, W, H);
  octx.drawImage(big, 0, 0, W, H);
  return window.exportFrame(out);
}

window.renderFrames = (states) => states.map(st => { paint(st); return snapshot(); });

window.renderPodium = (data) => {
  // Foto-finish: el instante en que el ganador cruza, en sepia, como la cámara de la meta.
  let photo = null;
  if (data.photo) {
    paint(data.photo);
    photo = document.createElement("canvas"); photo.width = 150 * S; photo.height = (HUD_TOP - 100) * S;
    const p = photo.getContext("2d");
    p.filter = "grayscale(1) sepia(.8) contrast(1.1) brightness(1.3)";
    p.drawImage(big, (META.finishX - 105) * S, 100 * S, 150 * S, (HUD_TOP - 100) * S, 0, 0, photo.width, photo.height);
  }
  paint(data.last);
  const g = bctx; g.setTransform(1, 0, 0, 1, 0, 0);
  g.filter = "blur(6px) brightness(.45) saturate(.8)";
  g.drawImage(big, 0, 0);
  g.filter = "none";
  g.setTransform(S, 0, 0, S, 0, 0);
  drawHud(g, data.last);
  // Título.
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillStyle = META.gp ? "#ffcf3a" : "#3bd16f"; g.font = "700 10px Montserrat";
  g.fillText(META.gp ? "GRAN PREMIO · RESULTADO OFICIAL" : "RESULTADO OFICIAL", 26, 40);
  g.fillStyle = "#fff"; g.font = "34px Luckiest"; g.fillText("LLEGADA", 26, 74);
  // Podio.
  const medals = [["#fff1a8", "#f5b700", "#a97800"], ["#ffffff", "#c9d1dc", "#7d8794"], ["#ffd2a1", "#cd8a4a", "#7a4a1d"]];
  data.podium.forEach((row, k) => {
    const y = 96 + k * 72, h = META.horses[row.index];
    const card = g.createLinearGradient(20, 0, 440, 0);
    card.addColorStop(0, "rgba(255,255,255,.14)"); card.addColorStop(1, "rgba(255,255,255,.02)");
    g.fillStyle = card; roundRect(g, 20, y, data.photo ? 420 : 600, 60, 14); g.fill();
    g.fillStyle = rgb(h.silks[0]); roundRect(g, 20, y, 6, 60, 3); g.fill();
    const m = g.createRadialGradient(56, y + 26, 2, 60, y + 30, 22);
    m.addColorStop(0, medals[k][0]); m.addColorStop(.6, medals[k][1]); m.addColorStop(1, medals[k][2]);
    g.fillStyle = m; g.beginPath(); g.arc(60, y + 30, 19, 0, 7); g.fill();
    g.fillStyle = "#1a1408"; g.font = "22px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(String(k + 1), 60, y + 32);
    jerseyBadge(g, h, 90, y + 12, 36);
    g.textAlign = "left"; g.textBaseline = "alphabetic";
    g.fillStyle = "#fff"; g.font = "700 17px Montserrat"; g.fillText(h.name, 138, y + 28);
    g.fillStyle = "#b8bec9"; g.font = "500 11px Roboto"; g.fillText(row.note, 138, y + 46);
    if (row.odds) {
      g.textAlign = "right"; g.fillStyle = "#ffcf3a"; g.font = "20px Luckiest";
      g.fillText(row.odds, (data.photo ? 430 : 610), y + 38);
    }
  });
  if (photo) {
    const x = W - 178, y = 26, w = 150, h2 = HUD_TOP - 100;
    g.save(); g.translate(x + w / 2, y + h2 / 2); g.rotate(.03);
    g.fillStyle = "#f4efe4"; g.fillRect(-w / 2 - 6, -h2 / 2 - 6, w + 12, h2 + 34);
    g.drawImage(photo, -w / 2, -h2 / 2, w, h2);
    g.fillStyle = "#2a2116"; g.font = "15px Luckiest"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("FOTO-FINISH", 0, h2 / 2 + 14);
    g.restore();
  }
  return snapshot();
};

// -- Parrilla y boleto (HTML) ----------------------------------------------------------------------

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function jerseySvg(h) {
  const [m, s] = h.silks.map(c => `rgb(${c})`);
  let pattern = "";
  if (h.pattern === "banda") pattern = `<path d="M10 9 L34 33 L30 37 L6 13Z" fill="${s}"/>`;
  if (h.pattern === "rayas") pattern = [12, 19, 26, 33].map(x => `<rect x="${x - 2}" y="6" width="3.2" height="34" fill="${s}"/>`).join("");
  if (h.pattern === "lunares") pattern = [[14, 16], [27, 14], [20, 25], [30, 28], [13, 31]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${s}"/>`).join("");
  return `<svg viewBox="0 0 42 42"><defs><clipPath id="j${h.n}"><path d="M13 4 L29 4 L40 12 L35 20 L32 18 L32 40 L10 40 L10 18 L7 20 L2 12Z"/></clipPath>
    <linearGradient id="g${h.n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>
    <g clip-path="url(#j${h.n})"><rect width="42" height="42" fill="${m}"/>${pattern}<rect width="42" height="42" fill="url(#g${h.n})"/></g>
    <path d="M13 4 L29 4 L40 12 L35 20 L32 18 L32 40 L10 40 L10 18 L7 20 L2 12Z" fill="none" stroke="#0009" stroke-width="1.2"/>
    <path d="M16 4 Q21 10 26 4" fill="none" stroke="${s}" stroke-width="2"/></svg>`;
}

const GOING_ICON = {

  blando: `<svg viewBox="0 0 16 16"><circle cx="5.5" cy="6" r="3" fill="#ffcf3a"/><path d="M5 12 a3 3 0 0 1 1-5.6 a3.6 3.6 0 0 1 6.8 1 a2.3 2.3 0 0 1 .2 4.6Z" fill="#dfe6ee"/></svg>`,
  barro: `<svg viewBox="0 0 16 16"><path d="M3.5 9 a3 3 0 0 1 1-5.6 a3.6 3.6 0 0 1 6.8 1 a2.3 2.3 0 0 1 .2 4.6Z" fill="#aeb8c4"/><g stroke="#6fb7ff" stroke-width="1.3" stroke-linecap="round"><line x1="5" y1="11" x2="4" y2="14"/><line x1="8.5" y1="11" x2="7.5" y2="14"/><line x1="12" y1="11" x2="11" y2="14"/></g></svg>`,
};

window.renderCard = (d) => {

            <span class="tag likes ${r.likes === d.going ? "match" : ""}">${GOING_ICON[r.likes]} ${esc(r.likesLabel)}</span>
            ${r.tired ? `<span class="tag tired">CANSADO</span>` : ""}</div></div>
        <div><div class="bar"><span style="width:${Math.max(3, 100 * r.p / best)}%;background:linear-gradient(90deg, rgb(${h.silks[0]}), rgb(${h.silks[1]}))"></span></div>
          <div class="pct">${(100 * r.p).toFixed(r.p < .1 ? 1 : 0)} %</div></div>
        <div class="odds">${esc(r.odds)}</div>
        ${r.tip ? `<div class="stamp">SANXE ${r.tip} %</div>` : ""}
      </div>`; }).join("")}
    <div class="foot">Probabilidades de simular la carrera ${esc(d.trials)} veces. La barra va con los colores de la cuadra.</div>
  </div>`;
  return true;
};

window.renderTicket = (d) => {
  const stage = document.getElementById("stage");
  stage.innerHTML = `<div class="ticket" id="shot"><div class="paper">
    <div class="stub"><small>DORSAL</small><div class="num">${esc(d.numbers)}</div><div class="kind">${esc(d.kind.toUpperCase())}</div><div class="barcode"></div></div>
    <div class="body">
      <div class="race">Boleto · ${esc(d.race)}</div>
      <div class="player">${esc(d.player)}</div>
      <div class="picks">${d.horses.map((h, k) => `<div class="pick">${jerseySvg(h)} ${d.horses.length > 1 ? `${k + 1}º ` : ""}${esc(h.name)}</div>`).join("")}</div>
      <div class="money">
        <div><small>APUESTA</small><b>${esc(d.stake)}</b></div>
        <div><small>CUOTA</small><b>${esc(d.odds)}</b></div>
        <div><small>${d.won ? "COBRA" : "SI ACIERTA"}</small><b>${esc(d.prize)}</b></div>
      </div>
      ${d.pot ? `<div class="pot">+ ${esc(d.pot)} del bote del Gran Premio</div>` : ""}
    </div>
    ${d.won ? `<div class="premiado">PREMIADO</div>` : ""}
    <div class="notch top"></div><div class="notch bot"></div>
  </div></div>`;
  return true;
};
</script>
</body>
</html>
