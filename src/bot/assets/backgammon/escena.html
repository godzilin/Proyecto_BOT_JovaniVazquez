<!doctype html>
<!--
Escena del backgammon, dibujada con canvas. La pinta Node con Skia
(assets/escena_node.cjs) y, si no hay Node, un Chromium sin ventana (ver
bot/services/backgammon_scene.py).

No decide nada: Python le pasa, en cada fotograma, la posición, los dados (con su
sitio, giro y altura), el cubo, las fichas que vuelan, las casillas resaltadas,
las cuentas de pips, el turno y el cartel (bot/services/backgammon_render.py:
meta_state, board_state y las animaciones). Aquí solo se pinta. Funciones que
llama Python:

- loadFonts()           espera a las fuentes (canvas no las carga solo).
- setup(meta)           los jugadores, el título, la semilla, la skin del
                        tapete y la geometría; pinta la mesa una sola vez.
- renderFrames(states)  dibuja los fotogramas y devuelve, de cada uno, el
                        recuadro que ha cambiado y dónde va ({x, y, u}).
- slotAt(geom, ...)     dónde va cada ficha (lo comprueban las pruebas contra Python).

Orden de capas: mesa y tablero (una vez: madera con veta, tapete, puntos, barra,
bandeja) -> números del marco -> tarjetas de los jugadores -> casillas
resaltadas -> montones de la barra, los puntos y la bandeja -> cubo -> dados y
sombras -> fichas en el aire -> confeti -> cartel. Cuando solo se mueven los
dados o las fichas que vuelan, se devuelve únicamente el recuadro que cubren
(antes y ahora); si cambia cualquier otra cosa, el fotograma va entero. Todo se
dibuja al doble de tamaño (S = 2) y se reduce al copiarlo. Sin emojis: el
Chromium del Docker no trae su fuente. El azar sale solo de la semilla de la partida.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script src="../tapete.js"></script>
<script>
"use strict";
const S = 2;
const W = 800, H = 572;
const TEX = 0x51ed;                  // semilla de las texturas (madera, fieltro, bandeja): las mismas en todas las partidas
const PAD = 3;                       // margen extra al reducir un recuadro (ver `snapshot`)

const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const mid = document.createElement("canvas");
const out = document.createElement("canvas");
const bctx = big.getContext("2d");
const mctx = mid.getContext("2d");
const octx = out.getContext("2d");

let META = null, G = null, SKIN = null;   // la partida, su geometría y la skin
let BASE = null, BASE_KEY = null;          // la mesa pintada (se reutiliza si no cambia)
let SPRITES = null;                        // fichas, sombras y dados (no dependen de la partida)
let CUBES = new Map();                     // caras del cubo, por valor
let NAMES = null, TITLE = null;            // nombres, título y subtítulo ya ajustados
let CONF = [];                             // piezas de confeti (salen de la semilla)
let PREV_KEY = null, PREV_ITEMS = null;

const CHECKER = {
  1: { face: ["#ffffff", "#fcf6e4", "#ebdfc0", "#c7b68c"], wall: ["#bdaa80", "#7a6844"],
       rim: ["rgba(255,255,255,0.95)", "rgba(110,88,50,0.6)"], groove: "rgba(120,96,56,0.5)", gleam: "rgba(255,255,255,0.8)",
       inlay: "rgba(214,172,84,0.75)", spec: 0.85, sheen: ["rgba(255,196,220,0.20)", "rgba(165,215,255,0.22)"] },
  2: { face: ["#62626e", "#30303a", "#131318", "#050507"], wall: ["#202027", "#050507"],
       rim: ["rgba(215,215,240,0.6)", "rgba(0,0,0,0.85)"], groove: "rgba(0,0,0,0.75)", gleam: "rgba(205,205,230,0.24)",
       inlay: "rgba(222,176,84,0.7)", spec: 0.5, sheen: ["rgba(130,150,255,0.14)", "rgba(255,120,150,0.12)"] },
};
const GLOW = { 1: "255,230,170", 2: "255,140,96" };
const KIND = {
  win:  { a: "#ffd24a", b: "#ff9d1c", text: ["#fff6c2", "#ffd24a", "#f09a12"], rgb: "255,196,60" },
  lose: { a: "#c58a96", b: "#7f8596", text: ["#f3dde1", "#c9a1aa", "#8b8fa0"], rgb: "190,120,134" },
  draw: { a: "#6aaeff", b: "#3a6be0", text: ["#e3f1ff", "#8cc2ff", "#4a86ee"], rgb: "90,160,255" },
  time: { a: "#b58cff", b: "#7a4fe0", text: ["#f1e6ff", "#c3a2ff", "#8f63ee"], rgb: "160,120,255" },
};
const CONFETTI = {
  0: ["#ffd24a", "#fff6c2", "#ff7a5c", "#ffffff"],
  1: ["#fffaf0", "#f4e2b0", "#ffd24a", "#ffffff"],
  2: ["#ff5a6e", "#ffb0b8", "#ffd24a", "#ffffff"],
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circle(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }
function fitText(g, text, maxW, font, size, min = 9) {
  for (let s = size; s >= min; s--) { g.font = font(s); if (g.measureText(text).width <= maxW) return s; }
  g.font = font(min); return min;
}
function ellipsize(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function halo(g, x, y, w, h, r, rgb, spread, alpha) {
  // Resplandor de un rectángulo redondeado con trazos cada vez más anchos y más tenues.
  // No usa shadowBlur: así sale igual pintado entero que en un recuadro.
  g.save(); g.lineWidth = 2;
  for (let i = spread; i >= 1; i--) {
    g.strokeStyle = `rgba(${rgb},${(alpha * Math.pow(1 - i / (spread + 1), 2.2)).toFixed(4)})`;
    roundRect(g, x - i, y - i, w + 2 * i, h + 2 * i, r + i); g.stroke();
  }
  g.restore();
}
function linear(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  return gr;
}
function radial(g, x0, y0, r0, x1, y1, r1, stops) {
  const gr = g.createRadialGradient(x0, y0, r0, x1, y1, r1);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  return gr;
}

// -- Dónde va cada cosa (lo mismo que backgammon_render.py: point_x, stack_xy, bar_xy, off_xy) ----

function pointX(i, geom = G) {
  const column = i < 12 ? 11 - i : i - 12;
  return (column < 6 ? geom.left : geom.right) + (column % 6 + 0.5) * geom.pw;
}
function stackXY(i, k, n, geom = G) {
  const step = n <= 5 ? geom.step : 4 * geom.step / (n - 1);
  return i < 12 ? [pointX(i, geom), geom.bottom - geom.r - k * step] : [pointX(i, geom), geom.top + geom.r + k * step];
}
function barXY(side, k, n, geom = G) {
  const step = n <= 4 ? geom.step : geom.bar_span / (n - 1), off = geom.bar_inner + k * step;
  return [geom.bar_x, side === 1 ? geom.mid + off : geom.mid - off];
}
function offXY(side, k, geom = G) {
  const [, h, pace] = geom.slab, y0 = geom.tray[1], y1 = geom.tray[3];
  return side === 1 ? [geom.tray_x, y1 - 5 - h / 2 - k * pace] : [geom.tray_x, y0 + 5 + h / 2 + k * pace];
}

// -- Madera ----------------------------------------------------------------------------------

function woodGrain(g, x, y, w, h, vertical, seed, dark, light) {
  // Veta: hilos largos y algo ondulados a lo largo de la pieza, claros y oscuros.
  const r = rng(seed), len = vertical ? h : w, span = vertical ? w : h;
  const n = Math.round(span * 2.2 + 30);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const off = r() * span, a0 = (r() - 0.35) * len * 0.5, a1 = len * (0.45 + r() * 0.8), wob = (r() - 0.5) * span * 0.12;
    g.strokeStyle = r() < 0.62 ? `rgba(30,10,2,${dark * (0.25 + r() * 0.75)})` : `rgba(255,216,162,${light * (0.4 + r())})`;
    g.lineWidth = 0.3 + r() * 0.8;
    g.beginPath();
    if (vertical) {
      g.moveTo(x + off, y + a0);
      g.bezierCurveTo(x + off + wob, y + a0 + a1 * 0.33, x + off - wob, y + a0 + a1 * 0.66, x + off + wob * 0.4, y + a0 + a1);
    } else {
      g.moveTo(x + a0, y + off);
      g.bezierCurveTo(x + a0 + a1 * 0.33, y + off + wob, x + a0 + a1 * 0.66, y + off - wob, x + a0 + a1, y + off + wob * 0.4);
    }
    g.stroke();
  }
  g.restore();
}
function woodPiece(g, poly, box, colors, vertical, seed, dark = 0.2, light = 0.07) {
  // Una pieza del marco: forma `poly` (inglete), degradado de fuera a dentro y veta.
  const [x, y, w, h] = box;
  g.save(); g.beginPath();
  poly.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
  g.closePath(); g.clip();
  g.fillStyle = vertical ? linear(g, x, 0, x + w, 0, colors) : linear(g, 0, y, 0, y + h, colors);
  g.fillRect(x, y, w, h);
  woodGrain(g, x, y, w, h, vertical, seed, dark, light);
  g.restore();
}
function brass(g, x, y, w, h, r) {
  g.save();
  g.shadowColor = "rgba(0,0,0,0.55)"; g.shadowBlur = 4 * S; g.shadowOffsetY = 2 * S;
  g.fillStyle = linear(g, x, y, x + w, y + h, [[0, "#f6df8e"], [0.45, "#caa040"], [1, "#7c5812"]]);
  roundRect(g, x, y, w, h, r); g.fill();
  g.restore();
  g.strokeStyle = "rgba(255,246,200,0.75)"; g.lineWidth = 0.9; roundRect(g, x + 0.6, y + 0.6, w - 1.2, h - 1.2, r); g.stroke();
  g.strokeStyle = "rgba(70,40,4,0.6)"; g.lineWidth = 0.7; roundRect(g, x + 2.2, y + 2.2, w - 4.4, h - 4.4, Math.max(1, r - 1.5)); g.stroke();
}
function screw(g, x, y, r = 2.1) {
  g.fillStyle = radial(g, x - r * 0.3, y - r * 0.4, 0.2, x, y, r, [[0, "#fff4c4"], [0.6, "#b98b2c"], [1, "#5a3c06"]]);
  circle(g, x, y, r); g.fill();
  g.strokeStyle = "rgba(40,24,2,0.85)"; g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(x - r * 0.7, y - r * 0.3); g.lineTo(x + r * 0.7, y + r * 0.3); g.stroke();
}

// -- La mesa y el tablero (una vez por skin y título) -------------------------------------------

function paintTable(g) {
  // Mesa de nogal oscuro, con una lámpara colgando encima del tablero.
  g.fillStyle = linear(g, 0, 0, 0, H, [[0, "#2c1c12"], [0.5, "#241610"], [1, "#150c08"]]);
  g.fillRect(0, 0, W, H);
  woodGrain(g, 0, 0, W, H, false, TEX ^ 0x7ab1e, 0.10, 0.03);
  const pool = radial(g, W / 2, 300, 40, W / 2, 300, 560, [[0, "rgba(255,200,130,0.34)"], [0.45, "rgba(255,170,90,0.12)"], [1, "rgba(255,160,80,0)"]]);
  g.fillStyle = pool; g.fillRect(0, 0, W, H);
}

function paintWoodFrame(g) {
  const [fx0, fy0, fx1, fy1] = G.frame, [ix0, iy0] = [G.felt[0], G.felt[1]], [ix1, iy1] = [G.tray[2], G.tray[3]];
  const seed = TEX;
  // Sombra del tablero sobre la mesa.
  g.save();
  g.shadowColor = "rgba(0,0,0,0.75)"; g.shadowBlur = 26 * S; g.shadowOffsetY = 10 * S;
  g.fillStyle = "#3b2314"; roundRect(g, fx0, fy0, fx1 - fx0, fy1 - fy0, 14); g.fill();
  g.restore();
  // Las cuatro piezas del marco, con inglete en las esquinas y la veta a lo largo.
  g.save(); roundRect(g, fx0, fy0, fx1 - fx0, fy1 - fy0, 14); g.clip();
  const topB = [fx0, fy0, fx1 - fx0, iy0 - fy0], botB = [fx0, iy1, fx1 - fx0, fy1 - iy1];
  const leftB = [fx0, fy0, ix0 - fx0, fy1 - fy0], rightB = [ix1, fy0, fx1 - ix1, fy1 - fy0];
  woodPiece(g, [[fx0, fy0], [fx1, fy0], [ix1, iy0], [ix0, iy0]], topB, [[0, "#a46c42"], [1, "#74451f"]], false, seed ^ 11);
  woodPiece(g, [[fx0, fy1], [fx1, fy1], [ix1, iy1], [ix0, iy1]], botB, [[0, "#4c2b15"], [1, "#6c3e1f"]], false, seed ^ 22);
  woodPiece(g, [[fx0, fy0], [ix0, iy0], [ix0, iy1], [fx0, fy1]], leftB, [[0, "#905b36"], [1, "#6b3e20"]], true, seed ^ 33);
  woodPiece(g, [[fx1, fy0], [ix1, iy0], [ix1, iy1], [fx1, fy1]], rightB, [[0, "#5e361c"], [1, "#774726"]], true, seed ^ 44);
  // Inglete: una línea oscura con su filo de luz.
  for (const [ax, ay, bx, by] of [[fx0, fy0, ix0, iy0], [fx1, fy0, ix1, iy0], [fx0, fy1, ix0, iy1], [fx1, fy1, ix1, iy1]]) {
    g.strokeStyle = "rgba(20,8,2,0.6)"; g.lineWidth = 1; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    g.strokeStyle = "rgba(255,220,170,0.14)"; g.lineWidth = 0.8; g.beginPath(); g.moveTo(ax + 0.9, ay); g.lineTo(bx + 0.9, by); g.stroke();
  }
  // Biselado del borde de fuera: luz arriba a la izquierda, sombra abajo a la derecha.
  const bevel = linear(g, fx0, fy0, fx1, fy1, [[0, "rgba(255,226,184,0.75)"], [0.3, "rgba(255,226,184,0.12)"], [0.62, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.7)"]]);
  g.strokeStyle = bevel; g.lineWidth = 3; roundRect(g, fx0 + 1.5, fy0 + 1.5, fx1 - fx0 - 3, fy1 - fy0 - 3, 13); g.stroke();
  g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = 1; roundRect(g, fx0 + 3.8, fy0 + 3.8, fx1 - fx0 - 7.6, fy1 - fy0 - 7.6, 11); g.stroke();
  g.restore();
}

function paintInnerLip(g) {
  // El filo de dentro del marco, donde se hunde el tapete.
  const [ix0, iy0] = [G.felt[0], G.felt[1]], [ix1, iy1] = [G.tray[2], G.tray[3]];
  g.strokeStyle = "rgba(10,4,0,0.85)"; g.lineWidth = 1.6; g.strokeRect(ix0 - 0.8, iy0 - 0.8, ix1 - ix0 + 1.6, iy1 - iy0 + 1.6);
  g.strokeStyle = "rgba(255,214,160,0.28)"; g.lineWidth = 0.9; g.strokeRect(ix0 - 2, iy0 - 2, ix1 - ix0 + 4, iy1 - iy0 + 4);
}

function paintFelt(g) {
  const [x0, y0, x1, y1] = G.felt, w = x1 - x0, h = y1 - y0;
  const felt = Tapete.felt(META.skin, ["#2d8456", "#17583a", "#082a1b"]);
  g.fillStyle = radial(g, G.bar_x, G.mid, 30, G.bar_x, G.mid, 420, [[0, felt[0]], [0.55, felt[1]], [1, felt[2]]]);
  g.fillRect(x0, y0, w, h);
  Tapete.pattern(g, x0, y0, w, h, META.skin);
  // Pelusa del fieltro.
  const r = rng(TEX ^ 0xfe17);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = r() < 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.055)";
    g.fillRect(x0 + r() * w, y0 + r() * h, 1.3, 1.3);
  }
  // El tapete está hundido en el marco: sombra en sus cuatro bordes.
  const edge = (xa, ya, xb, yb, rx, ry, rw, rh) => {
    g.fillStyle = linear(g, xa, ya, xb, yb, [[0, "rgba(0,0,0,0.55)"], [1, "rgba(0,0,0,0)"]]); g.fillRect(rx, ry, rw, rh);
  };
  edge(x0, y0, x0, y0 + 11, x0, y0, w, 11);
  edge(x0, y1, x0, y1 - 11, x0, y1 - 11, w, 11);
  edge(x0, y0, x0 + 9, y0, x0, y0, 9, h);
}

function triangle(g, i) {
  const cx = pointX(i), top = i >= 12, len = G.length, hw = G.pw * 0.45;
  const base = top ? G.top : G.bottom, tip = top ? G.top + len : G.bottom - len, dir = top ? 1 : -1;
  g.beginPath();
  g.moveTo(cx - hw, base);
  g.lineTo(cx - 1.8, tip - dir * 0.6);
  g.quadraticCurveTo(cx, tip + dir * 1.6, cx + 1.8, tip - dir * 0.6);
  g.lineTo(cx + hw, base);
  g.closePath();
  return { base, tip, cx, hw };
}
function paintPoints(g) {
  for (let i = 0; i < 24; i++) {
    const column = i < 12 ? 11 - i : i - 12;
    const dark = (column % 2 === 0) === (i < 12);
    const { base, tip, cx, hw } = triangle(g, i);
    const grad = linear(g, 0, base, 0, tip, dark
      ? [[0, "#a02c40"], [0.55, "#7a1b2d"], [1, "#4a0e1a"]]
      : [[0, "#f2e4b8"], [0.55, "#d9c58f"], [1, "#b09860"]]);
    g.save();
    g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 3 * S; g.shadowOffsetX = 1 * S; g.shadowOffsetY = 1 * S;
    g.fillStyle = grad; g.fill();
    g.restore();
    // Luz por la izquierda y filo fino.
    g.save(); triangle(g, i); g.clip();
    g.fillStyle = linear(g, cx - hw, 0, cx + hw, 0, [[0, "rgba(255,255,255,0.20)"], [0.5, "rgba(255,255,255,0)"], [1, "rgba(0,0,0,0.20)"]]);
    g.fillRect(cx - hw, Math.min(base, tip), hw * 2, G.length);
    g.restore();
    triangle(g, i);
    g.strokeStyle = dark ? "rgba(20,0,6,0.7)" : "rgba(60,40,10,0.6)"; g.lineWidth = 0.9; g.stroke();
  }
}

function paintBar(g) {
  const [bx0, bx1] = G.bar, y0 = G.felt[1], y1 = G.felt[3], w = bx1 - bx0, seed = TEX;
  const strip = (x, width, colors, sd) => {
    g.save();
    g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 8 * S; g.shadowOffsetX = 3 * S; g.shadowOffsetY = 0;
    g.fillStyle = "#4a2a14"; g.fillRect(x, y0, width, y1 - y0);
    g.restore();
    g.fillStyle = linear(g, x, 0, x + width, 0, colors); g.fillRect(x, y0, width, y1 - y0);
    woodGrain(g, x, y0, width, y1 - y0, true, sd, 0.2, 0.07);
    g.fillStyle = linear(g, x, 0, x + width, 0, [[0, "rgba(255,226,184,0.5)"], [0.06, "rgba(255,226,184,0)"], [0.94, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.55)"]]);
    g.fillRect(x, y0, width, y1 - y0);
  };
  strip(bx0, w, [[0, "#7a4b28"], [0.5, "#653a1c"], [1, "#4f2d14"]], seed ^ 55);
  const [wx0, wx1] = G.wall;
  strip(wx0, wx1 - wx0, [[0, "#744622"], [0.5, "#613719"], [1, "#4c2b13"]], seed ^ 66);
  // El hueco de la bisagra en medio de la barra.
  const cx = G.bar_x;
  g.fillStyle = "rgba(10,3,0,0.65)"; g.fillRect(cx - 0.8, y0, 1.6, y1 - y0);
  g.fillStyle = "rgba(255,214,160,0.16)"; g.fillRect(cx + 0.8, y0, 0.8, y1 - y0);
}

function paintTray(g) {
  const [x0, y0, x1, y1] = G.tray, w = x1 - x0, h = y1 - y0;
  g.fillStyle = linear(g, x0, 0, x1, 0, [[0, "#3a0f1b"], [0.5, "#4e1827"], [1, "#35101a"]]);
  g.fillRect(x0, y0, w, h);
  const r = rng(TEX ^ 0x7a1);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = r() < 0.5 ? "rgba(255,190,200,0.05)" : "rgba(0,0,0,0.12)";
    g.fillRect(x0 + r() * w, y0 + r() * h, 1.2, 1.2);
  }
  // Forro acolchado: rombos con una luz y una sombra, y un botón en cada cruce.
  g.save(); g.beginPath(); g.rect(x0, y0, w, h); g.clip();
  const q = 20;
  for (const [dy, color] of [[1, "rgba(0,0,0,0.30)"], [0, "rgba(255,170,190,0.10)"]]) {
    g.strokeStyle = color; g.lineWidth = 1; g.beginPath();

const PIPS = {

// arriba con la cámara algo inclinada hacia el jugador, así que asoma el canto de delante.

const TILT = 0.42, COS_T = Math.cos(TILT), SIN_T = Math.sin(TILT);

  1: [[0, 0, 1], [1, 0, 0], [0, -1, 0]], 6: [[0, 0, -1], [1, 0, 0], [0, 1, 0]],
  2: [[0, -1, 0], [1, 0, 0], [0, 0, -1]], 5: [[0, 1, 0], [-1, 0, 0], [0, 0, -1]],

  2: { face: ["#8a5a34", "#5e3a1e", "#3a220f"], edge: "#1e0f05", pip: ["#fff3d6", "#e2c890", "#a8864e"], hole: "rgba(20,8,0,0.7)" },

const FACE_PX = 128;
const FACE_TEX = new Map();
const DIE_SCRATCH = document.createElement("canvas");

function faceTexture(side, value, level) {
  const key = `${side}:${value}:${level}`;

  g.fillRect(0, 0, n, n);
  // Veta suave (sale de una semilla fija: la misma en todas las partidas).
  const rand = rng(TEX ^ value);
  g.strokeStyle = "rgba(40,18,4,0.14)"; g.lineWidth = n * 0.012;
  for (let i = 0; i < 9; i++) {

    g.beginPath(); g.moveTo(0, y);
    g.bezierCurveTo(n * 0.3, y + (rand() - 0.5) * n * 0.08, n * 0.7, y + (rand() - 0.5) * n * 0.08, n, y); g.stroke();
  }

  g.lineWidth = n * 0.06;
  g.strokeStyle = "rgba(255,225,180,0.35)"; g.beginPath(); g.moveTo(n * 0.06, n * 0.94); g.lineTo(n * 0.06, n * 0.06); g.lineTo(n * 0.94, n * 0.06); g.stroke();
  g.strokeStyle = "rgba(30,12,2,0.45)"; g.beginPath(); g.moveTo(n * 0.94, n * 0.06); g.lineTo(n * 0.94, n * 0.94); g.lineTo(n * 0.06, n * 0.94); g.stroke();
  // Puntos hundidos y rellenos de crema.
  for (const [dx, dy] of PIPS[value]) {
    const x = (0.5 + dx * 0.25) * n, y = (0.5 + dy * 0.25) * n, r = n * (value === 1 ? 0.12 : 0.09);
    g.fillStyle = wood.hole; circle(g, x + r * 0.12, y + r * 0.12, r * 1.1); g.fill();
    g.fillStyle = radial(g, x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r, [[0, wood.pip[0]], [0.7, wood.pip[1]], [1, wood.pip[2]]]);
    circle(g, x, y, r); g.fill();

  g.fillStyle = `rgba(20,8,0,${0.6 * (1 - light)})`; g.fillRect(0, 0, n, n);

    g.fillRect(0, 0, n, n);

}

function hull(points) {
  // Envolvente convexa (cadena monótona): la silueta del dado.
  const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const chain = (list) => {
    const out = [];
    for (const p of list) {
      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) <= 0) out.pop();
      out.push(p);
    }
    out.pop();
    return out;
  };
  return [...chain(pts), ...chain(pts.slice().reverse())];
}

function paintDie3d(g, side, m, cx, cy, h) {
  // `h` es medio lado; (cx, cy), donde cae el centro de la cara de arriba de un dado quieto.
  const at = (v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

    g.save();
    g.transform((x1 - x0) / FACE_PX, (y1 - y0) / FACE_PX, (x3 - x0) / FACE_PX, (y3 - y0) / FACE_PX, x0, y0);
    g.drawImage(faceTexture(side, +v, Math.round(clamp(lit, 0, 1) * 10)), 0, 0);

}

// -- Lo que cambia en cada fotograma -------------------------------------------------------------

function drawNumbers(g, labels, top) {
  // Los números de los puntos, grabados en el marco: arriba los 12..23 y abajo los 0..11.
  g.font = "700 11px Montserrat"; g.textAlign = "center"; g.textBaseline = "middle";
  const [, fy0, , fy1] = G.frame;
  for (let i = top ? 12 : 0; i < (top ? 24 : 12); i++) {
    const n = labels === 1 ? i + 1 : 24 - i, x = pointX(i), y = i < 12 ? fy1 - 11 : fy0 + 11, text = String(n);
    g.fillStyle = "rgba(20,8,2,0.85)"; g.fillText(text, x + 0.7, y + 0.9);
    g.fillStyle = "rgba(244,218,168,0.92)"; g.fillText(text, x, y);
  }
}

// Lo de arriba (título, tarjetas con su resplandor, números) y los números de abajo se pintan
// en dos tiras que solo cambian con el turno, los pips o los números: cada recuadro copia

const HEAD_H = 96;

  const key = `${st.turn}|${st.pips[0]}|${st.pips[1]}|${st.labels}`;
  if (key === HEAD_KEY) return;
  HEAD_KEY = key;

    FOOT = document.createElement("canvas"); FOOT.width = W * S; FOOT.height = (H - foot0()) * S;

  drawNumbers(g, st.labels, false);

function blitStrip(g, strip, top, box) {

  if (y1 <= y0) return;

}

function drawCard(g, side, st) {

  }

  roundRect(g, x, y, cw, ch, 14); g.fill();

  g.textAlign = "center";

function drawMarks(g, marks) {
  for (const m of marks) {

    } else if (m === 24) {

      g.fillStyle = "rgba(255,214,110,0.20)"; g.fillRect(bx0, G.felt[1], bx1 - bx0, G.felt[3] - G.felt[1]);
      g.strokeStyle = "rgba(255,230,150,0.9)"; g.lineWidth = 1.6; g.strokeRect(bx0 + 1, G.felt[1] + 1, bx1 - bx0 - 2, G.felt[3] - G.felt[1] - 2);

function drawChecker(g, x, y, side) {
  blit(g, SPRITES.shadow, x + 1.2, y + 3, 1, 0.8);

}

}

  for (let i = 0; i < 24; i++) {
    const v = st.points[i];
    if (!v) continue;
    const side = v > 0 ? 1 : 2, n = Math.abs(v);
    for (let k = 0; k < n; k++) { const [x, y] = stackXY(i, k, n); drawChecker(g, x, y, side); }
    if (n > 5) { const [x, y] = stackXY(i, n - 1, n); countLabel(g, x, y, n, side); }
  }

    const n = st.bar[side - 1];

    if (n > 3) { const [x, y] = barXY(side, n - 1, n); countLabel(g, x, y, n, side); }

// -- Final: confeti y cartel -------------------------------------------------------------------------

function makeConfetti() {
  const rand = rng(META.seed ^ 0xc0ffee), list = [], [fx0, fy0, fx1] = G.frame;
  for (let i = 0; i < 90; i++) {
    const side = i % 2, k = rand();
    list.push({
      sx: (side ? fx1 - 40 : fx0 + 40) + (rand() - 0.5) * 50, sy: fy0 + rand() * 16,
      vx: (side ? -1 : 1) * (70 + rand() * 250) + (rand() - 0.5) * 80, vy: -(120 + rand() * 300),
      rot: rand() * 6.28, spin: (rand() - 0.5) * 16, sway: rand() * 6.28, swayK: 3 + rand() * 4,
      w: 6 + rand() * 6, h: 10 + rand() * 8, round: rand() < 0.22,
      kind: k < 0.45 ? 0 : k < 0.7 ? 1 : k < 0.88 ? 2 : 3,
    });
  }
  return list;
}
function drawConfetti(g, conf) {
  const palette = CONFETTI[conf.side] || CONFETTI[0], tau = conf.t * 2.4;
  const fade = conf.t > 0.8 ? clamp((1 - conf.t) / 0.2, 0, 1) : 1;
  g.save(); g.globalAlpha = fade;
  for (const p of CONF) {
    const x = p.sx + p.vx * tau * (1 - 0.18 * tau) + Math.sin(tau * p.swayK + p.sway) * 9;
    const y = p.sy + p.vy * tau + 0.5 * 430 * tau * tau;
    if (y > H + 20 || x < -20 || x > W + 20) continue;
    const a = p.rot + p.spin * tau, flat = Math.cos(tau * p.swayK * 1.7 + p.sway);
    g.save(); g.translate(x, y); g.rotate(a); g.scale(1, 0.25 + 0.75 * Math.abs(flat));
    g.fillStyle = palette[p.kind];
    if (p.round) { circle(g, 0, 0, p.w * 0.5); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    g.restore();
  }
  g.restore();
}

function drawBanner(g, b) {
  const kd = KIND[b.kind] || KIND.win, a = clamp(b.a, 0, 1), sc = 0.9 + 0.1 * a;
  const w = 460, h = 96, cx = W / 2, cy = b.y || G.banner_y;
  g.save(); g.globalAlpha = a; g.translate(cx, cy); g.scale(sc, sc);
  g.shadowColor = `rgba(${kd.rgb},0.6)`; g.shadowBlur = 28 * S;
  g.fillStyle = linear(g, 0, -h / 2, 0, h / 2, [[0, "rgba(40,24,14,0.96)"], [1, "rgba(14,8,4,0.97)"]]);
  roundRect(g, -w / 2, -h / 2, w, h, 20); g.fill();
  g.shadowColor = "transparent"; g.shadowBlur = 0;
  g.strokeStyle = linear(g, -w / 2, 0, w / 2, 0, [[0, kd.b], [0.5, kd.a], [1, kd.b]]); g.lineWidth = 3;
  roundRect(g, -w / 2, -h / 2, w, h, 20); g.stroke();
  g.strokeStyle = "rgba(255,255,255,0.14)"; g.lineWidth = 1; roundRect(g, -w / 2 + 5, -h / 2 + 5, w - 10, h - 10, 16); g.stroke();
  g.fillStyle = linear(g, 0, -h / 2, 0, 0, [[0, "rgba(255,255,255,0.16)"], [1, "rgba(255,255,255,0)"]]);
  roundRect(g, -w / 2 + 4, -h / 2 + 4, w - 8, h / 2 - 4, 16); g.fill();
  g.fillStyle = kd.a;
  for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * (w / 2 - 20), -7); g.lineTo(sx * (w / 2 - 13), 0); g.lineTo(sx * (w / 2 - 20), 7); g.lineTo(sx * (w / 2 - 27), 0); g.closePath(); g.fill(); }
  g.textAlign = "center"; g.textBaseline = "middle"; g.lineJoin = "round";
  const title = String(b.title || ""), sub = String(b.sub || ""), ty = sub ? -13 : 0;
  const size = fitText(g, title, w - 90, (s) => `${s}px Luckiest`, 38, 18);
  g.font = `${size}px Luckiest`;
  g.strokeStyle = "rgba(10,6,30,0.95)"; g.lineWidth = 7; g.strokeText(title, 0, ty);
  g.fillStyle = linear(g, 0, ty - size / 2, 0, ty + size / 2, [[0, kd.text[0]], [0.5, kd.text[1]], [1, kd.text[2]]]);

// -- Cada fotograma -------------------------------------------------------------------------------------
//
// Casi siempre solo se mueven los dados, el cubo o la ficha que vuela. Entonces se repinta
// (con un recorte) y se devuelve solo la franja que cubren ahora y en el fotograma
// anterior. Si cambia cualquier otra cosa, el fotograma va entero.

function flyBox(f) {
  const m = G.r * 1.5 + 10, h = f.h || 0;
  return [f.x - m, f.y - h - m, f.x + m + h * 0.5, f.y + m + 6 + h * 0.5];
}
function dieBox(d) {
  // Girado, el cubo llega a √3 medios lados de su centro, que va algo por debajo de (x, y).
  const m = G.die * 1.1 * (1 + 0.45 * (d.z || 0)) + 6, z = d.z || 0;
  return [d.x - m, d.y - m - 6 * z, d.x + m + 14 * z + 6, d.y + m + 20 * z + 6];
}
function cubeBox(c) {
  // Con su halo, su sombra y lo que se levanta y crece al girar.
  return [c.x - 58, c.y - 66, c.x + 62, c.y + 66];
}
function itemsOf(st) {
  // Lo suelto (cada dado, cada ficha en el aire, el cubo) con su estado y su recuadro.
  const items = new Map();
  (st.dice || []).forEach((d, i) => items.set(`d${i}`, [JSON.stringify(d), dieBox(d)]));
  (st.flying || []).forEach((f, i) => items.set(`f${i}`, [JSON.stringify(f), flyBox(f)]));

}

  // Los recuadros de lo suelto que ha cambiado: donde estaba y donde está.
  const boxes = [];
  for (const [key, [json, box]] of now) {
    const old = before.get(key);
    if (!old || old[0] !== json) { boxes.push(box); if (old) boxes.push(old[1]); }
  }
  for (const [key, [, box]] of before) if (!now.has(key)) boxes.push(box);
  return boxes;
}
function union(boxes) {
  if (!boxes.length) return null;
  return boxes.reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
}

function paintScene(st, box) {
  const g = bctx;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.save();
  g.beginPath(); g.rect(box[0], box[1], box[2] - box[0], box[3] - box[1]); g.clip();
  g.drawImage(BASE, box[0] * S, box[1] * S, (box[2] - box[0]) * S, (box[3] - box[1]) * S, box[0], box[1], box[2] - box[0], box[3] - box[1]);
  ensureStrips(st);
  blitStrip(g, HEAD, 0, box); blitStrip(g, FOOT, foot0(), box);
  drawMarks(g, st.marks);
  drawStacks(g, st);
  drawCube(g, st.cube);
  for (const d of st.dice) drawDie(g, d);
  for (const f of st.flying || []) drawFlying(g, f);
  if (st.confetti) drawConfetti(g, st.confetti);
  const b = st.banner;
  if (b && b.a > 0) {
    if (b.kind !== "win") {
      g.fillStyle = `rgba(4,2,0,${0.42 * clamp(b.a, 0, 1)})`;
      const [fx0, fy0, fx1, fy1] = G.frame; roundRect(g, fx0, fy0, fx1 - fx0, fy1 - fy0, 14); g.fill();
    }
    drawBanner(g, b);
  }
  g.restore();
}

function snapshot(st) {
  const key = JSON.stringify({ ...st, dice: null, flying: null, cube: null });
  const items = itemsOf(st);
  let region;
  if (key === PREV_KEY && PREV_ITEMS !== null) {
    region = union(changedBoxes(PREV_ITEMS, items)) || [0, 0, 1, 1];     // solo se movió algo suelto
  } else region = [0, 0, W, H];
  PREV_KEY = key; PREV_ITEMS = items;
  const x0 = clamp(Math.floor(region[0]), 0, W - 1), y0 = clamp(Math.floor(region[1]), 0, H - 1);
  const x1 = clamp(Math.ceil(region[2]), x0 + 1, W), y1 = clamp(Math.ceil(region[3]), y0 + 1, H);
  // Se pinta con un margen y se recorta: el filtro al reducir mira los píxeles de
  // alrededor, y así el recuadro sale igual que el mismo trozo del fotograma entero.
  const px0 = Math.max(0, x0 - PAD), py0 = Math.max(0, y0 - PAD), px1 = Math.min(W, x1 + PAD), py1 = Math.min(H, y1 + PAD);
  paintScene(st, [px0, py0, px1, py1]);
  mid.width = px1 - px0; mid.height = py1 - py0;
  mctx.imageSmoothingEnabled = true; mctx.imageSmoothingQuality = "high";
  mctx.drawImage(big, px0 * S, py0 * S, (px1 - px0) * S, (py1 - py0) * S, 0, 0, px1 - px0, py1 - py0);
  const w = x1 - x0, h = y1 - y0;
  out.width = w; out.height = h;
  octx.drawImage(mid, x0 - px0, y0 - py0, w, h, 0, 0, w, h);
  return { x: x0, y: y0, u: window.exportFrame(out) };
}

// En Chromium cada recuadro va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("30px Luckiest"), document.fonts.load("700 12px Montserrat")]);
  await document.fonts.ready;
  return true;
};
window.setup = async (meta) => {
  await Tapete.ready(meta?.skin);
  META = meta; G = meta.geom; SKIN = meta.skin || null;
  buildSprites();
  const key = JSON.stringify([SKIN && [SKIN.key, SKIN.pattern, SKIN.felt], G.w]);
  if (!BASE || BASE_KEY !== key) { BASE = paintBase(); BASE_KEY = key; }
  // Los nombres, ajustados a la tarjeta una vez.
  NAMES = {};
  bctx.setTransform(S, 0, 0, S, 0, 0);
  for (const side of [1, 2]) {
    const p = meta[side === 1 ? "white" : "black"], max = 112;
    const size = fitText(bctx, p.name, max, (s) => `700 ${s}px Montserrat`, 15, 11);
    const name = ellipsize(bctx, p.name, max);
    bctx.font = "700 10.5px Montserrat";
    NAMES[side] = { font: `700 ${size}px Montserrat`, name, tag: ellipsize(bctx, p.tag || "", max) };
  }
  TITLE = fitTitle();
  CONF = makeConfetti();
  HEAD_KEY = null;
  PREV_KEY = null; PREV_ITEMS = null;
  return true;
};
// El primer fotograma de cada tanda sale entero porque `setup` borra PREV_KEY.
window.renderFrames = (states) => states.map((st) => snapshot(st));
// Para las pruebas: dónde pone la escena cada ficha (la misma cuenta que Python).
window.slotAt = (geom, kind, args) => {
  const fn = { point: pointX, stack: stackXY, bar: barXY, off: offXY }[kind];
  return fn(...args, geom);
};
</script>
