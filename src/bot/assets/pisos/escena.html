<!doctype html>
<!--
Escena de `pisos` (un mercado inmobiliario satírico de Canarias), dibujada con canvas.
La pinta Node con Skia (assets/escena_node.cjs) y, si no hay Node, un Chromium sin
ventana (ver bot/services/housing_scene.py).

No decide nada: Python le pasa cada pantalla ya formateada (bot/services/housing_view.py:
map_state, barrio_state, listing_state, portfolio_state, checkout_state, vpo_state, gestion_state y
candidates_state) y aquí solo se
pinta. Las cifras llegan como texto: la escena nunca calcula dinero. Funciones que llama
Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                no guarda nada entre pantallas: cada una se pinta entera desde cero.
- renderFrames(states)       una pantalla entera por estado: {x: 0, y: 0, u}.

Pantallas (`screen`): mapa, barrio, ficha, cartera, caja, vpo, gestion, candidatos, subastas, reformas, imprevistos, resenas, junta, plantas, dividir,
calles (streets_state: el plano del barrio) y edificio (building_state: el edificio en corte). Miden 1000 × 640, salvo el barrio y las plantas
(tarjetas en dos filas) y las calles (tres bandas), que miden 1000 × 760, dividir, 1000 × 700, y el edificio, 1000 × 1000 (hasta diez
plantas) (`SCREEN_H`; el Pillow de reserva, `housing_render`, lo repite). Como no hay estado entre fotogramas, el dibujo se reparte entre procesos sin cambiar un píxel.

El estilo es el de «Idealjovani», un portal de pisos parodiado: paleta canaria (atlántico,
turquesa, arena, picón, laurisilva, buganvilla y atardecer), rótulos en Luckiest Guy y cifras en
Montserrat. Las islas y el papel de la caja se dibujan una vez por proceso en lienzos aparte (`cached`)
y después se copian. Las fachadas no: cada una se pinta sobre la pantalla (cielo, paisaje, suelo, edificio
y lo de delante) y cuesta lo que se ve, ~3 ms; un lienzo cacheado por tema serían ~10 MB por proceso.

Todo se dibuja al doble de tamaño (S = 2) y se reduce al copiarlo. Nada de Math.random
(el azar sale de un hash de la clave del inmueble) y nada de emojis: el Chromium del Docker no
trae su fuente, así que los iconos son trazos de canvas.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  @font-face { font-family: "RobotoM"; src: url("../memes/fonts/robotomedium.ttf"); }
  @font-face { font-family: "RobotoR"; src: url("../memes/fonts/robotoregular.ttf"); }
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
// Todas miden 1000 de ancho. De alto, 640 salvo las de `SCREEN_H` (el barrio, con sus diez tarjetas en
// dos filas, mide más): cada alto tiene sus lienzos y `paintScreen` pone `H` y `g` de la pantalla que toca.
const W = 1000;
const SCREEN_H = { barrio: 760, plantas: 760, dividir: 700, calles: 760, edificio: 1000 };
let H = 640;

const SURFACES = new Map();
function surface(h) {
  let s = SURFACES.get(h);
  if (!s) {
    const big = document.createElement("canvas"); big.width = W * S; big.height = h * S;
    const out = document.createElement("canvas"); out.width = W; out.height = h;
    s = { big, out, g: big.getContext("2d"), octx: out.getContext("2d") };
    SURFACES.set(h, s);
  }
  return s;
}
let cur = surface(H);
let g = cur.g;

// La paleta canaria: azul atlántico, turquesa, arena volcánica, negro de picón, verde de laurisilva,
// buganvilla y naranja de atardecer.
const C = {
  paper: "#fbf3e0", paper2: "#f2e4c6", card: "#fffdf6", ink: "#1b2a35", mute: "#675f52", line: "#e5d6b6",
  atl: "#0f4c81", atlDk: "#0a2f52", turq: "#1fb5ad", turqDk: "#13867f", sand: "#f0dfb2", sandDk: "#cfb676",
  pico: "#2a242d", laurel: "#2f7d4f", laurelDk: "#1f5a37", bug: "#d6337a", bugDk: "#a81f5c", sun: "#f58220",
  sunDk: "#d4600c", gold: "#f6bd2d",
  green: "#1f9d55", greenDk: "#137a3f", red: "#d23a3a", redDk: "#b3261e", amber: "#f2a900", grey: "#8a95a3",
  blue: "#1f6fb2", orange: "#ee6a10",
};
const F = {
  d: (s) => `700 ${s}px Montserrat`,
  m: (s) => `${s}px RobotoM`,
  r: (s) => `${s}px RobotoR`,
  t: (s) => `${s}px Luckiest`,
};

// -- Utilidades ---------------------------------------------------------------------------

function hash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

// Un lienzo pintado una sola vez por proceso (islas, fondos): después solo se copia.
const CACHE = new Map();
function cached(key, w, h, draw) {
  let c = CACHE.get(key);
  if (!c) {
    c = document.createElement("canvas"); c.width = Math.round(w * S); c.height = Math.round(h * S);
    const saved = g;
    g = c.getContext("2d"); g.setTransform(S, 0, 0, S, 0, 0);
    try { draw(); } finally { g = saved; }
    CACHE.set(key, c);
  }
  return c;
}
// Copia un lienzo de `cached` 1 a 1 (sin remuestrear: sus píxeles son los de `big`).
function blit(c, x, y, w, h) { g.drawImage(c, x, y, w, h); }

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function fillRR(x, y, w, h, r, color) { rr(x, y, w, h, r); g.fillStyle = color; g.fill(); }
function rect(x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, color, width = 1) {
  g.strokeStyle = color; g.lineWidth = width; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}
function poly(points, color) {
  g.beginPath(); points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = color; g.fill();
}
function dot(x, y, r, color) { circle(x, y, r); g.fillStyle = color; g.fill(); }
function ell(x, y, rx, ry, color, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = color; g.fill(); }
function vgrad(y0, y1, a, b) {
  const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr;
}
function lgrad(x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
function rgrad(x, y, r0, r1, stops) {
  const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
// Motas repartidas por un recuadro (azar repetible): gravilla, desgaste, estrellas.
function speckle(x, y, w, h, seed, n, size, color) {
  const r = rng(seed); g.fillStyle = color; g.beginPath();
  for (let i = 0; i < n; i++) g.rect(x + r() * w, y + r() * h, size * (0.5 + r()), size * (0.5 + r()));
  g.fill(); // todas las motas de una vez: cada pintado suelto cuesta
}

// Texto: `o.font` ya montada, `o.color`, `o.align`.
function T(s, x, y, o = {}) {
  g.font = o.font || F.m(22); g.fillStyle = o.color || C.ink;
  // `y` es el centro de las mayúsculas: se pinta sobre la línea base y no con `middle`, que Chromium
  // y Skia en Node calculan distinto.
  y += parseFloat(g.font.match(/([\d.]+)px/)[1]) * (o.k ?? 0.35);
  g.textAlign = o.align || "left"; g.textBaseline = "alphabetic";
  if (o.skew) {
    g.save(); g.translate(x, y); g.transform(1, 0, -0.2, 1, 0, 0); g.fillText(s, 0, 0); g.restore();
  } else g.fillText(s, x, y);
}
// Un rótulo con borde y sombra (títulos en Luckiest, carteles, sellos).
function TX(s, x, y, o = {}) {
  g.font = o.font || F.t(30);
  const sz = parseFloat(g.font.match(/([\d.]+)px/)[1]), yy = y + sz * (o.k ?? 0.36);
  g.textAlign = o.align || "left"; g.textBaseline = "alphabetic"; g.lineJoin = "round";
  if (o.shadow) { g.fillStyle = o.shadow; g.fillText(s, x + (o.dx ?? 2), yy + (o.dy ?? 3)); }
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.sw ?? 5; g.strokeText(s, x, yy); }
  g.fillStyle = o.color || "#fff"; g.fillText(s, x, yy);
}
function width(s, font) { g.font = font; return g.measureText(s).width; }
function ellipsize(s, maxW, font) {
  g.font = font;
  if (g.measureText(s).width <= maxW) return s;
  let t = s;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
// Reduce la letra hasta que quepa; si ni con `min`, recorta con puntos suspensivos.
function fit(s, maxW, fontFn, size, min) {
  for (let z = size; z >= min; z--) { g.font = fontFn(z); if (g.measureText(s).width <= maxW) return [s, z]; }
  return [ellipsize(s, maxW, fontFn(min)), min];
}
function fitText(s, x, y, maxW, fontFn, size, min, o = {}) {
  const [t, z] = fit(s, maxW, fontFn, size, min);
  (o.fancy ? TX : T)(t, x, y, { ...o, font: fontFn(z) });
  return z;
}
// Parte en líneas de `maxW`; si sobran, la última acaba en «…».
function wrap(s, maxW, font, maxLines) {
  g.font = font;
  const words = String(s).split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const trial = cur ? cur + " " + words[i] : words[i];
    if (g.measureText(trial).width <= maxW || !cur) { cur = trial; continue; }
    if (lines.length === maxLines - 1) { cur = trial + " " + words.slice(i + 1).join(" "); break; }
    lines.push(cur); cur = words[i];
  }
  if (cur) lines.push(ellipsize(cur.trim(), maxW, font));
  return lines;
}
function paragraph(s, x, y, maxW, font, lh, maxLines, o = {}) {
  const lines = wrap(s, maxW, font, maxLines);
  lines.forEach((l, i) => T(l, x, y + i * lh, { ...o, font }));
  return lines.length;
}

// -- Piezas comunes -----------------------------------------------------------------------

// Tarjeta de papel con sombra cálida suave (capas, para que Node y Chromium den lo mismo).
const SHADOW_RING = [0, 0.2191, 0.1512, 0.0932, 0.0475, 0.016];
function card(x, y, w, h, o = {}) {
  const r = o.r ?? 14;
  // la sombra: anillos de 1 px (el mismo resultado que cinco capas rellenas, sin pintar toda la superficie)
  for (let k = 5; k >= 1; k--) { rr(x - k + 0.5, y - k + 4.5, w + 2 * k - 1, h + 2 * k - 1, r + k - 0.5); g.strokeStyle = `rgba(92,58,20,${SHADOW_RING[k]})`; g.lineWidth = 1; g.stroke(); }
  g.save(); g.beginPath(); g.rect(x - 1, y + h - r - 1, w + 2, r + 6); g.clip(); fillRR(x, y + 4, w, h, r, `rgba(92,58,20,${SHADOW_RING[1]})`); g.restore();
  fillRR(x, y, w, h, r, o.fill || C.card);
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r); g.strokeStyle = o.stroke || "rgba(160,120,60,0.28)"; g.lineWidth = o.stroke ? 2 : 1.2; g.stroke();
  if (o.top) { // franja de color arriba, como el canto de una ficha
    g.save(); rr(x, y, w, h, r); g.clip(); rect(x, y, w, o.top, o.topColor || C.sun); g.restore();
  }
}

const CHIP = {
  green: [C.green, "#fff"], blue: [C.blue, "#fff"], amber: [C.amber, "#3a2800"],
  red: [C.red, "#fff"], grey: [C.grey, "#fff"], orange: [C.orange, "#fff"], ink: [C.ink, "#fff"],
  bug: [C.bug, "#fff"], turq: [C.turqDk, "#fff"], steel: ["#44546a", "#fff"],
};
const STATUS_COLOR = { venta: "green", tuyo: "blue", compartido: "blue", parcial: "amber", ajeno: "grey",
  vacio: "grey", alquilado: "green", impago: "red", desahucio: "red", okupa: "red", habitual: "blue", obras: "amber", negocio: "blue",
  por_habitaciones: "turq", plantas: "steel", dividido: "steel" };
// Una etiqueta de color, con brillo arriba y canto abajo. Devuelve su ancho. `align`: left | right | center.
// `outline`: borde y sin relleno.
function chip(text, x, y, kind, o = {}) {
  const size = o.size || 20, maxW = o.maxW || 400, h = size + 14;
  const [t, z] = fit(text, maxW - 20, F.d, size, 13);
  const w = width(t, F.d(z)) + 22;
  const x0 = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  const [bg, fg] = CHIP[STATUS_COLOR[kind] || kind] || CHIP.grey;
  if (o.outline) { fillRR(x0, y, w, h, h / 2, "#fff"); rr(x0 + 1, y + 1, w - 2, h - 2, h / 2); g.strokeStyle = bg; g.lineWidth = 2; g.stroke(); }
  else {
    fillRR(x0, y + 2, w, h, h / 2, "rgba(0,0,0,0.22)");
    fillRR(x0, y, w, h, h / 2, bg);
    g.save(); rr(x0, y, w, h, h / 2); g.clip(); rect(x0, y, w, h * 0.45, "rgba(255,255,255,0.16)"); g.restore();
  }
  T(t, x0 + w / 2, y + h / 2 + 1, { font: F.d(z), color: o.outline ? bg : fg, align: "center" });
  return w;
}
// Lo que mide una etiqueta de `tag` (con su icono), sin pintarla.
function tagW(text, size, icon, maxW = 400) {
  const [t, z] = fit(text, maxW - 22 - (icon ? size + 6 : 0), F.d, size, 12);
  return width(t, F.d(z)) + 22 + (icon ? size + 6 : 0);
}
// Una etiqueta pequeña con un icono delante (casa, sol, corazón, aviso). Devuelve su ancho.
function tag(text, x, y, kind, icon, size = 16, maxW = 400) {
  const h = size + 10, ic = icon ? size + 6 : 0;
  const [t, z] = fit(text, maxW - 22 - ic, F.d, size, 12);
  const w = width(t, F.d(z)) + 22 + ic, [bg, fg] = CHIP[kind] || CHIP.grey;
  fillRR(x, y + 2, w, h, h / 2, "rgba(0,0,0,0.2)");
  fillRR(x, y, w, h, h / 2, bg);
  g.save(); rr(x, y, w, h, h / 2); g.clip(); rect(x, y, w, h * 0.45, "rgba(255,255,255,0.16)"); g.restore();
  if (icon) smallIcon(icon, x + 11 + size * 0.5, y + h / 2, size * 0.5, fg);
  T(t, x + 11 + ic, y + h / 2 + 1, { font: F.d(z), color: fg });
  return w;
}

// El logo de la casa: una casita blanca con el sol de Canarias saliendo del tejado.
function logoMark(cx, cy, sz) {
  // sol
  dot(cx + sz * 0.42, cy - sz * 0.55, sz * 0.36, C.gold);
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * 0.95 + i * Math.PI * 0.2;
    line(cx + sz * 0.42 + Math.cos(a) * sz * 0.46, cy - sz * 0.55 + Math.sin(a) * sz * 0.46,
      cx + sz * 0.42 + Math.cos(a) * sz * 0.62, cy - sz * 0.55 + Math.sin(a) * sz * 0.62, C.gold, sz * 0.1);
  }
  // casa
  g.fillStyle = "#fff";
  g.beginPath(); g.moveTo(cx - sz * 1.05, cy + sz * 0.02); g.lineTo(cx - sz * 0.1, cy - sz * 0.82); g.lineTo(cx + sz * 0.85, cy + sz * 0.02);
  g.lineTo(cx + sz * 0.62, cy + sz * 0.02); g.lineTo(cx + sz * 0.62, cy + sz * 0.9); g.lineTo(cx - sz * 0.82, cy + sz * 0.9);
  g.lineTo(cx - sz * 0.82, cy + sz * 0.02); g.closePath(); g.fill();
  fillRR(cx - sz * 0.32, cy + sz * 0.3, sz * 0.46, sz * 0.6, sz * 0.08, C.bug);
  rect(cx - sz * 0.78, cy + sz * 0.75, sz * 1.5, sz * 0.15, "#e7d6b0");
}

// -- Fondo, cabecera y pie ----------------------------------------------------------------

function background() {
  rect(0, 0, W, H, lgrad(0, 0, W * 0.35, H, [[0, "#fdf6e6"], [1, "#f1e2c2"]]));
  // un dibujo de olas muy suave, para que el papel no sea liso
  g.strokeStyle = "rgba(180,140,70,0.09)"; g.lineWidth = 2;
  for (let y = 110; y < H; y += 46) for (let x = ((y / 46) % 2) * 30 - 20; x < W; x += 60) {
    g.beginPath(); g.arc(x + 15, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.arc(x + 45, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
}

const TAGLINE = {
  mapa: "el portal de pisos del Atlántico", caja: "con fe pública (y mucha cara)",
  vpo: "sorteos con bombo oficial", barrio: "", ficha: "", cartera: "",
};
// Lo fijo de la cabecera (degradado, sol, olas, aleta, raya y logo): se pinta una vez por proceso.
function headerBack(sunX, fin) {
  g.save(); rect(0, 0, W, 88, lgrad(0, 0, W, 0, [[0, "#0a3566"], [0.55, "#0f6a93"], [1, "#19a7a6"]]));
  // el sol cayendo en el mar
  g.beginPath(); g.rect(0, 0, W, 88); g.clip();
  if (sunX) {
    rect(sunX - 100, 0, 200, 88, rgrad(sunX, 70, 4, 100, [[0, "rgba(255,200,80,0.55)"], [1, "rgba(255,200,80,0)"]]));
    dot(sunX, 74, 30, lgrad(0, 44, 0, 104, [[0, "#ffd75a"], [1, "#f06a2a"]]));
  }
  for (let k = 0; k < 3; k++) {
    g.beginPath(); g.moveTo(0, 88);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, 76 + k * 4 + Math.sin(x / (38 - k * 6) + k * 2) * (3 - k * 0.6));
    g.lineTo(W, 88); g.closePath(); g.fillStyle = `rgba(8,40,80,${0.2 + k * 0.1})`; g.fill();
  }
  if (fin) shark(fin, 80, 1.0, false);
  g.restore();
  rect(0, 86, W, 4, lgrad(0, 0, W, 0, [[0, C.gold], [0.5, C.sun], [1, C.bug]]));
  // la insignia
  fillRR(21, 19, 56, 56, 14, "rgba(0,0,0,0.3)");
  fillRR(20, 16, 56, 56, 14, lgrad(0, 16, 0, 72, [[0, "#ffb23a"], [1, "#ef5a2a"]]));
  rr(21.5, 17.5, 53, 53, 13); g.strokeStyle = "rgba(255,255,255,0.8)"; g.lineWidth = 2.5; g.stroke();
  logoMark(46, 41, 17);
}
// La cabecera de «Idealjovani»: degradado de atlántico a turquesa con sol y olas, logo y rótulo.
function header(title, sub, o = {}) {
  const sunX = o.right ? 0 : o.wordmark === false ? W - 70 : W - 292, fin = o.shark || 0;
  blit(cached(`cabecera:${sunX}:${fin}`, W, 90, () => headerBack(sunX, fin)), 0, 0, W, 90);
  const right = o.right ? o.rightW + 36 : (o.wordmark === false ? 0 : 230);
  const maxW = W - 96 - 20 - right;
  const size = o.size || 40;
  if (sub) {
    fitText(title, 92, 33, maxW, F.t, size, 22, { color: "#fff", fancy: true, shadow: "rgba(4,24,50,0.55)", dx: 1.5, dy: 2.5 });
    fitText(sub, 92, 67, maxW, F.m, 22, 16, { color: "#d6ecf5" });
  } else fitText(title, 92, 44, maxW, F.t, size, 22, { color: "#fff", fancy: true, shadow: "rgba(4,24,50,0.55)", dx: 1.5, dy: 2.5 });
  if (o.right) o.right();
  else if (o.wordmark !== false) {
    const w1 = width("ideal", F.t(30)), w2 = width("jovani", F.t(30)), x0 = W - 24 - w1 - w2;
    TX("ideal", x0, 33, { font: F.t(30), color: "#fff", shadow: "rgba(4,24,50,0.5)", dx: 1.5, dy: 2.5 });
    TX("jovani", x0 + w1, 33, { font: F.t(30), color: C.gold, shadow: "rgba(4,24,50,0.5)", dx: 1.5, dy: 2.5 });
    if (o.tagline) T(o.tagline, W - 24, 61, { font: F.m(16), color: "#d6ecf5", align: "right" });
  }
}
function footer(text) {
  TX("idealjovani", 20, H - 16, { font: F.t(19), color: C.sunDk, k: 0.34 });
  if (text) fitText(text, W / 2 + 40, H - 16, W - 340, F.r, 17, 13, { color: C.mute, align: "center" });
}

// -- Pegatinas y sellos con guasa ---------------------------------------------------------

// Una estrella de puntas (pegatinas redondas de «oferta»).
function burst(cx, cy, r, n, k, color) {
  g.beginPath();

const OWNER_COLORS = ["#7a6a5a", "#a8998a", "#5a4c40", "#c9bcae"];

  owners.forEach((o, i) => { const sw = w * o.shares / 100; rect(cx, y, sw, h, ownerColor(o, i)); cx += sw; rect(cx - 1, y, 1.5, h, "#fff"); });
  if (free > 0) {
    const fw = w * free / 100;
    rect(cx, y, fw, h, "#fff1c9");
    g.save(); g.beginPath(); g.rect(cx, y, fw, h); g.clip();
    for (let k = -h; k < fw; k += 7) line(cx + k, y + h, cx + k + h, y, "rgba(242,169,0,0.75)", 2);
    g.restore();
  }
  rect(x, y, w, h * 0.4, "rgba(255,255,255,0.22)");
  g.restore();

    g.lineWidth = r * 0.34; g.beginPath(); g.moveTo(-r * 0.7, 0); g.lineTo(-r * 0.15, r * 0.55); g.lineTo(r * 0.75, -r * 0.5); g.stroke();
  } else if (key === "cross") {
    g.lineWidth = r * 0.34; g.beginPath(); g.moveTo(-r * 0.6, -r * 0.6); g.lineTo(r * 0.6, r * 0.6); g.moveTo(r * 0.6, -r * 0.6); g.lineTo(-r * 0.6, r * 0.6); g.stroke();
  } else if (key === "up") {
    g.beginPath(); g.moveTo(0, -r * 0.85); g.lineTo(r * 0.9, r * 0.6); g.lineTo(-r * 0.9, r * 0.6); g.closePath(); g.fill();
  } else if (key === "down") {
    g.beginPath(); g.moveTo(0, r * 0.85); g.lineTo(r * 0.9, -r * 0.6); g.lineTo(-r * 0.9, -r * 0.6); g.closePath(); g.fill();
  } else if (key === "news") { // un periódico: la hoja, el titular y tres líneas
    fillRR(-r, -r * 0.8, r * 2, r * 1.6, r * 0.2, color);
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(-r * 0.7, -r * 0.5, r * 1.4, r * 0.34);
    for (let i = 0; i < 3; i++) g.fillRect(-r * 0.7, -r * 0.02 + i * r * 0.28, i === 2 ? r * 0.8 : r * 1.4, r * 0.13);
  } else if (key === "people") {
    for (const sx of [-1, 1]) { circle(sx * r * 0.45, -r * 0.4, r * 0.33); g.fill(); g.beginPath(); g.ellipse(sx * r * 0.45, r * 0.75, r * 0.55, r * 0.7, 0, Math.PI, TAU); g.fill(); }
  } else if (key === "tools") { // una llave inglesa: obras y reformas
    wrench(0, 0, r * 0.95, color);
  } else if (key === "star") {
    starPath(0, 0, r * 1.15, color);
  } else if (key === "hand") { // la mano levantada: eliges tú
    fillRR(-r * 0.55, -r * 0.05, r * 1.1, r * 0.95, r * 0.3, color);
    for (let i = 0; i < 4; i++) fillRR(-r * 0.55 + i * r * 0.28, -r * (i === 1 || i === 2 ? 0.95 : 0.8), r * 0.22, r * 1.0, r * 0.11, color);
    g.save(); g.rotate(-0.8); fillRR(-r * 0.95, r * 0.05, r * 0.5, r * 0.24, r * 0.12, color); g.restore();
  }
  g.restore();
}
// Un círculo con visto (verde) o cruz (rojo) delante de una comprobación.
function tick(ok, cx, cy, r) {
  circle(cx, cy, r); g.fillStyle = ok ? C.green : C.red; g.fill();
  smallIcon(ok ? "check" : "cross", cx, cy, r * 0.62, "#fff");
}

// -- Cosas del paisaje: palmeras, buganvillas, nubes ---------------------------------------

function cloud(x, y, s, a = 0.9) {
  g.fillStyle = `rgba(255,255,255,${a})`;
  for (const [dx, dy, r] of [[0, 0, 10], [12, -4, 13], [26, 0, 10], [13, 4, 9]]) { circle(x + dx * s, y + dy * s, r * s); g.fill(); }
}
function palm(x, y, h, lean = 0, s = 1) { // el pie en (x, y); copa a `h` de altura
  g.save(); g.translate(x, y);
  const tx = lean * h, ty = -h;
  g.strokeStyle = "#8a6a44"; g.lineWidth = 5 * s; g.lineCap = "round";
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(tx * 0.3, ty * 0.55, tx, ty); g.stroke();
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI + i * Math.PI / 7 + 0.05, len = (24 + (i % 2) * 6) * s;
    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.55 + len * 0.45;
    g.beginPath(); g.moveTo(tx, ty);
    g.quadraticCurveTo(tx + Math.cos(a) * len * 0.5, ty + Math.sin(a) * len * 0.9 - 6 * s, ex, ey);
    g.quadraticCurveTo(tx + Math.cos(a) * len * 0.5, ty + Math.sin(a) * len * 0.5 + 2 * s, tx, ty);
    g.fillStyle = i % 2 ? "#2f8a46" : "#3d9c52"; g.fill();
  }
  dot(tx, ty + 2 * s, 3 * s, "#6a4a2a");
  g.restore();
}
function bougain(x, y, s, seed = 1) { // una mata de buganvilla: hojas verdes y flores rosa fuerte
  const r = rng(seed * 977 + 13);
  for (let i = 0; i < 7; i++) dot(x + (r() - 0.5) * 22 * s, y - r() * 14 * s, (5 + r() * 3) * s, i % 2 ? "#3f8a47" : "#2f7a3c");
  for (let i = 0; i < 14; i++) dot(x + (r() - 0.5) * 26 * s, y - 2 * s - r() * 16 * s, (2.2 + r() * 1.6) * s, i % 3 ? "#d6337a" : "#f0529a");
}
function tree(x, y, h, kind = "laurel") {
  if (kind === "pine") {
    rect(x - 1.5, y - h * 0.25, 3, h * 0.25, "#6b4a2a");
    for (let k = 0; k < 3; k++) poly([[x - h * (0.3 - k * 0.07), y - h * (0.2 + k * 0.25)], [x, y - h * (0.55 + k * 0.25)], [x + h * (0.3 - k * 0.07), y - h * (0.2 + k * 0.25)]], k % 2 ? "#2d6a3e" : "#24593a");
  } else {
    rect(x - 1.5, y - h * 0.35, 3, h * 0.35, "#6b4a2a");
    dot(x, y - h * 0.62, h * 0.34, "#2f7d4f"); dot(x - h * 0.2, y - h * 0.5, h * 0.24, "#3a8d58"); dot(x + h * 0.2, y - h * 0.52, h * 0.22, "#276b44");
  }
}
function gull(x, y, s) {
  g.strokeStyle = "rgba(255,255,255,0.95)"; g.lineWidth = 1.8 * s; g.lineCap = "round";
  g.beginPath(); g.moveTo(x - 7 * s, y - 3 * s); g.quadraticCurveTo(x - 3 * s, y - 6 * s, x, y); g.quadraticCurveTo(x + 3 * s, y - 6 * s, x + 7 * s, y - 3 * s); g.stroke(); g.lineCap = "butt";
}
function umbrella(x, y, s, a, b) { // sombrilla de playa con el palo en (x, y) y la tela arriba
  line(x, y, x, y - 26 * s, "#6b5a48", 2 * s);
  for (let i = 0; i < 4; i++) poly([[x, y - 36 * s], [x - 20 * s + i * 10 * s, y - 24 * s], [x - 10 * s + i * 10 * s, y - 24 * s]], i % 2 ? a : b);
}
// Cumbres lejanas: una cadena de lomas con una capa de color.
function ridge(y, amp, color, seed, x0 = -60, x1 = 420, step = 28) {
  const r = rng(seed);
  g.beginPath(); g.moveTo(x0, 200);
  for (let x = x0; x <= x1; x += step) g.lineTo(x, y - Math.abs(Math.sin(x * 0.011 + seed)) * amp - r() * amp * 0.25);
  g.lineTo(x1, 200); g.closePath(); g.fillStyle = color; g.fill();
}

// -- Fachadas -----------------------------------------------------------------------------
// Cada una se dibuja en un recuadro de referencia de 300 x 200 (el suelo en y = 172), escalado a la
// altura de la caja y centrado; el fondo llena toda la caja. Dos cosas deciden cómo sale:
// - el barrio (`barrio_key` del estado) da el estilo del edificio (`t`): colonial (balcones de tea y
//   contraventanas), puerto (casas de colores), playa, resort (cal blanca y buganvillas), bloque (los de
//   los setenta), verde (laurisilva), piedra (basalto) y vpo, y sus colores (`STYLE`);
// - el tema del barrio (`theme`: marinero, histórico, céntrico, obrero, de playa, de lujo y rural) da el
//   cielo, el suelo, el paisaje de detrás (`SCENERY`, más el monumento propio en `MONUMENT`) y lo de delante
//   (`FRONT`). Cada tipo de inmueble (`DRAW`) recibe las dos cosas y la clave le da su semilla.

function toRgb(c) {
  if (c[0] === "#") { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  return [128, 128, 128];
}
function hexOf(rgb) { return "#" + rgb.map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join(""); }
// Aclara (k > 0) u oscurece (k < 0) un color #rrggbb.
function shade(c, k) { const a = toRgb(c), t = k < 0 ? 0 : 255, f = Math.abs(k); return hexOf(a.map((v) => v + (t - v) * f)); }
function hsl(h, s, l) { // a #rrggbb
  s /= 100; l /= 100; const a = s * Math.min(l, 1 - l), f = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return hexOf([f(0) * 255, f(8) * 255, f(4) * 255]);
}

// Mezcla dos colores #rrggbb (t = 0 da `a`, t = 1 da `b`).
function mix(a, b, t) { const p = toRgb(a), q = toRgb(b); return hexOf(p.map((v, i) => v + (q[i] - v) * t)); }

//                  arquitectura, pared,    madera/marco, tejado,   postigos,  tema (el del catálogo, por si el estado no lo trae)
const STYLE = {

  schamann: ["bloque", "#dccfb8", "#6b5a48", "#a9582f", "#8a7a68", "obrero"],
  tafira: ["verde", "#d6e6c8", "#4f7a45", "#a9582f", "#2f6b45", "rural"],
  telde: ["colonial", "#f7e2b4", "#8a4b2a", "#b4532a", "#b3361e", "obrero"],
  arucas: ["piedra", "#bcc3cc", "#4b525c", "#8f4a2a", "#3d6b8a", "rural"],

  taco: ["bloque", "#d8dade", "#5a6877", "#8f4a2a", "#7a8a9a", "obrero"],

  cristianos: ["resort", "#fdfdf8", "#2a8fbd", "#c76b3c", "#2a8fbd", "playa"],
  adeje: ["resort", "#fffaf0", "#d0883a", "#c76b3c", "#c9302c", "lujo"],
  "vpo:rehoyas": ["vpo", "#efe6d2", "#d0583a", "#8a95a3", "#d0583a", "obrero"],

  "vpo:tamaraceite": ["vpo", "#f3ead0", "#2f8a5a", "#8a95a3", "#2f8a5a", "obrero"],
  "vpo:anaza": ["vpo", "#eadfe8", "#7a4a9a", "#8a95a3", "#7a4a9a", "obrero"],
  "vpo:gallega": ["vpo", "#e6efd9", "#d09a1a", "#8a95a3", "#d09a1a", "obrero"],
  "vpo:cardonal": ["vpo", "#e3e9f3", "#c8452f", "#8a95a3", "#c8452f", "obrero"],
};
// El barrio de un inmueble: el que trae el estado (`barrio_key`) y, si no, el que dice su clave
// (`vegueta_piso2`, `solar_vegueta`, `vpo:jinamar`). La obra nueva (`obra_3`) no lo dice: ahí manda el estado.
function barrioOf(key, barrio) {
  if (barrio) return String(barrio);
  const k = String(key);
  return k.startsWith("solar_") ? k.slice(6) : k.split("_")[0];
}
function styleOf(key, barrio, theme) {
  const b = barrioOf(key, barrio);
  let a = STYLE[b];
  if (!a) { const h = hash(b) % 360; a = ["bloque", hsl(h, 45, 78), hsl(h, 40, 32), "#b4532a", hsl((h + 140) % 360, 40, 40), "obrero"]; }
  return { t: a[0], wall: a[1], trim: a[2], roof: a[3], acc: a[4], theme: SKY[theme] ? theme : a[5], base: b };
}

// -- El carácter de cada tipo de barrio (`theme`) --------------------------------------------
// Cielo, suelo, lo de detrás (`SCENERY`, más el monumento propio del barrio en `MONUMENT`) y lo de delante
// (`FRONT`). Todo se pinta sobre la fachada, sin lienzos aparte: cada fachada cuesta lo que se ve.

const SKY = {
  marinero: ["#62b4e4", "#f6ead6"], historico: ["#5aa6dc", "#f3ead0"], centro: ["#58aee6", "#e2f2fa"], obrero: ["#86aec8", "#e9ebea"],
  playa: ["#33a9e8", "#d6f2f9"], lujo: ["#2487dc", "#bde4f8"], rural: ["#72b4de", "#e3f0e4"],
};
const BAND = { marinero: "#2c8fc9", historico: "#a8b88a", centro: "#aab8c4", obrero: "#b9c6d0", playa: "#2fb6c8", lujo: "#1f8fd0", rural: "#7fb08a" };
const GROUND = { marinero: "#8f7a5c", historico: "#b2a088", centro: "#c5c8cc", obrero: "#8f979f", playa: "#ead9ab", lujo: "#eee9df", rural: "#8fae66" };
const PASTEL = ["#f2b8b2", "#f6d27a", "#8cc6e4", "#cfe3a8", "#e8a070", "#f4efe2", "#d6a8d8"];

function seaBand(y0, y1, a = "#2fb6c8", b = "#1d86b8") { rect(-60, y0, 480, y1 - y0, vgrad(y0, y1, a, b)); }
function waves(y0, y1, seed, alpha = 0.35) { // rayitas de espuma, de un trazo
  const q = rng(seed); g.beginPath();
  for (let y = y0; y < y1; y += 9) for (let x = -50 + q() * 20; x < 420; x += 30 + q() * 22) { g.moveTo(x, y); g.lineTo(x + 8 + q() * 8, y); }
  g.strokeStyle = `rgba(255,255,255,${alpha})`; g.lineWidth = 1.5; g.stroke();
}
// Casitas de colores en cuesta (de abajo arriba); `side` -1 la loma de la izquierda, 1 la de la derecha.
function colorTown(side, y0, rows, seed, pal = PASTEL) {
  const q = rng(seed);
  g.beginPath();
  if (side < 0) { g.moveTo(-70, 172); g.lineTo(-70, y0 - rows * 15 - 6); g.quadraticCurveTo(30, y0 - rows * 15 - 4, 120, 172); }
  else { g.moveTo(420, 172); g.lineTo(420, y0 - rows * 15 - 6); g.quadraticCurveTo(300, y0 - rows * 15 - 4, 200, 172); }
  g.closePath(); g.fillStyle = "#a89a7c"; g.fill();
  const hs = [];
  for (let k = 0; k < rows; k++) {
    const yb = y0 - k * 15, xa = side < 0 ? -66 : 206 + k * 30, xb = side < 0 ? 112 - k * 32 : 416;
    for (let x = xa + (k % 2) * 6; x < xb; x += 14 + q() * 4) { const w = 11 + q() * 4, h = 9 + q() * 6; hs.push({ x, yb, w, h, c: pal[Math.floor(q() * pal.length)], p: q() < 0.6 }); }
  }
  houses(hs);
}
// Muchas casitas de golpe, agrupadas por color y de cada cosa un solo trazo (una a una costaban el triple):
// `hs` = [{ x, yb, w, h, c, p }], con `p` si el tejado es a dos aguas y, si no, un remate plano de color `cap`.
function houses(hs, roof = "#b4532a", cap = "#e8e0d0") {
  const by = new Map();
  for (const t of hs) { let a = by.get(t.c); if (!a) by.set(t.c, (a = [])); a.push(t); }
  for (const [c, a] of by) { g.beginPath(); for (const t of a) g.rect(t.x, t.yb - t.h, t.w, t.h); g.fillStyle = c; g.fill(); }
  g.beginPath(); for (const t of hs) g.rect(t.x + t.w - 3, t.yb - t.h, 3, t.h); g.fillStyle = "rgba(0,0,0,0.1)"; g.fill();
  g.beginPath(); for (const t of hs) if (t.p) { g.moveTo(t.x - 1, t.yb - t.h); g.lineTo(t.x + t.w / 2, t.yb - t.h - 5); g.lineTo(t.x + t.w + 1, t.yb - t.h); g.closePath(); } g.fillStyle = roof; g.fill();
  g.beginPath(); for (const t of hs) if (!t.p) g.rect(t.x - 1, t.yb - t.h - 1.6, t.w + 2, 1.8); g.fillStyle = cap; g.fill();
  g.beginPath(); for (const t of hs) g.rect(t.x + 3, t.yb - t.h + 3, 3, 3.5); g.fillStyle = "rgba(40,60,80,0.55)"; g.fill();
}
function slopeY(pts, x) { // la altura de una ladera dada por puntos [x, y]
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) return lerp(pts[i - 1][1], pts[i][1], (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]));
  return pts[pts.length - 1][1];
}
function antenna(x, y, s = 1) { line(x, y, x, y - 12 * s, "#555", 1.3); line(x - 4 * s, y - 9 * s, x + 4 * s, y - 9 * s, "#555", 1.2); line(x - 3 * s, y - 12 * s, x + 3 * s, y - 12 * s, "#555", 1.1); }
function skyline(seed, y, c1 = "#b9c7d6", c2 = "#a9b9cc", c3 = "#c6d1dd") { // edificios lejanos con sus ventanas
  const q = rng(seed), cols = [c1, c2, c3], bodies = [[], [], []], wins = [];
  for (let x = -60; x < 420;) {
    const w = 20 + q() * 22, h = 36 + q() * 62;
    bodies[Math.floor(q() * 3)].push([x, y - h, w, h + 40]);
    for (let wy = y - h + 6; wy < y - 4; wy += 8) for (let wx = x + 4; wx < x + w - 5; wx += 7) wins.push([wx, wy]);
    x += w + 1 + q() * 4;
  }
  cols.forEach((c, k) => { g.beginPath(); for (const [bx, by, bw, bh] of bodies[k]) g.rect(bx, by, bw, bh); g.fillStyle = c; g.fill(); });
  g.beginPath(); for (const [wx, wy] of wins) g.rect(wx, wy, 3.2, 4.2); g.fillStyle = "rgba(255,255,255,0.4)"; g.fill();
}

const SCENERY = {
  marinero(st, r) { // el mar, dos lomas de casitas de colores, un dique con su faro y gaviotas
    seaBand(118, 172, "#2c8fc9", "#1f6fa6"); waves(124, 170, 5);
    rect(110, 148, 120, 7, "#8a8f94"); rect(110, 148, 120, 2, "rgba(255,255,255,0.4)"); rect(226, 128, 8, 20, "#f4f4f0"); rect(226, 134, 8, 4, "#d2403a"); rect(226, 142, 8, 4, "#d2403a"); poly([[224, 128], [236, 128], [230, 120]], "#d2403a");
    colorTown(-1, 168, 4, hash(st.base)); colorTown(1, 168, 4, hash(st.base) + 1);
    gull(70, 52, 1.2); gull(140, 38, 1); gull(250, 62, 1.1);
  },
  historico(st, r) { // lomas verdes y los tejados del casco antiguo
    ridge(126, 18, "#a8b88a", 3); ridge(142, 12, "#8fa46f", 5);
    const q = rng(hash(st.base + "t")), walls = ["#efe2c2", "#f2d27a", "#e8b99a", "#f4efe2"], hs = [];
    for (let x = -60; x < 420; x += 14 + q() * 10) { const h = 9 + q() * 12, w = 13 + q() * 6, y = 156 - q() * 4; hs.push({ x, yb: y, w, h, c: walls[Math.floor(q() * 4)], p: true }); }
    houses(hs, "#b8582e");
  },
  centro(st, r) { // la silueta de los edificios de la ciudad
    skyline(hash(st.base + "sk"), 156);
    rect(-60, 154, 480, 18, "rgba(150,165,180,0.5)");
  },
  obrero(st, r) { // bloques en la ladera, con antenas y la ropa de media barriada
    const ls = [[-70, 118], [120, 130], [260, 94], [420, 84]];
    g.beginPath(); g.moveTo(-70, 172); ls.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(420, 172); g.closePath(); g.fillStyle = "#b7ab90"; g.fill();
    const q = rng(hash(st.base + "ladera")), cols = ["#e6dccb", "#d9d3c4", "#cfd6dc", "#e8d9c0", "#c9c2b4"], bl = [], ants = [], laundry = [];
    for (let x = -66; x < 420; x += 24 + q() * 16) {
      const w = 22 + q() * 12, h = 22 + q() * 24, y = slopeY(ls, x + w / 2) + 12;
      bl.push({ x, y, w, h, c: cols[Math.floor(q() * 5)] });
      if (q() < 0.55) ants.push([x + 4 + q() * (w - 8), y - h - 2]);
      if (q() < 0.35) { const cc = ["#d6337a", "#f6bd2d", "#1f8aa0", "#fff"]; for (let k = 0; k < 3; k++) laundry.push([x + 3 + k * 5, y - h + 14, cc[(k + Math.floor(q() * 4)) % 4]]); }
    }
    const by = new Map(); // los bloques por color y de cada cosa (sombra, remate, ventanas, antenas) un solo trazo

  rect(-60, 172, 480, 48, vgrad(172, 215, base, shade(base, -0.12)));
  rect(-60, 172, 480, 3, "rgba(0,0,0,0.2)");
  if (o.mini) return;
  GROUND_TEX[th](rng(hash(o.key + "g")));
}

// -- Piezas -----------------------------------------------------------------------------

// Una ventana según el estilo: postigos, marco, cristal, persiana o cortina.
function win(st, x, y, w, h, o = {}) {
  const t = st.t, r = o.r || rng(hash(String(x) + y));
  const frame = t === "bloque" ? "#b8c0c8" : t === "piedra" ? "#5a606a" : t === "colonial" || t === "verde" ? st.trim : "#f8f8f4";
  if (MINI) { rect(x - 2, y - 2, w + 4, h + 4, frame); rect(x, y, w, h, o.lit ? "#ffd86a" : "#7fa6c0"); return; }
  if (!o.noShutters && (t === "colonial" || t === "resort" || t === "puerto" || t === "verde")) {
    const sw = w * 0.34;
    const xs = [x - sw - 1, x + w + 1];
    for (const sx of xs) rect(sx, y - 1, sw, h + 2, st.acc);
    g.beginPath(); // las lamas de los dos postigos, de un trazo
    for (const sx of xs) for (let k = 3; k < h; k += 3.6) { g.moveTo(sx + 1, y + k); g.lineTo(sx + sw - 1, y + k); }
    g.strokeStyle = "rgba(0,0,0,0.28)"; g.lineWidth = 0.9; g.stroke();
    for (const sx of xs) rect(sx, y - 1, sw, 1.2, "rgba(255,255,255,0.35)");
  }
  rect(x - 2.2, y - 2.2, w + 4.4, h + 4.4, frame);
  if (o.lit) {
    fillRR(x - 6, y - 6, w + 12, h + 12, 4, "rgba(255,196,60,0.42)");
    rect(x, y, w, h, vgrad(y, y + h, "#fff0a8", "#ffc94a"));
    rect(x + w * 0.1, y + h * 0.1, w * 0.3, h * 0.8, "rgba(255,255,255,0.5)");
    if (o.heart) smallIcon("heart", x + w / 2, y + h * 0.55, Math.min(w, h) * 0.28, "#d6337a");
  } else {
    rect(x, y, w, h, vgrad(y, y + h, "#9cc0d8", "#527a96"));
    g.fillStyle = "rgba(255,255,255,0.26)"; g.beginPath(); g.moveTo(x, y + h * 0.72); g.lineTo(x + w * 0.62, y); g.lineTo(x + w, y); g.lineTo(x + w, y + h * 0.14); g.lineTo(x + w * 0.2, y + h); g.lineTo(x, y + h); g.closePath(); g.fill();
    const q = r();
    if (q < 0.34) rect(x, y, w, h * (0.28 + r() * 0.34), t === "bloque" ? "#d8d0b8" : "rgba(250,244,230,0.92)"); // persiana a medias
    else if (q < 0.55) { poly([[x, y], [x + w * 0.32, y], [x + w * 0.12, y + h]], st.acc); poly([[x + w, y], [x + w * 0.68, y], [x + w * 0.88, y + h]], st.acc); } // cortinas
  }
  line(x + w / 2, y, x + w / 2, y + h, frame, 1.4);
  if (t === "colonial" || t === "verde" || t === "piedra") line(x, y + h * 0.5, x + w, y + h * 0.5, frame, 1.2);
  rect(x - 3.5, y + h + 2.2, w + 7, 2.6, t === "bloque" ? "#c5c9ce" : "#e8e0cf"); // alféizar
}
function bars(x, y, w, h, n, color = "#2a2f36") {
  g.beginPath();
  for (let i = 0; i <= n; i++) { g.moveTo(x + (w * i) / n, y); g.lineTo(x + (w * i) / n, y + h); }
  g.moveTo(x, y + h * 0.5); g.lineTo(x + w, y + h * 0.5);
  g.strokeStyle = color; g.lineWidth = 2.2; g.stroke();
}
function plant(x, y, s) {
  fillRR(x - 6 * s, y - 8 * s, 12 * s, 8 * s, 2, "#b4532a");
  for (const [dx, dy, rad] of [[-4, -14, 6], [4, -15, 6.5], [0, -20, 6]]) dot(x + dx * s, y + dy * s, rad * s, "#3f8a47");
}
function keybox(x, y) {
  fillRR(x, y, 9, 12, 2, "#323a44");
  for (let i = 0; i < 3; i++) dot(x + 4.5, y + 3 + i * 3.3, 1, "#d9dee5");
  rect(x + 1, y - 2, 7, 2, C.orange);
}
function acUnit(x, y) { fillRR(x, y, 17, 11, 2, "#eef1f4"); circle(x + 8.5, y + 5.5, 3.4); g.strokeStyle = "#9aa4ae"; g.lineWidth = 1; g.stroke(); rect(x + 1, y + 9, 15, 1.4, "#c4cbd3"); }
function dish(x, y) { g.beginPath(); g.ellipse(x, y, 7, 5, -0.5, 0, TAU); g.fillStyle = "#e7ebef"; g.fill(); line(x, y, x + 5, y + 7, "#8a95a3", 1.4); }
function clothesLine(x1, x2, y, r) {
  line(x1, y, x2, y + 1, "#7a6a5a", 1);
  const cols = ["#d6337a", "#f6bd2d", "#1f8aa0", "#fff", "#e8742a"];
  for (let x = x1 + 8; x < x2 - 10; x += 11 + r() * 6) { const hgt = 8 + r() * 6; rect(x, y, 7, hgt, cols[Math.floor(r() * cols.length)]); }
}

// El balcón de cada estilo: el de tea canario (madera torneada con su tejadillo), el de cal con maceta,
// el de hormigón con tendedero…
function balcony(st, x, y, w, r, roof = false) {
  if (MINI) { rect(x - 4, y - 1, w + 8, 3, st.t === "colonial" ? st.trim : "#8a929c"); return; }
  const t = st.t;
  if (t === "colonial") { // el balcón canario de tea: suelo con zapatas, balaustres torneados y tejadillo
    const dark = st.trim, mid = shade(st.trim, 0.24), bw_ = w + 14, bx0 = x - 7;
    if (roof) { poly([[bx0 - 3, y - 29], [bx0 + bw_ + 3, y - 29], [bx0 + bw_ + 8, y - 22], [bx0 - 8, y - 22]], st.roof); for (let k = bx0 - 2; k < bx0 + bw_ + 2; k += 5) line(k, y - 29, k - 1, y - 22, "rgba(0,0,0,0.25)", 1); rect(bx0 - 6, y - 22, bw_ + 12, 2.6, dark); rect(bx0, y - 20, 2.6, 6, dark); rect(bx0 + bw_ - 2.6, y - 20, 2.6, 6, dark); }
    rect(bx0 - 1, y, bw_ + 2, 5.4, dark); rect(bx0 - 1, y, bw_ + 2, 1.6, mid);
    g.beginPath(); // los balaustres torneados, de una vez
    for (let k = bx0 + 3; k <= bx0 + bw_ - 2; k += 6) { g.rect(k - 1.3, y - 15, 2.6, 15); g.moveTo(k + 2.7, y - 8); g.arc(k, y - 8, 2.7, 0, TAU); }
    g.fillStyle = mid; g.fill();
    rect(bx0 - 2, y - 18, bw_ + 4, 3.8, dark); rect(bx0 - 2, y - 18, bw_ + 4, 1.2, mid);
    for (let k = bx0 + 2; k < bx0 + bw_ - 6; k += 12) poly([[k, y + 5.4], [k + 6, y + 5.4], [k + 3, y + 12]], dark);
    for (let k = bx0 + 8; k < bx0 + bw_ - 4; k += 14) { dot(k, y - 21, 3.4, (hash(String(k) + x) % 3 ? "#d6337a" : "#e8742a")); rect(k - 2.4, y - 20, 4.8, 3, "#b4532a"); }
  } else if (t === "resort" || t === "playa") {
    rect(x - 3, y - 11, w + 6, 11, "#fff"); rect(x - 3, y - 11, w + 6, 2.4, "#ebe3d2"); rect(x - 4, y, w + 8, 3, "#e4dbc8");
    for (let k = x + 4; k < x + w - 2; k += 9) { circle(k + 1, y - 6, 2.4); g.fillStyle = "rgba(0,0,0,0.1)"; g.fill(); }
    bougain(x + w * 0.3, y - 10, 0.75, Math.floor(x)); if (w > 28) bougain(x + w * 0.78, y - 10, 0.7, Math.floor(x) + 3);
  } else if (t === "bloque") {
    rect(x - 4, y, w + 8, 4, "#cfd3d8"); rect(x - 4, y + 4, w + 8, 1.4, "rgba(0,0,0,0.18)");
    for (let k = 0; k <= 6; k++) line(x + (w * k) / 6, y - 12, x + (w * k) / 6, y, "#454d57", 1.3);
    line(x, y - 12, x + w, y - 12, "#454d57", 2);
    if (r() < 0.4) clothesLine(x + 1, x + w - 1, y - 10, r);
    else if (r() < 0.5) acUnit(x + w - 18, y - 11);
  } else {
    rect(x - 3, y, w + 6, 4, "#e8e4da");
    for (let i = 0; i <= 6; i++) line(x + (w * i) / 6, y - 12, x + (w * i) / 6, y, st.t === "puerto" ? "#1f3a5a" : "#3a424c", 1.4);
    line(x, y - 12, x + w, y - 12, st.t === "puerto" ? "#1f3a5a" : "#3a424c", 2);
    if (r() < 0.5) plant(x + 8, y, 0.7);
  }
}
// El tejadillo o la azotea de arriba.
function topOf(st, bx, bw, top, r, withTanks = true) {
  const t = st.t;
  if (t === "colonial" || t === "puerto" || t === "verde" || t === "piedra") {
    poly([[bx - 10, top + 6], [bx + 12, top - 12], [bx + bw - 12, top - 12], [bx + bw + 10, top + 6]], st.roof);
    for (let k = bx - 6; k < bx + bw + 6; k += 7) line(k, top + 5, k + 4, top - 11, "rgba(0,0,0,0.16)", 1.2);
    rect(bx - 10, top + 6, bw + 20, 3.4, shade(st.roof, -0.25));
    poly([[bx - 10, top + 6], [bx + 12, top - 12], [bx + 16, top - 12], [bx - 4, top + 6]], "rgba(255,255,255,0.14)");
  } else {
    rect(bx - 6, top - 7, bw + 12, 11, shade(st.wall, -0.14)); rect(bx - 6, top - 7, bw + 12, 2.4, "rgba(255,255,255,0.5)");
    if (withTanks) { rect(bx + 18, top - 19, 28, 12, "#aab4be"); rect(bx + 22, top - 24, 20, 5, "#8a95a3"); }
    if (t === "bloque") { line(bx + bw - 30, top - 7, bx + bw - 30, top - 30, "#555", 1.6); line(bx + bw - 38, top - 22, bx + bw - 22, top - 22, "#555", 1.6); line(bx + bw - 36, top - 28, bx + bw - 24, top - 28, "#555", 1.4); }
  }
}

function doorFor(st, x, y, w, h, o = {}) {
  if (MINI) { rect(x, y, w, h, st.trim); return; }
  const t = st.t;
  if (t === "colonial" || t === "piedra" || t === "verde") {
    fillRR(x - 5, y - 4, w + 10, h + 4, 3, shade(st.trim, -0.1));
    g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + 8); g.quadraticCurveTo(x + w / 2, y - 6, x + w, y + 8); g.lineTo(x + w, y + h); g.closePath(); g.fillStyle = shade(st.trim, 0.14); g.fill();
    line(x + w / 2, y + 2, x + w / 2, y + h, "rgba(0,0,0,0.35)", 1.4);
    for (let i = 0; i < 3; i++) for (const sx of [x + w * 0.26, x + w * 0.74]) dot(sx, y + 12 + i * (h - 16) / 3, 1.3, C.gold);
    dot(x + w / 2 + 4, y + h * 0.55, 2, C.gold);
  } else if (t === "resort" || t === "playa") {
    fillRR(x - 3, y, w + 6, h, 3, "#fff"); rect(x, y + 3, w, h - 3, vgrad(y, y + h, "#aacfe4", "#5f88a4")); line(x + w / 2, y + 3, x + w / 2, y + h, "#fff", 1.6);
    rect(x - 6, y - 5, w + 12, 4, st.acc);
  } else {
    fillRR(x - 3, y - 2, w + 6, h + 2, 3, st.trim); fillRR(x, y + 2, w, h - 2, 2, "#3a2a20"); rect(x + 3, y + 5, w - 6, h * 0.42, "#8fb2cc");
    dot(x + w - 5, y + h * 0.62, 1.8, C.gold);
    if (t === "bloque") { fillRR(x + w + 5, y + 8, 7, 14, 1.5, "#45515d"); for (let k = 0; k < 3; k++) dot(x + w + 8.5, y + 11 + k * 4, 1, "#d9dee5"); }
  }
}

// Un edificio de plantas: paredes, remate, ventanas y balcones; `rows` plantas, la 0 es la calle.
function block(st, r, o, cfg) {
  const { bx, bw, top, bottom, rows, cols, lit = null, balc = "alt", roofBalc = false, shop = false, awn = false, garage = false } = cfg;
  rect(bx, top, bw, bottom - top, lgrad(bx, 0, bx + bw, 0, [[0, shade(st.wall, 0.08)], [1, shade(st.wall, -0.1)]]));
  rect(bx, top, 6, bottom - top, "rgba(0,0,0,0.05)"); rect(bx + bw - 7, top, 7, bottom - top, "rgba(0,0,0,0.12)");
  if (!MINI) speckle(bx, top, bw, bottom - top, hash(o.key), 36, 2, "rgba(0,0,0,0.045)");
  if (!MINI && (st.t === "colonial" || st.t === "piedra")) { // esquinas de sillería y zócalo
    for (let y = top + 6; y < bottom - 4; y += 12) { rect(bx, y, 11, 6, shade(st.wall, -0.08)); rect(bx + bw - 11, y, 11, 6, shade(st.wall, -0.14)); }
    rect(bx, bottom - 16, bw, 16, shade(st.wall, -0.16));
  }
  topOf(st, bx, bw, top, r);
  const rowH = (bottom - top - 12) / rows;
  for (let k = 0; k < rows; k++) {
    const y0 = top + 8 + k * rowH, f = rows - 1 - k; // f = planta (0 = calle)
    if (f === 0) {
      const dw = 26, dx = bx + bw / 2 - dw / 2, dh = Math.min(rowH - 2, 38);
      doorFor(st, dx, bottom - dh, dw, dh);
      if (shop) { win(st, bx + 12, y0 + rowH * 0.3, 32, rowH * 0.5, { r, noShutters: true }); bars(bx + 12, y0 + rowH * 0.3, 32, rowH * 0.5, 4); }
      else if (garage) { // un portón de garaje a un lado y una ventana enrejada al otro
        rect(bx + bw - 64, bottom - 36, 50, 36, "#7a8794"); g.beginPath(); for (let y = bottom - 32; y < bottom - 2; y += 5) { g.moveTo(bx + bw - 64, y); g.lineTo(bx + bw - 14, y); } g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 1; g.stroke();
        rect(bx + 14, y0 + rowH * 0.28, 24, rowH * 0.52, "#6a7c8c"); bars(bx + 14, y0 + rowH * 0.28, 24, rowH * 0.52, 3);
      } else for (const sx of [bx + 14, bx + bw - 14 - 24]) { rect(sx, y0 + rowH * 0.28, 24, rowH * 0.52, "#6a7c8c"); bars(sx, y0 + rowH * 0.28, 24, rowH * 0.52, 3); }
      continue;
    }
    const cw = bw / cols, ww = Math.min(cw * 0.46, 26), wh = Math.min(rowH * 0.52, 24);
    for (let c = 0; c < cols; c++) {
      const wx = bx + c * cw + (cw - ww) / 2, wy = y0 + (rowH - wh) / 2 - 3;
      const isLit = lit && lit.f === f && lit.c === c;
      const showBalc = balc === "all" || (balc === "alt" && (f + c) % 2 === 0 && !isLit) || (balc === "lit" && isLit);
      if (showBalc) balcony(st, wx - 4, wy + wh + 3, ww + 8, r, roofBalc && f === rows - 1);
      win(st, wx, wy, ww, wh, { lit: isLit, r, noShutters: showBalc && st.t === "colonial" ? false : false, heart: isLit && o.status === "habitual" });
      if (awn && !MINI && !isLit && (f + c) % 3 === 1) awningOver(wx, wy - 3, ww, f % 2 ? st.acc : C.orange, "#fff");
      if (isLit) { dot(wx + ww / 2, wy - 11, 5, C.bug); poly([[wx + ww / 2 - 4, wy - 9], [wx + ww / 2 + 4, wy - 9], [wx + ww / 2, wy - 3]], C.bug); dot(wx + ww / 2, wy - 11, 1.8, "#fff"); }
    }
  }
  rect(bx - 6, bottom - 2, bw + 12, 4, "#b8bec6");
}

// -- Piezas para los tipos de inmueble ----------------------------------------------------

function wallBox(st, x, y, w, h) { rect(x, y, w, h, lgrad(x, 0, x + w, 0, [[0, shade(st.wall, 0.08)], [1, shade(st.wall, -0.1)]])); rect(x + w - 6, y, 6, h, "rgba(0,0,0,0.1)"); }
// Un toldo a rayas con su festón (un trazo por color).
function stripes(x, y, w, h, c1, c2, n) {
  const sw = w / n;
  for (let i = 0; i < n; i++) rect(x + i * sw, y, sw + 0.4, h, i % 2 ? c2 : c1);
  for (const [par, c] of [[0, c1], [1, c2]]) { g.beginPath(); for (let i = par; i < n; i += 2) { g.moveTo(x + (i + 1) * sw, y + h); g.arc(x + i * sw + sw / 2, y + h, sw / 2, 0, Math.PI); } g.fillStyle = c; g.fill(); }
}
function gableRoof(x0, x1, yEave, yRidge, color, over = 8) { // tejado a dos aguas visto de frente, con sus hileras de teja
  const cx = (x0 + x1) / 2, hh = yEave - yRidge, half = (x1 - x0) / 2 + over;
  poly([[x0 - over, yEave], [cx, yRidge], [x1 + over, yEave]], color);
  poly([[x0 - over, yEave], [cx, yRidge], [cx, yRidge + 5], [x0 + 6 - over, yEave]], "rgba(255,255,255,0.16)");
  g.beginPath(); for (let k = 1; k < 4; k++) { const yy = yEave - hh * k / 4, t = 1 - k / 4; g.moveTo(cx - half * t, yy); g.lineTo(cx + half * t, yy); } g.strokeStyle = "rgba(0,0,0,0.16)"; g.lineWidth = 1.1; g.stroke();
  rect(x0 - over, yEave, x1 - x0 + 2 * over, 3, shade(color, -0.25));
}
function neighbor(x, w, top, color, bottom = 172) { // un edificio vecino, de fondo
  rect(x, top, w, bottom - top, color); rect(x + w - 5, top, 5, bottom - top, "rgba(0,0,0,0.1)"); rect(x - 2, top - 3, w + 4, 3.4, shade(color, -0.2));
  g.beginPath(); for (let wy = top + 8; wy < bottom - 14; wy += 20) for (let wx = x + 7; wx < x + w - 12; wx += 18) g.rect(wx, wy, 8, 11); g.fillStyle = "rgba(60,90,120,0.55)"; g.fill();
}
function glass(x, y, w, h) { // un cristal con su brillo en diagonal
  rect(x, y, w, h, vgrad(y, y + h, "#bfe0f0", "#6f9cb8"));
  g.fillStyle = "rgba(255,255,255,0.3)"; g.beginPath(); g.moveTo(x, y + h * 0.7); g.lineTo(x + w * 0.6, y); g.lineTo(x + w, y); g.lineTo(x + w, y + h * 0.12); g.lineTo(x + w * 0.2, y + h); g.lineTo(x, y + h); g.closePath(); g.fill();
}
function awningOver(x, y, w, c1, c2) { poly([[x - 3, y - 2], [x + w + 3, y - 2], [x + w + 6, y + 7], [x - 6, y + 7]], c1); for (let k = 0; k < 4; k++) poly([[x - 3 + k * (w + 6) / 4, y - 2], [x - 3 + (k + 0.5) * (w + 6) / 4, y - 2], [x - 6 + (k + 0.5) * (w + 12) / 4, y + 7], [x - 6 + k * (w + 12) / 4, y + 7]], c2); }
function pallets(x, y, n = 3) { for (let i = 0; i < n; i++) { rect(x, y - 4 - i * 9, 26, 3, "#a07a4a"); rect(x + 1, y - 9 - i * 9, 24, 6, ["#c79e6a", "#d6ac78", "#b88a58"][i % 3]); rect(x, y - i * 9, 26, 1.8, "#8a6a3a"); } }
function barrel(x, y, c) { rect(x - 6, y - 16, 12, 16, c); rect(x - 6, y - 12, 12, 1.4, "rgba(0,0,0,0.3)"); rect(x - 6, y - 5, 12, 1.4, "rgba(0,0,0,0.3)"); ell(x, y - 16, 6, 2, shade(c, 0.2)); }
function agave(x, y, s) { g.save(); g.translate(x, y); for (let i = -3; i <= 3; i++) { const a = i * 0.32; poly([[0, 0], [Math.sin(a) * 15 * s - 3, -Math.cos(a) * 17 * s], [Math.sin(a) * 15 * s + 3, -Math.cos(a) * 17 * s]], i % 2 ? "#5f9a6f" : "#3f8a5a"); } g.restore(); }
function tunera(x, y, s) { for (const [dx, dy, a] of [[0, 0, 0], [-5, -9, -0.4], [6, -10, 0.3], [-1, -18, 0.1]]) { ell(x + dx * s, y + dy * s, 6 * s, 8 * s, "#5a9a4a", a); dot(x + dx * s - 2 * s, y + dy * s - 3 * s, 0.9 * s, "#2a4a1a"); } dot(x + 3 * s, y - 25 * s, 2 * s, "#d6337a"); dot(x - 7 * s, y - 17 * s, 1.8 * s, "#e8742a"); }
function waterline(y) { // el agua por delante de un casco: translúcida, con sus brillos
  rect(-60, y, 480, 215 - y, "rgba(24,104,168,0.5)"); g.beginPath(); for (let x = -50; x < 420; x += 26) { g.moveTo(x, y + 6 + (x % 3) * 4); g.lineTo(x + 12, y + 6 + (x % 3) * 4); } g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = 1.5; g.stroke();
}

// Los rótulos de los locales, según el tipo de barrio: [nombre, toldo A, toldo B].
const SHOPS = {
  marinero: [["PESCADOS", "#2a8fbd", "#fff"], ["BAR LA CALETA", "#d2403a", "#fff"], ["MARISQUERÍA", "#1f6fb2", "#f6e8b8"]],
  historico: [["ULTRAMARINOS", "#2f6b45", "#f6e8b8"], ["ARTESANÍA", "#8a4b2a", "#f6e8b8"], ["LIBRERÍA", "#7a2a3a", "#fff"]],

// La fachada de un inmueble. `o`: `key` (azar), `barrio` y `theme` (los del estado: `barrio_key` y `theme`; mandan
// en el color y el paisaje, así la obra nueva sale con la gama de su barrio), `floor`, `r` (esquinas), `status`
// (estado del piso: alquilado, impago, okupa…; pone la escena de cada uno) y `ribbon` (con cinta en la esquina).
let MINI = false; // la fachada que se pinta ahora es una miniatura
function facade(kind, x, y, w, h, o = {}) {
  o = { key: kind, kind, floor: "", ...o };
  o.mini = o.mini ?? w * h < 9000; // una miniatura: sin los detalles que no se ven
  // En una caja estrecha el recuadro de 300 se encoge hasta que quepan los 250 del medio (los edificios anchos no
  // se cortan) y sobra cielo por arriba (`o.up`, en unidades del recuadro).
  const st = styleOf(o.key, o.barrio ?? o.barrio_key, o.theme), r = rng(hash(o.key)), s = Math.min(h / 200, w / 250), dy = h - 200 * s;
  o.up = dy / s;
  g.save(); rr(x, y, w, h, o.r ?? 0); g.clip();
  g.translate(x + w / 2 - 150 * s, y + dy); g.scale(s, s);
  MINI = o.mini;
  backdrop(st, r, o);
  ground(st, o);
  (DRAW[kind === "piso2" || kind === "piso3" ? "piso" : kind] || DRAW.bajo)(st, r, o);
  foreground(st, o, kind);
  MINI = false;
  if (o.status && OVERLAY[o.status] && h >= 90) { o.ov = OV_AT[kind]?.(o); OVERLAY[o.status](o); }
  g.restore();
  if (o.ribbon && o.status && h >= 120) { g.save(); rr(x, y, w, h, o.r ?? 0); g.clip(); ribbon(o.status, x, y); g.restore(); }
}

// La costa: los puntos de control con irregularidades (puntos medios desplazados) y suavizada.

// Pinta una isla entera (mar, costa, relieve, bosques, cumbres, nubes) en su lienzo de `cw` x `ch`:
// la isla ocupa un cuadrado de `ch` y deja mar a los lados, donde van la rosa de los vientos y los barcos.
function paintIsland(key, cw, ch) {
  const sq = ch, ox = (cw - sq) / 2, r = rng(hash(key + "isla"));
  rect(0, 0, cw, ch, lgrad(0, 0, cw * 0.4, ch, [[0, "#3bb6d8"], [1, "#1a68a8"]]));
  for (let i = 0; i < 34; i++) { // olas
    const wx = r() * cw, wy = r() * ch, sz = 6 + r() * 3;
    g.strokeStyle = "rgba(255,255,255,0.3)"; g.lineWidth = 2; g.beginPath(); g.arc(wx, wy, sz, Math.PI * 1.1, Math.PI * 1.9); g.arc(wx + sz * 2, wy, sz, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
  g.save(); g.translate(ox, 0);
  const pts = coastPoints(key, sq, sq);
  g.lineJoin = "round";
  for (const [wdt, a] of [[64, 0.10], [46, 0.14], [30, 0.2], [17, 0.3], [8, 0.5]]) { pathOf(pts); g.strokeStyle = `rgba(110,226,226,${a})`; g.lineWidth = wdt; g.stroke(); }
  pathOf(pts); g.strokeStyle = "rgba(255,255,255,0.75)"; g.lineWidth = 6; g.stroke();

  const field = makeField(key), { img, gw, gh } = terrainPixels(field, key, sq, sq), tmp = document.createElement("canvas"); tmp.width = gw; tmp.height = gh; tmp.getContext("2d").putImageData(img, 0, 0);
  g.save(); pathOf(pts); g.clip();
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(tmp, 0, 0, gw, gh, 0, 0, sq, sq);
  // bosque: pinos en el centro de Gran Canaria, laurisilva en el norte de Tenerife
  const tr = rng(hash(key + "arboles"));
  const wet = (u, v) => { const h = field.height(u, v); return h > 0.22 && h < (key === "gc" ? 0.62 : 0.55); };
  let planted = 0;
  for (let n = 0; n < 900 && planted < 64; n++) {
    const u = 0.08 + tr() * 0.84, v = 0.05 + tr() * 0.9;
    const north = key === "tf" ? v < 0.55 : v < 0.72;
    if (!north || !wet(u, v)) continue;
    if (Math.abs(field.height(u + 0.01, v) - field.height(u - 0.01, v)) > 0.3) continue;

  pathOf(pts); g.strokeStyle = "rgba(120,92,40,0.55)"; g.lineWidth = 1.4; g.stroke();
  if (key === "gc") {
    // las dunas de Maspalomas, una mancha clara en el sur
    g.save(); pathOf(pts); g.clip(); ell(sq * 0.57, sq * 0.915, sq * 0.07, sq * 0.032, "rgba(255,240,190,0.9)", -0.2); ell(sq * 0.56, sq * 0.92, sq * 0.045, sq * 0.016, "rgba(240,205,130,0.9)", -0.2); g.restore();
    roque(sq * 0.335, sq * 0.52, 0.9);
    mountain(sq * 0.45, sq * 0.455, 34, 30, 0, "#8a7060");
  } else {
    // el mar de nubes, pegado a la ladera norte
    for (const [u, v, rx_, ry_] of [[0.27, 0.27, 0.1, 0.05], [0.38, 0.25, 0.1, 0.045], [0.5, 0.235, 0.1, 0.05], [0.6, 0.2, 0.09, 0.045], [0.2, 0.31, 0.08, 0.04], [0.7, 0.15, 0.08, 0.04]]) {
      g.save(); g.translate(u * sq, v * sq); g.scale(1, ry_ / rx_); dot(0, 0, rx_ * sq, rgrad(0, 0, 0, rx_ * sq, [[0, "rgba(255,255,255,0.92)"], [0.65, "rgba(255,255,255,0.7)"], [1, "rgba(255,255,255,0)"]])); g.restore();
    }
    mountain(sq * 0.345, sq * 0.575, 50, 38, 0, "#7a5a4a");
    mountain(sq * 0.445, sq * 0.585, 76, 70, 0.42, "#8a6858");
  }
  g.restore();
  // marcas del mar: la rosa de los vientos y unos veleros
  compass(cw - 30, ch - 44, 17);
  boat(key === "gc" ? 30 : ox + sq * 0.2, key === "gc" ? ch * 0.9 : ch * 0.14, 0.9);
  boat(key === "gc" ? cw - 36 : 34, key === "gc" ? ch * 0.55 : ch * 0.62, 0.75);

}

function house(cx, cy, sz, fill, stroke) {
  g.beginPath(); g.moveTo(cx - sz, cy); g.lineTo(cx, cy - sz * 0.9); g.lineTo(cx + sz, cy); g.lineTo(cx + sz * 0.7, cy); g.lineTo(cx + sz * 0.7, cy + sz * 0.8);
  g.lineTo(cx - sz * 0.7, cy + sz * 0.8); g.lineTo(cx - sz * 0.7, cy); g.closePath(); g.fillStyle = fill; g.fill();
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.5; g.stroke(); }
}
function changeColor(up, down) { return up ? C.greenDk : down ? C.redDk : C.mute; }
const pinTone = (b) => (b.owned ? C.blue : b.up ? C.green : b.down ? C.red : C.sun);

// El tipo de barrio (`theme` del catálogo), en la chincheta y en la leyenda: un icono pequeño sobre un disco de color.
const THEME_NAME = { marinero: "Marinero", historico: "Histórico", centro: "Céntrico", obrero: "Obrero", playa: "De playa", lujo: "De lujo", rural: "Rural" };
const THEME_PIN = { marinero: ["#0a3566", "anchor"], historico: ["#8a4b2a", "arch"], centro: ["#7a4a9a", "city"], obrero: ["#5a6877", "factory"], playa: ["#1fb5ad", "sun"], lujo: ["#1b1620", "gem"], rural: ["#6b7f1e", "leaf"] };
function themeIcon(key, cx, cy, s, color) { // glifos de un par de trazos: ancla, arco, ciudad, fábrica, sol, diamante y hoja
  g.save(); g.translate(cx, cy); g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round"; g.lineWidth = Math.max(1, s * 0.3);
  if (key === "anchor") {

    g.beginPath(); g.arc(0, s * 0.02, s * 0.72, Math.PI * 0.12, Math.PI * 0.88); g.stroke();
  } else if (key === "arch") {
    g.beginPath(); g.moveTo(-s * 0.7, s * 0.8); g.lineTo(-s * 0.7, -s * 0.1); g.arc(0, -s * 0.1, s * 0.7, Math.PI, 0); g.lineTo(s * 0.7, s * 0.8); g.closePath(); g.fill();
  } else if (key === "city") {

  } else if (key === "factory") {
    g.beginPath(); g.moveTo(-s * 0.85, s * 0.8); g.lineTo(-s * 0.85, -s * 0.05); g.lineTo(-s * 0.3, s * 0.3); g.lineTo(-s * 0.3, -s * 0.05); g.lineTo(s * 0.25, s * 0.3); g.lineTo(s * 0.25, -s * 0.05); g.lineTo(s * 0.5, s * 0.1); g.lineTo(s * 0.5, s * 0.8); g.closePath(); g.fill(); g.fillRect(s * 0.5, -s * 0.8, s * 0.35, s * 1.6);
  } else if (key === "sun") {

  } else if (key === "gem") {

  } else if (key === "leaf") {

  }

}
function themeBadge(theme, cx, cy, r) {

// Una chincheta numerada: el color dice si el barrio sube, baja o está igual; azul con casita si tienes algo; el
// disco de abajo a la derecha, el tipo de barrio.
function pin(px, py, n, b) {
  ell(px + 1, py + 6, 12, 4.5, "rgba(20,30,40,0.35)");
  dot(px, py, b.owned ? 13 : 12, "#fff"); dot(px, py, b.owned ? 11 : 10, pinTone(b));
  dot(px - 2.5, py - 3.5, 3, "rgba(255,255,255,0.3)");
  T(String(n), px, py + 0.5, { font: F.d(n > 9 ? 12 : 14), color: "#fff", align: "center" });
  if (b.owned) { dot(px + 11, py - 11, 8, "#fff"); dot(px + 11, py - 11, 6.5, C.blue); house(px + 11, py - 11.5, 4.4, "#fff"); }
  if (b.tense) { poly([[px - 11, py + 4], [px - 4, py + 4], [px - 7.5, py - 3]], "rgba(0,0,0,0.3)"); smallIcon("warn", px - 12, py + 11, 6, C.amber); }

function newsBadge(cx, cy, r) { dot(cx, cy, r + 1.5, "#fff"); dot(cx, cy, r, C.ink); smallIcon("news", cx, cy, r * 0.62, "#fff"); }

const MAP_H = 354; // la parte de la isla; debajo va la leyenda

function drawIsland(isl, bx, by, bw, bh) {
  card(bx, by, bw, bh, { r: 16 });
  g.save(); rr(bx, by, bw, bh, 16); g.clip();
  blit(cached("isla:" + isl.key, bw, MAP_H, () => paintIsland(isl.key, bw, MAP_H)), bx, by, bw, MAP_H);
  const sq = MAP_H, ox = bx + (bw - sq) / 2;
  isl.barrios.forEach((b, i) => pin(ox + b.x * sq, by + b.y * sq, i + 1, b));
  // el rótulo de la isla, como un cartel de madera clavado en la esquina
  const nm = isl.name, nw = width(nm, F.t(28)) + 30;
  fillRR(bx + 9, by + 11, nw, 40, 10, "rgba(0,0,0,0.3)"); fillRR(bx + 8, by + 8, nw, 40, 10, lgrad(0, by + 8, 0, by + 48, [[0, "#8a5a38"], [1, "#6b4228"]]));
  rr(bx + 11, by + 11, nw - 6, 34, 7); g.strokeStyle = "rgba(255,230,180,0.55)"; g.lineWidth = 1.6; g.stroke();
  TX(nm, bx + 8 + nw / 2, by + 28, { font: F.t(28), color: "#fff3d0", align: "center", shadow: "rgba(0,0,0,0.4)", dx: 1, dy: 2 });
  // la leyenda, en dos columnas: número (con el tipo de barrio), barrio y variación del precio
  const n = isl.barrios.length, rows = Math.ceil(n / 2), rh = Math.min(26, (bh - MAP_H - 14) / rows), colW = (bw - 28) / 2;
  rect(bx, by + MAP_H, bw, bh - MAP_H, "#fffaf0"); rect(bx, by + MAP_H, bw, 3, "#d9c89f");
  isl.barrios.forEach((b, i) => {
    const col = Math.floor(i / rows), row = i % rows, x = bx + 14 + col * colW, cy = by + MAP_H + 17 + row * rh;
    if (b.owned) fillRR(x - 4, cy - rh / 2 + 1, colW - 4, rh - 2, 8, "#e3effa");
    dot(x + 10, cy, 10, pinTone(b)); T(String(i + 1), x + 10, cy + 0.5, { font: F.d(i > 8 ? 12 : 14), color: "#fff", align: "center" });
    if (b.theme) themeBadge(b.theme, x + 27, cy, 5.6);
    const tone = changeColor(b.up, b.down), cw_ = width(b.change, F.d(17));
    fitText(b.name, x + 40, cy, colW - 40 - cw_ - 14, F.m, 19, 13, { color: C.ink });
    const right = x + colW - 10;
    T(b.change, right, cy, { font: F.d(17), color: tone, align: "right" });

}
// La clave de los discos de las chinchetas: una tira con los siete tipos de barrio.
function themeKey(y, news) {
  const keys = Object.keys(THEME_NAME), font = F.m(16), more = news ? 30 + width("Hay noticia", font) : 0;
  let x = 24; const total = keys.reduce((a, k) => a + 22 + width(THEME_NAME[k], font) + 22, 0) + width("Tipo de barrio", F.d(15)) + 14 + more;
  fillRR(16, y - 14, Math.min(968, total + 24), 28, 14, "rgba(255,250,240,0.85)");
  T("Tipo de barrio", x, y, { font: F.d(15), color: C.mute }); x += width("Tipo de barrio", F.d(15)) + 22;
  for (const k of keys) { themeBadge(k, x + 8, y, 8); T(THEME_NAME[k], x + 22, y, { font, color: C.ink }); x += 22 + width(THEME_NAME[k], font) + 22; }

}

// -- Pantallas ----------------------------------------------------------------------------

function shark(cx, cy, s, tie = true) { // un tiburón inmobiliario: la aleta, el mar y, si quiere, la corbata
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.beginPath(); g.moveTo(-26, 12); g.quadraticCurveTo(-8, 8, -4, -22); g.quadraticCurveTo(8, -6, 26, 12); g.closePath(); g.fillStyle = lgrad(0, -22, 0, 12, [[0, "#456a86"], [1, "#2a4560"]]); g.fill();
  g.beginPath(); g.moveTo(-4, -22); g.quadraticCurveTo(8, -6, 26, 12); g.lineTo(10, 12); g.quadraticCurveTo(6, -2, -4, -22); g.fillStyle = "rgba(0,0,0,0.16)"; g.fill();

  g.beginPath(); g.moveTo(-32, 12); for (let x = -32; x <= 32; x += 8) g.quadraticCurveTo(x + 2, 8, x + 4, 12); g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 2.4; g.stroke();

// MAPA ----------------------------------------------------------------------------------

function paintMapa(st) {
  const u = st.user;
  // a la derecha de la cabecera, el cuadro del jugador: el tiburón con su nombre y sus dos cifras
  header(st.title, st.subtitle, { rightW: 380, right() {
    fillRR(604, 8, 372, 72, 14, "rgba(255,255,255,0.14)"); rr(604, 8, 372, 72, 14); g.strokeStyle = "rgba(255,255,255,0.3)"; g.lineWidth = 1.2; g.stroke();
    shark(630, 28, 0.36);
    fitText(u.name, 654, 25, 310, F.d, 19, 14, { color: "#fff" });
    T("Efectivo", 622, 47, { font: F.m(17), color: "#d6ecf5" }); fitText(u.cash, 962, 47, 240, F.d, 21, 13, { color: "#fff", align: "right" });
    T("En ladrillo", 622, 68, { font: F.m(17), color: "#d6ecf5" }); fitText(u.worth, 962, 68, 220, F.d, 21, 13, { color: C.gold, align: "right" });
  } });
  const bw = 476, bh = 486, by = 98; // abajo queda la tira con la clave de los tipos de barrio
  st.islands.forEach((isl, i) => drawIsland(isl, 16 + i * (bw + 16), by, bw, bh));
  // Los titulares (`st.headlines`) no se pintan: la imagen va llena y el pin 📰 ya dice dónde hay noticia;

  themeKey(600, st.islands.some((isl) => isl.barrios.some((b) => b.news)));

// BARRIO --------------------------------------------------------------------------------

// Diez tarjetas en dos filas de cinco: una por botón, con su mismo número (`pisos:ver:N`). Discord encoge la
// imagen a ~0,55 en el escritorio y ~0,36 en el móvil: lo que hay que leer va a 19 px o más y el resto
// (título, rentabilidad, dueños…) se queda en la ficha. La décima es la obra nueva o, si el barrio aún no la
// tiene, el solar (`kind: "solar"`, sin botón).
const BARRIO_COLS = 5, CARD_W = 186, CARD_H = 278, CARD_GAP = 10, GRID_TOP = 162, FACADE_H = 138;

// Lo que no cabe a 19 px se dice más corto (la ficha lo lleva entero).
const shortStatus = (s) => s.replace(/^Tienes el (\d+) %$/, "Tienes $1 %").replace(/^Queda el (\d+) % libre$/, "$1 % libre");
const LEASE_SHORT = { alquilado: "Alquilado", impago: "No paga", desahucio: "Desahucio", okupa: "Okupado", vacio: "Vacío", habitual: "Hogar", obras: "En obras", negocio: "Negocio",
  por_habitaciones: "Habitaciones", plantas: "Por plantas", dividido: "En dos" };
function kindLabel(name, maxW) { return width(name, F.m(20)) > maxW ? name.replace("dormitorios", "dorm.") : name; }

// El número de la tarjeta, el mismo que el de su botón (apagado si es un solar).
function slotNumber(n, x, y, off) {

  T(String(n), x, y + 0.5, { font: F.d(n > 9 ? 19 : 22), color: "#fff", align: "center" });
}

function listingCard(c, n, x, y, o = {}) {
  const w = CARD_W, h = CARD_H, solar = c.kind === "solar", px = x + 10, pw = w - 20;
  card(x, y, w, h, { r: 12, top: 4, topColor: styleOf(c.key, c.barrio_key, c.theme).trim, ...(solar ? { fill: "#f6eed8", stroke: "#c9b27a" } : {}) });

// Lo que cabe en la etiqueta de una fila: la frase entera y, si no entra, una más corta.
const SHORT = { vacio: "Vacío", alquilado: "Alquilado", impago: "No paga", desahucio: "Desahucio", okupa: "Okupado", habitual: "Vives aquí", obras: "En obras", negocio: "Tu negocio",
  por_habitaciones: "Por habitaciones", plantas: "Por plantas", dividido: "En dos" };
// `compact`: dos líneas y la etiqueta a la derecha; con hipoteca lleva además una tercera con la deuda.
function itemRow(it, x, y, w, h, compact) {
  card(x, y, w, h, { r: 12 });
  // como la tarjeta de título de un tablero: una cinta del color del barrio y la foto con su marco
  g.save(); rr(x, y, w, h, 12); g.clip(); rect(x, y, 6, h, styleOf(it.key, it.barrio_key).trim); g.restore();
  const ih = h - 14, iw = compact ? Math.min(ih * 1.2, 56) : Math.min(ih * 1.3, 84), fx = x + 15, fy = y + 7;
  fillRR(fx - 3, fy - 1.5, iw + 6, ih + 6, 4, "rgba(60,40,10,0.25)"); fillRR(fx - 3, fy - 3, iw + 6, ih + 6, 4, "#fff");
  facade(it.kind, fx, fy, iw, ih, { key: it.key, barrio: it.barrio_key, theme: it.theme, floor: "", r: 3, status: it.status_kind });
  if (it.home) { // vives aquí: una chincheta con casa en la esquina de la fachada
    dot(fx + 6, fy + 6, 11, "#fff"); dot(fx + 6, fy + 6, 9, C.blue); house(fx + 6, fy + 5, 5, "#fff");
  }
  if (!compact && (it.badges || []).includes("vpo")) sticker("vpo", fx + iw - 22, fy + ih - 6, -0.1, 0.5);
  if (it.insured) { dot(fx + iw - 8, fy + 8, 10, "#fff"); shield(fx + iw - 8, fy + 8, 7, "on"); } // seguro de impago
  if (it.waiting > 0) { // candidatos esperando: la pastilla naranja con la gente y el número
    const nw = width(String(it.waiting), F.d(13)), pw_ = 22 + nw;
    fillRR(fx + 2, fy + ih - 19, pw_, 17, 8.5, "#fff"); fillRR(fx + 3, fy + ih - 18, pw_ - 2, 15, 7.5, C.orange);
    smallIcon("people", fx + 11, fy + ih - 10, 4.6, "#fff"); T(String(it.waiting), fx + 19, fy + ih - 9.5, { font: F.d(13), color: "#fff" });
  }
  const tx = fx + iw + 14, right = x + w - 14, vw = compact ? 128 : 160;
  const csize = compact ? 14 : 16, room = compact ? 150 : w - iw - 40;
  const label = it.status && width(it.status, F.d(csize)) + 24 > room ? SHORT[it.status_kind] || it.status : it.status;
  if (compact) {
    const mort = !!it.mortgage, a = mort ? 0.2 : 0.3, b = mort ? 0.55 : 0.72;
    fitText(it.title, tx, y + h * a, right - vw - tx - 8, F.m, 20, 18, { color: C.ink });
    fitText(`${it.barrio} · ${it.shares} %`, tx, y + h * b, right - vw - tx - 8, F.m, 18, 14, { color: C.mute });
    fitText(it.value, right, y + h * a, vw, F.d, 19, 12, { color: C.ink, align: "right" });
    if (label) chip(label, right, y + h * (mort ? 0.52 : 0.5) - (mort ? 13 : 0), it.status_kind, { size: csize, align: "right", maxW: 150 });
    if (mort) {
      smallIcon("bank", tx + 7, y + h * 0.82, 7, /debes/.test(it.mortgage) ? C.redDk : C.mute);
      fitText(it.mortgage, tx + 20, y + h * 0.82, right - tx - 20, F.m, 17, 12, { color: /debes/.test(it.mortgage) ? C.redDk : C.mute });
    }
    return;
  }
  fitText(it.title, tx, y + 22, right - vw - tx - 8, F.m, 22, 18, { color: C.ink });
  fitText(`${it.barrio} · ${it.shares} %`, tx, y + 49, right - vw - tx - 8, F.m, 19, 14, { color: C.mute });
  if (label) chip(label, tx, y + h - 34, it.status_kind, { size: csize, maxW: room });
  fitText(it.value, right, y + 24, vw, F.d, 23, 14, { color: C.ink, align: "right" });
  fitText(it.rent, right, y + 52, vw, F.m, 19, 13, { color: C.mute, align: "right" });
}

function paintCartera(st) {
  const u = st.user;
  // a la derecha de la cabecera: lo que debes tras una ejecución y si eres una SOCIMI
  const pills = [];
  if (st.bank_debt) pills.push({ text: `Tras la ejecución debes ${st.bank_debt}`, kind: "red" });
  if (st.socimi) pills.push({ text: "SOCIMI", kind: "grey" });
  if (st.waiting > 0) pills.push({ text: `${st.waiting} ${st.waiting === 1 ? "piso con candidatos" : "pisos con candidatos"}`, kind: "orange" });
  const psz = pills.length > 2 ? 14 : 17, pstep = pills.length > 2 ? 28 : 36; // con tres, más pequeñas para que quepan en la cabecera
  const pw = Math.max(0, ...pills.map((p) => width(p.text, F.d(psz)) + 22));
  header(`Los pisos de ${u.name}`, st.living || "Tu cartera de ladrillo", pills.length ? { rightW: pw, shark: 560, right() {
    pills.forEach((p, i) => chip(p.text, W - 20, pills.length === 1 ? 30 : pills.length === 2 ? 12 + i * pstep : 1 + i * pstep, p.kind, { size: psz, align: "right", maxW: 500 }));
  } } : { shark: 560, tagline: "tu cartera, tu tiburón" });
  const debt = !!st.debt, lw0 = debt ? 470 : 400;
  card(16, 100, lw0, 78);
  if (debt) { // tres cifras: cada una con el ancho que pide, y todas caben
    const cols = [["Efectivo", u.cash, C.ink], ["En ladrillo", u.worth, C.blue], ["Deuda con el banco", st.debt, C.redDk]];
    const nat = cols.map(([l, v]) => Math.max(width(l, F.m(17)), width(v, F.d(23))) + 14);
    const k = Math.min(1, (lw0 - 32) / nat.reduce((a, b) => a + b, 0));
    let cx = 32;
    cols.forEach(([l, v, c], i) => { const cw = nat[i] * k; fitText(l, cx, 122, cw - 6, F.m, 17, 13, { color: C.mute }); fitText(v, cx, 152, cw - 8, F.d, 23, 12, { color: c }); cx += cw; });
  } else {
    coins(42, 120, 1); T("Efectivo", 58, 122, { font: F.m(18), color: C.mute }); fitText(u.cash, 32, 152, 170, F.d, 25, 14, { color: C.ink });
    bricks(228, 120, 1); T("En ladrillo", 244, 122, { font: F.m(18), color: C.mute }); fitText(u.worth, 218, 152, 184, F.d, 25, 14, { color: C.blue });
  }
  // Lo de esta noche: la renta es la misma cifra que `saldo`. El título va en negrita para
  // no mezclarse con las etiquetas de las columnas; el Euríbor va al pie.
  const w = st.tonight, wx = 16 + lw0 + 16, ww = 984 - wx, wc = (ww - 32) / 4;
  card(wx, 100, ww, 78);
  T("Esta noche", wx + 16, 118, { font: F.d(18), color: C.ink });
  [["Renta", w.rent, C.ink], ["IBI", w.ibi, C.redDk], ["Gastos", w.costs, C.redDk], ["Neto", w.net, w.loss ? C.redDk : C.greenDk]].forEach(([l, v, c], i) => {
    const x = wx + 16 + i * wc;
    T(l, x, 142, { font: F.m(16), color: C.mute }); fitText(v, x, 164, wc - 8, F.d, 19, 12, { color: c });
  });
  if (st.empty) {
    card(16, 192, 520, 408); sofaRoom(16, 192, 520, 408);
    const gl = wrap("Generación inquilina", 424, F.t(54), 2);
    gl.forEach((l, i) => TX(l, 560, 262 + i * 60, { font: F.t(54), color: C.ink, stroke: "#fff8ea", sw: 6, shadow: "rgba(170,100,30,0.35)" }));
    paragraph("Vives con tus padres. Compra tu primera participación desde 1 %", 560, 392, 424, F.m(26), 36, 4, { color: C.mute });
    fillRR(560, 540, 330, 52, 26, C.orange); T("Elige un barrio y empieza", 725, 567, { font: F.d(19), color: "#fff", align: "center" });
    return;
  }
  // Las filas con hipoteca llevan una línea más y necesitan alto: si no caben con la franja de «Última hora»,
  // se quita la franja; si aun así no caben, se enseñan menos y el resto va a «y N más».
  // Python manda una página de 10 como mucho (◀ ▶ para el resto): abajo a la derecha, «Página 2 de 3».
  const hasMort = st.items.some((it) => it.mortgage), minH = hasMort ? 68 : 44;
  const paged = (st.pages || 1) > 1;
  let count = Math.min(st.items.length, 10), layout;
  for (; count >= 1; count--) {
    const more = st.items.length - count, many = count > 5, rows = Math.ceil(count / (many ? 2 : 1)), gap = many ? 8 : 10;
    for (const withNews of st.news.length ? [true, false] : [false]) {
      const bottom = many ? (withNews ? 540 : more || paged ? 570 : 604) : 604;
      const rh = clamp(Math.floor((bottom - 192 - gap * (rows - 1)) / rows), 44, 96);
      layout = { count, more, many, rows, gap, rh, withNews };
      if (rh >= minH) break;
    }
    if (layout.rh >= minH) break;
  }
  const { more, many, rows, gap, rh, withNews } = layout;
  const tail = [more ? `y ${more} más` : "", paged ? `Página ${st.page} de ${st.pages}` : ""].filter(Boolean).join(" · ");
  const items = st.items.slice(0, layout.count), top = 192;
  const hasNews = st.news.length > 0 && (many ? withNews : true);
  const lw = many ? 476 : hasNews ? 620 : 968;
  items.forEach((it, i) => {
    const col = many ? Math.floor(i / rows) : 0, r = many ? i % rows : i;
    itemRow(it, 16 + col * (lw + 16), top + r * (rh + gap), lw, rh, rh < 70 || hasMort);
  });
  if (!many) { // si sobra sitio, el tiburón da su consejo
    const used = top + items.length * (rh + gap), free = 604 - used - (tail ? 26 : 0);
    if (free >= 110) postIt(SHARK_TIPS[hash(u.name) % SHARK_TIPS.length], 16, used + 8, Math.min(lw, 540), Math.min(free - 8, 130), hash(u.name + "r") % 2 ? 0.012 : -0.012, "CONSEJO DEL TIBURÓN");
  }
  const news = st.news.map((raw) => { const i = raw.indexOf(" · "); return i > 0 ? [raw.slice(0, i), raw.slice(i + 3)] : ["", raw]; });
  if (tail && !(many && hasNews)) T(tail, 984, many ? 588 : 620, { font: F.m(20), color: C.mute, align: "right" });
  if (!hasNews) return;
  if (!many) {
    card(652, 192, 332, 412); T("Últimas noticias", 668, 214, { font: F.m(19), color: C.mute });
    let ny = 244;
    for (const [date, text] of news) {
      const lines = wrap(text, 250, F.r(20), 3);
      if (ny + lines.length * 24 > 596) break;
      T(date, 668, ny + 9, { font: F.d(16), color: C.orange });
      lines.forEach((l, k) => T(l, 722, ny + 9 + k * 24, { font: F.r(20), color: C.ink }));
      ny += lines.length * 24 + 10;
    }
  } else {
    card(16, 552, 968, 52); T("Última hora", 32, 578, { font: F.m(18), color: C.mute });
    T(news[0][0], 160, 578, { font: F.d(16), color: C.orange });
    // la noticia acaba donde empieza «y N más · Página 2 de 3»
    fitText(news[0][1], 222, 578, tail ? 972 - 16 - width(tail, F.m(20)) - 222 : 750, F.r, 20, 14, { color: C.ink });
    if (tail) T(tail, 972, 578, { font: F.m(20), color: C.mute, align: "right" });
  }
}

// Las dos comprobaciones de la VPO las decide housing_view (`income_ok`, `home_ok`).
function vpoChecks(u) {
  return [u.income_ok ?? u.eligible, u.home_ok ?? u.eligible];
}

// El bombo del sorteo: una esfera de cristal con bolas numeradas y su manivela.
function drum(cx, cy, r, seed) {
  const br = rng(seed), cols = ["#d6337a", "#1f8aa0", "#f58220", "#2f8a5a", "#f6bd2d", "#7a4a9a", "#d23a3a"];
  rect(cx - r * 0.6, cy + r * 0.88, r * 1.2, 7, "#6b4228"); rect(cx - r * 0.45, cy + r * 0.8, r * 0.9, 8, "#8a5a38");
  dot(cx, cy, r, "rgba(206,232,248,0.55)");
  g.save(); circle(cx, cy, r - 1); g.clip();
  for (let i = 0; i < 7; i++) { const a = br() * TAU, d = br() * r * 0.55, bx = cx + Math.cos(a) * d, by = cy + Math.sin(a) * d * 0.9 + r * 0.12; dot(bx, by, 10, cols[i % cols.length]); dot(bx - 2.8, by - 2.8, 2.6, "rgba(255,255,255,0.6)"); T(String(1 + (hash("b" + seed + i) % 9)), bx, by + 0.5, { font: F.d(12), color: "#fff", align: "center" }); }
  g.restore();
  circle(cx, cy, r); g.strokeStyle = "rgba(255,255,255,0.95)"; g.lineWidth = 2.6; g.stroke();
  g.beginPath(); g.arc(cx, cy, r - 7, Math.PI * 1.1, Math.PI * 1.45); g.strokeStyle = "rgba(255,255,255,0.85)"; g.lineWidth = 3; g.lineCap = "round"; g.stroke(); g.lineCap = "butt";
  line(cx + r, cy, cx + r + 12, cy, "#555", 3); dot(cx + r + 14, cy, 4, C.red);
}

// El sello redondo de la notaría: dos aros, una estrella y el texto dando la vuelta.
function roundStamp(cx, cy, r, color, rot) {
  r = Math.round(r);

  g.beginPath();

// Un escudo: verde con visto si el seguro cubre; gris y tachado si no.
function shield(cx, cy, s, tone) {
  const on = tone === "on";
  g.save(); g.translate(cx, cy); g.lineJoin = "round";
  const path = (dy) => {
    g.beginPath(); g.moveTo(-s * 0.9, -s * 0.75 + dy); g.quadraticCurveTo(-s * 0.35, -s * 0.7 + dy, 0, -s * 1.05 + dy); g.quadraticCurveTo(s * 0.35, -s * 0.7 + dy, s * 0.9, -s * 0.75 + dy);
    g.lineTo(s * 0.9, s * 0.1 + dy); g.quadraticCurveTo(s * 0.8, s * 0.75 + dy, 0, s * 1.1 + dy); g.quadraticCurveTo(-s * 0.8, s * 0.75 + dy, -s * 0.9, s * 0.1 + dy); g.closePath();
  };
  path(s * 0.1); g.fillStyle = "rgba(0,0,0,0.2)"; g.fill();
  path(0); g.fillStyle = on ? C.green : "#aab3bd"; g.fill(); g.strokeStyle = on ? C.greenDk : "#7d8791"; g.lineWidth = Math.max(1, s * 0.16); g.stroke();
  if (on) smallIcon("check", 0, -s * 0.05, s * 0.52, "#fff");
  else { line(-s * 0.62, s * 0.7, s * 0.62, -s * 0.7, "#fff", s * 0.44); line(-s * 0.62, s * 0.7, s * 0.62, -s * 0.7, C.redDk, s * 0.24); }
  g.restore();
}
function lupa(cx, cy, s, color) { // la lupa de quien elige a mano
  g.save(); g.translate(cx, cy); g.strokeStyle = color; g.lineCap = "round"; g.lineWidth = s * 0.22;
  g.beginPath(); g.arc(-s * 0.18, -s * 0.18, s * 0.58, 0, TAU); g.stroke(); line(s * 0.26, s * 0.26, s * 0.85, s * 0.85, color, s * 0.3); g.restore();
}
function robot(cx, cy, s, color) { // la gestora: un robot con antena
  g.save(); g.translate(cx, cy); line(0, -s * 0.5, 0, -s * 0.85, color, s * 0.14); dot(0, -s * 0.9, s * 0.15, color);
  fillRR(-s * 0.78, -s * 0.5, s * 1.56, s * 1.2, s * 0.28, color); fillRR(-s * 0.95, -s * 0.02, s * 0.17, s * 0.4, s * 0.06, color); fillRR(s * 0.78, -s * 0.02, s * 0.17, s * 0.4, s * 0.06, color);

  g.save(); g.translate(cx, cy); g.save(); g.rotate(-0.6); fillRR(-s * 0.7, -s * 0.85, s * 1.4, s * 0.55, s * 0.12, color); fillRR(-s * 0.1, -s * 0.35, s * 0.2, s * 1.3, s * 0.08, color); g.restore();
  fillRR(-s * 0.95, s * 0.72, s * 1.9, s * 0.28, s * 0.08, color); g.restore();

function chair(cx, cy, s, color) { // una silla vacía
  fillRR(cx - s * 0.5, cy - s * 1.15, s, s * 1.0, s * 0.14, color); fillRR(cx - s * 0.7, cy - s * 0.15, s * 1.4, s * 0.3, s * 0.1, shade(color, -0.12));

// El semáforo de riesgo: tres luces y la encendida lleva su signo (visto, aviso o cruz), no solo el color.
