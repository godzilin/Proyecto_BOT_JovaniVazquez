function paintGestion(st) {
  header(st.title, `${st.barrio} · Gestionar`, { size: 30, wordmark: false });
  const cw = 312, gap = 16, ch = 256, tips = st.tips || [], below = tips.length > 0 || !!st.news, y0 = below ? 104 : 150;
  const xs = [16, 16 + cw + gap, 16 + 2 * (cw + gap)];
  const head = (i, tone, title, icon) => { // la tarjeta: franja, disco con icono, título y raya
    const x = xs[i];
    card(x, y0, cw, ch, { r: 14, top: 5, topColor: tone });
    dot(x + 40, y0 + 46, 27, tone); dot(x + 40, y0 + 46, 24, "#fff"); icon(x + 40, y0 + 46);
    const lines = wrap(title, cw - 92, F.d(20), 2);
    lines.forEach((l, k) => T(l, x + 78, y0 + (lines.length === 1 ? 46 : 36 + k * 24), { font: F.d(20), color: C.ink }));
    rect(x + 14, y0 + 84, cw - 28, 1.4, C.line);
    return x;
  };
  // 1. quién elige al inquilino
  let x = head(0, C.blue, "¿Quién elige al inquilino?", (cx, cy) => (st.pick === "yo" ? lupa(cx, cy, 13, C.blue) : robot(cx, cy, 13, C.blue)));
  const n = paragraph(st.pick_text, x + 16, y0 + 108, cw - 32, F.m(20), 24, 2, { color: C.ink }), cy1 = y0 + 108 + (n - 1) * 24 + 20;
  if (st.decides) chip("Decides tú", x + 16, cy1, "green", { size: 17 });
  else if (st.boss) { // quien decide: la etiqueta y, debajo, su nombre (puede ser larguísimo)
    chip("Decide", x + 16, cy1 - 8, "grey", { size: 15 });
    fitText(st.boss, x + 16, cy1 + 34, cw - 32, F.d, 20, 13, { color: C.ink });
  }
  if (st.waiting > 0) {
    smallIcon("people", x + 30, y0 + ch - 42, 10, C.orange);
    fitText(`${st.waiting} ${st.waiting === 1 ? "candidato esperando" : "candidatos esperando"}`, x + 50, y0 + ch - 42, cw - 66, F.d, 19, 13, { color: C.sunDk });
  } else T("Nadie espera ahora", x + 16, y0 + ch - 42, { font: F.m(18), color: C.mute });
  fitText(st.dwelling ? st.status : `${st.status} · no es vivienda`, x + 16, y0 + ch - 18, cw - 32, F.r, 17, 12, { color: C.mute });
  // 2. el seguro de impago
  const tone2 = st.insured ? (st.covered ? C.green : C.amber) : C.grey;
  x = head(1, tone2, "Seguro de impago", (cx, cy) => shield(cx, cy, 15, st.insured && st.covered ? "on" : "off"));
  paragraph(st.insurance, x + 16, y0 + 108, cw - 32, F.m(18), 21, 3, { color: C.ink });
  if (!st.dwelling && !st.insured) { // el seguro solo cubre vivienda habitual (housing.insurable): sin prima que enseñar
    paragraph("El seguro de impago solo cubre vivienda habitual, no negocios.", x + 16, y0 + ch - 58, cw - 32, F.r(17), 21, 2, { color: C.mute });
  } else {
    row2(st.insured ? "Prima" : "Si lo contratas", st.premium, x + 16, y0 + ch - 58, cw - 32, { size: 20, vsize: 21 });
    fitText(`${st.premium_rate} de la renta + 8 % de primas`, x + 16, y0 + ch - 26, cw - 32, F.r, 17, 12, { color: C.mute });
  }
  // 3. si hay que desahuciar
  x = head(2, C.sunDk, "Si hay que desahuciar", (cx, cy) => gavel(cx, cy, 14, C.sunDk));
  T("Abogado y procurador", x + 16, y0 + 108, { font: F.m(19), color: C.mute });
  fitText(st.fee, x + 16, y0 + 150, cw - 100, F.d, 38, 22, { color: C.ink });
  T("+ IGIC", x + cw - 16, y0 + 156, { font: F.m(18), color: C.mute, align: "right" });
  if (st.fee_covered) { shield(x + 32, y0 + ch - 50, 13, "on"); chip("Lo paga el seguro", x + 54, y0 + ch - 66, "green", { size: 17, maxW: cw - 70 }); }
  else T("Lo pagas tú", x + 16, y0 + ch - 50, { font: F.d(19), color: C.mute });
  // debajo, las notas (consejos de la gestión) y la noticia del barrio
  if (tips.length) {
    const pw = tips.length === 1 ? 600 : 476, total = tips.length * pw + (tips.length - 1) * 16, nx = (W - total) / 2;
    tips.forEach((t, i) => postIt(t, nx + i * (pw + 16), y0 + ch + 16, pw, st.news ? 146 : 150, (hash(st.key + i) % 2 ? 1 : -1) * 0.012));
  }
  if (st.news) tips.length ? newsStrip(st.news, 16, 536, 968, 60) : newsStrip(st.news, 16, y0 + ch + 20, 968, 96);
}

// Un candidato: el número del botón, el retrato, quién es, el semáforo de riesgo, lo que cuesta y lo que dice.
function candidateCard(c, x, y, w, h) {
  const pad = 16, mx = x + w / 2, inner = w - 2 * pad;
  card(x, y, w, h, { r: 16, top: 6, topColor: C.sun });
  dot(x + 36, y + 45, 25, "rgba(0,0,0,0.22)"); dot(x + 36, y + 42, 25, "#fff"); dot(x + 36, y + 42, 21.5, C.sun);
  TX(String(c.slot), x + 36, y + 42, { font: F.t(34), color: "#fff", align: "center", stroke: "rgba(0,0,0,0.25)", sw: 3 });
  if (c.until) { T("Espera hasta", x + w - pad, y + 36, { font: F.m(15), color: C.mute, align: "right" }); T(`el ${c.until}`, x + w - pad, y + 55, { font: F.d(16), color: C.mute, align: "right" }); }
  tenantIcon(c.key, mx, y + 60, 32);
  fitText(c.name, mx, y + 108, inner, F.d, 23, 14, { color: C.ink, align: "center" });
  let cy = y + 126;
  if (c.age) { // la edad y, si es joven, su etiqueta (cuenta para la reducción en zona tensionada)

// Una estrella con relleno parcial (`frac` de 0 a 1, de izquierda a derecha) sobre otra apagada.
function starFrac(cx, cy, r, frac, on = C.gold, off = "#e3d8bc") {
  starPath(cx, cy, r, off);
  if (frac > 0) {
    g.save(); g.beginPath(); g.rect(cx - r - 1, cy - r - 1, (2 * r + 2) * frac, 2 * r + 2); g.clip();
    starPath(cx, cy, r, on); g.restore();
  }
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  g.closePath(); g.strokeStyle = "rgba(160,110,10,0.45)"; g.lineWidth = Math.max(1, r * 0.08); g.stroke();
}
// Cinco estrellas en fila, centradas en `x`; `value` de 0 a 5.
function starRow(x, cy, r, gap, value) {
  const x0 = x - (4 * gap) / 2;
  for (let i = 0; i < 5; i++) starFrac(x0 + i * gap, cy, r, clamp(value - i, 0, 1));
}

  fillRR(-s * 0.9, -s * 0.5, s * 1.8, s * 1.3, s * 0.2, color);

function crown(cx, cy, r, color) {

  g.lineTo(r, -r * 0.5); g.lineTo(r, r * 0.6); g.closePath(); g.fill();
  for (const dx of [-1, 0, 1]) dot(dx * r, dx ? -r * 0.55 : -r * 0.85, r * 0.16, color);
  g.restore();
}
function shield(cx, cy, r, color) {
  g.beginPath(); g.moveTo(cx - r * 0.85, cy - r * 0.8); g.lineTo(cx, cy - r); g.lineTo(cx + r * 0.85, cy - r * 0.8);

// La barra de una votación: sí (verde), sin votar (rayado, cuenta como sí) y no (rojo), con la muesca del umbral.
function voteBar(v, x, y, w, h, pct) {
  const t = v.total || 1, yw = w * v.yes / t, sw = w * v.silent / t, nw = w * v.no / t;
  g.save(); rr(x, y, w, h, h / 2); g.clip();
  rect(x, y, w, h, "#e6dfcf");
  rect(x, y, yw, h, C.green);
  if (sw > 0) {
    rect(x + yw, y, sw, h, "#dcd6c6");
    g.save(); g.beginPath(); g.rect(x + yw, y, sw, h); g.clip();
    for (let k = -h; k < sw; k += 7) line(x + yw + k, y + h, x + yw + k + h, y, "rgba(120,110,90,0.5)", 2);
    g.restore();

  rect(x + yw + sw, y, nw, h, C.red);
  rect(x, y, w, h * 0.4, "rgba(255,255,255,0.22)");

  rr(x + 0.5, y + 0.5, w - 1, h - 1, h / 2); g.strokeStyle = "rgba(0,0,0,0.18)"; g.lineWidth = 1; g.stroke();
  const mx = x + w * pct / 100;

  T(lab, mx, y - 12, { font: F.d(12), color: C.ink, align: pct >= 100 ? "right" : "center" });

// El plano del barrio: arriba lo del barrio (como en la de barrio, a la que sustituye) y sus tres calles en

const AZULEJO = "#1d4f9c";
const CALLE_TOP = 164, CALLE_H = 182, CALLE_GAP = 8, CALLE_ROAD = 20, CALLE_SKY = 50;
// Según cuántos edificios tenga la calle: el margen, el hueco entre ellos (con su palmera o farola) y la fachada.
const CALLE_FIT = { 3: { pad: 16, prop: 28, fw: 112 }, 4: { pad: 14, prop: 22, fw: 86 }, 5: { pad: 10, prop: 16, fw: 64 } };

// Una placa de calle canaria: azulejo blanco con su doble filete azul y los rombos en las esquinas. Devuelve su ancho.
function streetPlate(text, x, y, maxW, h = 40) {

  rect(x, y, w, h * 0.42, "rgba(255,255,255,0.55)");
  g.restore();
  g.strokeStyle = AZULEJO; rr(x + 3.5, y + 3.5, w - 7, h - 7, 4); g.lineWidth = 2.6; g.stroke();
  rr(x + 7.5, y + 7.5, w - 15, h - 15, 2); g.lineWidth = 1; g.stroke();
  for (const [cx, cy] of [[x + 12, y + 12], [x + w - 12, y + 12], [x + 12, y + h - 12], [x + w - 12, y + h - 12]]) poly([[cx, cy - 3.5], [cx + 3.5, cy], [cx, cy + 3.5], [cx - 3.5, cy]], AZULEJO);
  T(t, x + w / 2, y + h / 2 + 1, { font: F.d(z), color: AZULEJO, align: "center" });
  return w;
}

// Lo de dentro de un hueco, según su tipo y su uso. Las viviendas se parten en salas según el sitio que haya (una
// casa entera o un edificio sin dividir enseñan varias plantas de salas); qué salas, por la clave de la unidad.
const ROOM_POOL = ["salon", "dorm", "comedor", "tele", "ninos", "despacho", "gimnasio", "biblioteca", "plantas", "acuario", "estudio"];
const EXTRA_ROOMS = ["cocina", "bano", "ninos", "despacho", "gimnasio", "biblioteca", "plantas", "acuario", "dorm", "comedor", "tele"];
function roomsOf(u, k, n, r) {
  if (k === "habitacion") return ["dorm"];
  if (k === "estudio") return [pickOf(r, ["estudio", "estudio", "salon", "dorm"])];
  if (n === 1) return [pickOf(r, ROOM_POOL)];
  const out = [pickOf(r, ["salon", "tele", "comedor"]), pickOf(r, ["dorm", "dorm", "dorm", "ninos", "despacho", "biblioteca", "plantas", "acuario", "gimnasio"])];
  const rest = EXTRA_ROOMS.filter((x) => !out.includes(x));
  while (out.length < n) out.push(rest.splice(Math.floor(r() * rest.length), 1)[0] || pickOf(r, ROOM_POOL));
  return out;
}
const BARE_USES = new Set(["vacio", "desahucio", "obras", "okupa", "negocio"]);
