<!doctype html>
<!--
Escena de los negocios de `pala` (y del inicio de `pala`), dibujada con canvas.
La pinta Node con Skia (assets/escena_node.cjs) y, si no hay Node, un Chromium sin
ventana (ver bot/services/business_scene.py). Si no hay ninguno, el cog enseña el panel en texto.

No decide nada: Python le pasa cada pantalla ya formateada (bot/services/business_view.py) y aquí
solo se pinta. Las cifras llegan como texto: la escena nunca calcula dinero. Funciones que llama
Python:

- loadFonts()                espera a las fuentes (canvas no las carga solo).
- setup(meta)                no guarda nada entre pantallas: cada una se pinta entera desde cero.
- renderFrames(states)       una pantalla entera por estado: {x: 0, y: 0, u}.

Pantallas (`screen`), todas de 1000 × 640: dia (el inicio de `pala`: las 8 franjas, el curro y el
negocio), montar (elegir sector), negocio (la portada y la vista previa), almacen, cuentas, cliente
(el minijuego: comandas, caja o diagnóstico), cierre (el tique del turno) y, desde la fase 2,
mejoras (las del local y las campañas) y resenas, desde la fase 3, sociedad (convertir el negocio
en sociedad limitada o el balance de la suya, con la RIC, la chapa «ZEC 4 %» si está inscrita o
por qué no, en una franja azul, debajo de los avisos) y, desde la fase 4, plantilla (hasta 6 tarjetas de
empleado con su cara, contrato, humor, habilidades, rasgos y avisos, y las nóminas de la noche) y
candidatos (los de hoy y la oferta al elegido, con el sello «sin alta» si es en B) y, desde la fase 5,
cadena (hasta 4 tarjetas de local con su fachada pequeña, sus cifras de hoy, el gerente y el aviso, los
huecos que quedan y la tarjeta de la nave o «sin nave»), nave (en `mode` «alquilar», los tres tamaños
con el elegido y lo que cuesta abrirla; en «nave», el almacén con su barra de lleno, el stock, el barco
con lo que viene y el desglose del contenedor del producto elegido, con el ahorro en verde o en rojo o
por qué no se puede) y venta (lo que paga el comprador por la sociedad y lo que te llevas, con el sello
«sin comprador» y el porqué si no lo hay). La portada pinta a la plantilla en la acera (`staff`: sus
caras salen de `seeds`) con su línea de hoy, la chapa de la cadena (`locales`) y el gerente (`manager`);
la tarjeta del día, la chapa «+N locales» (`more`); el gerente de la plantilla lleva camisa y corbata
en vez del delantal y un maletín, y la oferta de gerente, su sello. Las
caras de empleados y candidatos son las de la gente (`person`, de `seed`) con el delantal del
negocio. El contrato de cada una está en la docstring de
bot/services/business_view.py. Una pantalla desconocida lanza un error. Los cinco sectores
(cafetería, tienda, taller, heladería y ferretería) tienen su fachada y su sala; cada producto
(`PRODUCT`) y cada mejora (`EQUIP`) tiene su icono, y la terraza se ve en la fachada.

Es del mismo mundo que `pisos` (assets/pisos/escena.html): su paleta canaria, sus fuentes y sus
cielos, paisajes y suelos de cada tema de barrio, copiados de allí. La fachada del negocio se dibuja
en el mismo recuadro de referencia de 300 × 200 (suelo en y = 172).

Todo se dibuja al doble de tamaño (S = 2) y se reduce al copiarlo. Nada de Math.random (el azar
sale de un hash de `seed` o de las claves) y nada de emojis: el Chromium del Docker no trae su
fuente, así que los iconos son trazos de canvas.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("../memes/fonts/MontserratBold.ttf"); font-weight: 700; }
  @font-face { font-family: "RobotoM"; src: url("../memes/fonts/robotomedium.ttf"); }
  @font-face { font-family: "RobotoR"; src: url("../memes/fonts/robotoregular.ttf"); }
  @font-face { font-family: "Luckiest"; src: url("../botes/fonts/luckiest-guy.woff"); }
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script>
"use strict";
const S = 2;
const W = 1000;
const H = 640;
const big = document.createElement("canvas"); big.width = W * S; big.height = H * S;
const out = document.createElement("canvas"); out.width = W; out.height = H;
let g = big.getContext("2d");
const octx = out.getContext("2d");

// La paleta canaria de `pisos`: azul atlántico, turquesa, arena volcánica, negro de picón, verde de
// laurisilva, buganvilla y naranja de atardecer.
const C = {
  paper: "#fbf3e0", paper2: "#f2e4c6", card: "#fffdf6", ink: "#1b2a35", mute: "#675f52", line: "#e5d6b6",
  atl: "#0f4c81", atlDk: "#0a2f52", turq: "#1fb5ad", turqDk: "#13867f", sand: "#f0dfb2", sandDk: "#cfb676",
  pico: "#2a242d", laurel: "#2f7d4f", laurelDk: "#1f5a37", bug: "#d6337a", bugDk: "#a81f5c", sun: "#f58220",
  sunDk: "#d4600c", gold: "#f6bd2d",
  green: "#1f9d55", greenDk: "#137a3f", red: "#d23a3a", redDk: "#b3261e", amber: "#f2a900", grey: "#8a95a3",
  blue: "#1f6fb2", orange: "#ee6a10",
};
const F = {
  d: (s) => `700 ${s}px Montserrat`,
  m: (s) => `${s}px RobotoM`,
  r: (s) => `${s}px RobotoR`,
  t: (s) => `${s}px Luckiest`,
};

// -- Lo de `pisos` (copiado de assets/pisos/escena.html) -----------------------------
// -- Utilidades ---------------------------------------------------------------------------

function hash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

// Un lienzo pintado una sola vez por proceso (islas, fondos): después solo se copia.
const CACHE = new Map();
function cached(key, w, h, draw) {
  let c = CACHE.get(key);
  if (!c) {
    c = document.createElement("canvas"); c.width = Math.round(w * S); c.height = Math.round(h * S);
    const saved = g;
    g = c.getContext("2d"); g.setTransform(S, 0, 0, S, 0, 0);
    try { draw(); } finally { g = saved; }
    CACHE.set(key, c);
  }
  return c;
}
// Copia un lienzo de `cached` 1 a 1 (sin remuestrear: sus píxeles son los de `big`).
function blit(c, x, y, w, h) { g.drawImage(c, x, y, w, h); }

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function fillRR(x, y, w, h, r, color) { rr(x, y, w, h, r); g.fillStyle = color; g.fill(); }
function rect(x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, color, width = 1) {
  g.strokeStyle = color; g.lineWidth = width; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}
function poly(points, color) {
  g.beginPath(); points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = color; g.fill();
}
function dot(x, y, r, color) { circle(x, y, r); g.fillStyle = color; g.fill(); }
function ell(x, y, rx, ry, color, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = color; g.fill(); }
function vgrad(y0, y1, a, b) {
  const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, a); gr.addColorStop(1, b); return gr;
}
function lgrad(x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
function rgrad(x, y, r0, r1, stops) {
  const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
// Motas repartidas por un recuadro (azar repetible): gravilla, desgaste, estrellas.
function speckle(x, y, w, h, seed, n, size, color) {
  const r = rng(seed); g.fillStyle = color; g.beginPath();
  for (let i = 0; i < n; i++) g.rect(x + r() * w, y + r() * h, size * (0.5 + r()), size * (0.5 + r()));
  g.fill(); // todas las motas de una vez: cada pintado suelto cuesta
}

// Texto: `o.font` ya montada, `o.color`, `o.align`.
function T(s, x, y, o = {}) {
  g.font = o.font || F.m(22); g.fillStyle = o.color || C.ink;
  // `y` es el centro de las mayúsculas: se pinta sobre la línea base y no con `middle`, que Chromium
  // y Skia en Node calculan distinto.
  y += parseFloat(g.font.match(/([\d.]+)px/)[1]) * (o.k ?? 0.35);
  g.textAlign = o.align || "left"; g.textBaseline = "alphabetic";
  if (o.skew) {
    g.save(); g.translate(x, y); g.transform(1, 0, -0.2, 1, 0, 0); g.fillText(s, 0, 0); g.restore();
  } else g.fillText(s, x, y);
}
// Un rótulo con borde y sombra (títulos en Luckiest, carteles, sellos).
function TX(s, x, y, o = {}) {
  g.font = o.font || F.t(30);
  const sz = parseFloat(g.font.match(/([\d.]+)px/)[1]), yy = y + sz * (o.k ?? 0.36);
  g.textAlign = o.align || "left"; g.textBaseline = "alphabetic"; g.lineJoin = "round";
  if (o.shadow) { g.fillStyle = o.shadow; g.fillText(s, x + (o.dx ?? 2), yy + (o.dy ?? 3)); }
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.sw ?? 5; g.strokeText(s, x, yy); }
  g.fillStyle = o.color || "#fff"; g.fillText(s, x, yy);
}
function width(s, font) { g.font = font; return g.measureText(s).width; }
function ellipsize(s, maxW, font) {
  g.font = font;
  if (g.measureText(s).width <= maxW) return s;
  let t = s;
  while (t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
// Reduce la letra hasta que quepa; si ni con `min`, recorta con puntos suspensivos.
function fit(s, maxW, fontFn, size, min) {
  for (let z = size; z >= min; z--) { g.font = fontFn(z); if (g.measureText(s).width <= maxW) return [s, z]; }
  return [ellipsize(s, maxW, fontFn(min)), min];
}
function fitText(s, x, y, maxW, fontFn, size, min, o = {}) {
  const [t, z] = fit(s, maxW, fontFn, size, min);
  (o.fancy ? TX : T)(t, x, y, { ...o, font: fontFn(z) });
  return z;
}
// Parte en líneas de `maxW`; si sobran, la última acaba en «…».
function wrap(s, maxW, font, maxLines) {
  g.font = font;
  const words = String(s).split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  for (let i = 0; i < words.length; i++) {
    const trial = cur ? cur + " " + words[i] : words[i];
    if (g.measureText(trial).width <= maxW || !cur) { cur = trial; continue; }
    if (lines.length === maxLines - 1) { cur = trial + " " + words.slice(i + 1).join(" "); break; }
    lines.push(cur); cur = words[i];
  }
  if (cur) lines.push(ellipsize(cur.trim(), maxW, font));
  return lines;
}
function paragraph(s, x, y, maxW, font, lh, maxLines, o = {}) {
  const lines = wrap(s, maxW, font, maxLines);
  lines.forEach((l, i) => T(l, x, y + i * lh, { ...o, font }));
  return lines.length;
}

// -- Piezas comunes -----------------------------------------------------------------------

// Tarjeta de papel con sombra cálida suave (capas, para que Node y Chromium den lo mismo).
const SHADOW_RING = [0, 0.2191, 0.1512, 0.0932, 0.0475, 0.016];
function card(x, y, w, h, o = {}) {
  const r = o.r ?? 14;
  // la sombra: anillos de 1 px (el mismo resultado que cinco capas rellenas, sin pintar toda la superficie)
  for (let k = 5; k >= 1; k--) { rr(x - k + 0.5, y - k + 4.5, w + 2 * k - 1, h + 2 * k - 1, r + k - 0.5); g.strokeStyle = `rgba(92,58,20,${SHADOW_RING[k]})`; g.lineWidth = 1; g.stroke(); }
  g.save(); g.beginPath(); g.rect(x - 1, y + h - r - 1, w + 2, r + 6); g.clip(); fillRR(x, y + 4, w, h, r, `rgba(92,58,20,${SHADOW_RING[1]})`); g.restore();
  fillRR(x, y, w, h, r, o.fill || C.card);
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r); g.strokeStyle = o.stroke || "rgba(160,120,60,0.28)"; g.lineWidth = o.stroke ? 2 : 1.2; g.stroke();
  if (o.top) { // franja de color arriba, como el canto de una ficha
    g.save(); rr(x, y, w, h, r); g.clip(); rect(x, y, w, o.top, o.topColor || C.sun); g.restore();
  }
}

const CHIP = {
  green: [C.green, "#fff"], blue: [C.blue, "#fff"], amber: [C.amber, "#3a2800"],
  red: [C.red, "#fff"], grey: [C.grey, "#fff"], orange: [C.orange, "#fff"], ink: [C.ink, "#fff"],
  bug: [C.bug, "#fff"], turq: [C.turqDk, "#fff"], steel: ["#44546a", "#fff"],
};
const STATUS_COLOR = { venta: "green", tuyo: "blue", compartido: "blue", parcial: "amber", ajeno: "grey",
  vacio: "grey", alquilado: "green", impago: "red", desahucio: "red", okupa: "red", habitual: "blue", obras: "amber" };
// Una etiqueta de color, con brillo arriba y canto abajo. Devuelve su ancho. `align`: left | right | center.
// `outline`: borde y sin relleno.
function chip(text, x, y, kind, o = {}) {
  const size = o.size || 20, maxW = o.maxW || 400, h = size + 14;
  const [t, z] = fit(text, maxW - 20, F.d, size, 13);
  const w = width(t, F.d(z)) + 22;
  const x0 = o.align === "right" ? x - w : o.align === "center" ? x - w / 2 : x;
  const [bg, fg] = CHIP[STATUS_COLOR[kind] || kind] || CHIP.grey;
  if (o.outline) { fillRR(x0, y, w, h, h / 2, "#fff"); rr(x0 + 1, y + 1, w - 2, h - 2, h / 2); g.strokeStyle = bg; g.lineWidth = 2; g.stroke(); }
  else {
    fillRR(x0, y + 2, w, h, h / 2, "rgba(0,0,0,0.22)");
    fillRR(x0, y, w, h, h / 2, bg);
    g.save(); rr(x0, y, w, h, h / 2); g.clip(); rect(x0, y, w, h * 0.45, "rgba(255,255,255,0.16)"); g.restore();
  }
  T(t, x0 + w / 2, y + h / 2 + 1, { font: F.d(z), color: o.outline ? bg : fg, align: "center" });
  return w;
}
// Lo que mide una etiqueta de `tag` (con su icono), sin pintarla.
function tagW(text, size, icon, maxW = 400) {
  const [t, z] = fit(text, maxW - 22 - (icon ? size + 6 : 0), F.d, size, 12);
  return width(t, F.d(z)) + 22 + (icon ? size + 6 : 0);
}
// Una etiqueta pequeña con un icono delante (casa, sol, corazón, aviso). Devuelve su ancho.
function tag(text, x, y, kind, icon, size = 16, maxW = 400) {
  const h = size + 10, ic = icon ? size + 6 : 0;
  const [t, z] = fit(text, maxW - 22 - ic, F.d, size, 12);
  const w = width(t, F.d(z)) + 22 + ic, [bg, fg] = CHIP[kind] || CHIP.grey;
  fillRR(x, y + 2, w, h, h / 2, "rgba(0,0,0,0.2)");
  fillRR(x, y, w, h, h / 2, bg);
  g.save(); rr(x, y, w, h, h / 2); g.clip(); rect(x, y, w, h * 0.45, "rgba(255,255,255,0.16)"); g.restore();
  if (icon) smallIcon(icon, x + 11 + size * 0.5, y + h / 2, size * 0.5, fg);
  T(t, x + 11 + ic, y + h / 2 + 1, { font: F.d(z), color: fg });
  return w;
}

function starPath(cx, cy, r, color) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * rr_, cy + Math.sin(a) * rr_); }
  g.closePath(); g.fillStyle = color; g.fill();
}

// Iconos pequeños para etiquetas y cajas: casa, sol, corazón, aviso, banco, visto y cruz.
function smallIcon(key, cx, cy, r, color) {
  g.save(); g.translate(cx, cy); g.fillStyle = color; g.strokeStyle = color; g.lineCap = "round"; g.lineJoin = "round";
  if (key === "house") {
    g.beginPath(); g.moveTo(-r, -r * 0.05); g.lineTo(0, -r); g.lineTo(r, -r * 0.05); g.lineTo(r * 0.7, -r * 0.05); g.lineTo(r * 0.7, r * 0.85);
    g.lineTo(-r * 0.7, r * 0.85); g.lineTo(-r * 0.7, -r * 0.05); g.closePath(); g.fill();
  } else if (key === "sun") {
    circle(0, 0, r * 0.45); g.fill(); g.lineWidth = r * 0.22;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); g.stroke(); }
  } else if (key === "heart") {
    g.beginPath(); g.moveTo(0, r * 0.85); g.bezierCurveTo(-r * 1.5, -r * 0.1, -r * 0.7, -r * 1.0, 0, -r * 0.3);
    g.bezierCurveTo(r * 0.7, -r * 1.0, r * 1.5, -r * 0.1, 0, r * 0.85); g.fill();
  } else if (key === "warn") {
    g.beginPath(); g.moveTo(0, -r); g.lineTo(r, r * 0.8); g.lineTo(-r, r * 0.8); g.closePath(); g.fill();
    g.fillStyle = "#3a2800"; g.fillRect(-r * 0.08, -r * 0.35, r * 0.16, r * 0.6); g.fillRect(-r * 0.08, r * 0.35, r * 0.16, r * 0.16);
  } else if (key === "bank") {
    g.beginPath(); g.moveTo(-r, -r * 0.35); g.lineTo(0, -r); g.lineTo(r, -r * 0.35); g.closePath(); g.fill();
    for (let i = 0; i < 4; i++) g.fillRect(-r * 0.8 + i * r * 0.5, -r * 0.2, r * 0.26, r * 0.8);
    g.fillRect(-r, r * 0.7, r * 2, r * 0.26);
  } else if (key === "check") {
    g.lineWidth = r * 0.34; g.beginPath(); g.moveTo(-r * 0.7, 0); g.lineTo(-r * 0.15, r * 0.55); g.lineTo(r * 0.75, -r * 0.5); g.stroke();
  } else if (key === "cross") {
    g.lineWidth = r * 0.34; g.beginPath(); g.moveTo(-r * 0.6, -r * 0.6); g.lineTo(r * 0.6, r * 0.6); g.moveTo(r * 0.6, -r * 0.6); g.lineTo(-r * 0.6, r * 0.6); g.stroke();
  } else if (key === "up") {
    g.beginPath(); g.moveTo(0, -r * 0.85); g.lineTo(r * 0.9, r * 0.6); g.lineTo(-r * 0.9, r * 0.6); g.closePath(); g.fill();
  } else if (key === "down") {
    g.beginPath(); g.moveTo(0, r * 0.85); g.lineTo(r * 0.9, -r * 0.6); g.lineTo(-r * 0.9, -r * 0.6); g.closePath(); g.fill();
  } else if (key === "news") { // un periódico: la hoja, el titular y tres líneas
    fillRR(-r, -r * 0.8, r * 2, r * 1.6, r * 0.2, color);
    g.fillStyle = "rgba(0,0,0,0.55)"; g.fillRect(-r * 0.7, -r * 0.5, r * 1.4, r * 0.34);
    for (let i = 0; i < 3; i++) g.fillRect(-r * 0.7, -r * 0.02 + i * r * 0.28, i === 2 ? r * 0.8 : r * 1.4, r * 0.13);
  } else if (key === "people") {
    for (const sx of [-1, 1]) { circle(sx * r * 0.45, -r * 0.4, r * 0.33); g.fill(); g.beginPath(); g.ellipse(sx * r * 0.45, r * 0.75, r * 0.55, r * 0.7, 0, Math.PI, TAU); g.fill(); }
  } else if (key === "tools") { // una llave inglesa: obras y reformas
  } else if (key === "star") {
    starPath(0, 0, r * 1.15, color);
  } else if (key === "case") { // el maletín del gerente: el asa, el cuerpo y el cierre
    rr(-r * 0.36, -r * 0.92, r * 0.72, r * 0.6, r * 0.16); g.lineWidth = r * 0.2; g.stroke();
    fillRR(-r, -r * 0.5, r * 2, r * 1.32, r * 0.24, color);
    g.fillStyle = "rgba(0,0,0,0.28)"; g.fillRect(-r, -r * 0.02, r * 2, r * 0.13);
    g.fillStyle = color; g.fillRect(-r * 0.16, -r * 0.12, r * 0.32, r * 0.32);
  } else if (key === "nave") { // la nave: tejado a dos aguas, la chapa y la persiana
    g.beginPath(); g.moveTo(-r * 1.05, -r * 0.2); g.lineTo(0, -r * 0.85); g.lineTo(r * 1.05, -r * 0.2); g.closePath(); g.fill();
    g.fillRect(-r * 0.85, -r * 0.2, r * 1.7, r * 1.05);

function cloud(x, y, s, a = 0.9) {

function palm(x, y, h, lean = 0, s = 1) { // el pie en (x, y); copa a `h` de altura

  g.strokeStyle = "#8a6a44"; g.lineWidth = 5 * s; g.lineCap = "round";

  g.restore();
}
function bougain(x, y, s, seed = 1) { // una mata de buganvilla: hojas verdes y flores rosa fuerte

    for (let k = 0; k < 3; k++) poly([[x - h * (0.3 - k * 0.07), y - h * (0.2 + k * 0.25)], [x, y - h * (0.55 + k * 0.25)], [x + h * (0.3 - k * 0.07), y - h * (0.2 + k * 0.25)]], k % 2 ? "#2d6a3e" : "#24593a");

    dot(x, y - h * 0.62, h * 0.34, "#2f7d4f"); dot(x - h * 0.2, y - h * 0.5, h * 0.24, "#3a8d58"); dot(x + h * 0.2, y - h * 0.52, h * 0.22, "#276b44");

function gull(x, y, s) {

  g.beginPath(); g.moveTo(x - 7 * s, y - 3 * s); g.quadraticCurveTo(x - 3 * s, y - 6 * s, x, y); g.quadraticCurveTo(x + 3 * s, y - 6 * s, x + 7 * s, y - 3 * s); g.stroke(); g.lineCap = "butt";

function umbrella(x, y, s, a, b) { // sombrilla de playa con el palo en (x, y) y la tela arriba

function ridge(y, amp, color, seed, x0 = -60, x1 = 420, step = 28) {

function toRgb(c) {

function colorTown(side, y0, rows, seed, pal = PASTEL) {

// Muchas casitas de golpe, agrupadas por color y de cada cosa un solo trazo (una a una costaban el triple):
// `hs` = [{ x, yb, w, h, c, p }], con `p` si el tejado es a dos aguas y, si no, un remate plano de color `cap`.
function houses(hs, roof = "#b4532a", cap = "#e8e0d0") {

const moodColor = (v) => (v >= 85 ? "#2fae5f" : v >= 60 ? "#8dc63f" : v >= 40 ? "#f2b81c" : v >= 20 ? "#f08a24" : "#d23a3a");

function starFrac(cx, cy, r, frac, on = C.gold, off = "#e3d8bc") {
  starPath(cx, cy, r, off);
  if (frac > 0) {
    g.save(); g.beginPath(); g.rect(cx - r - 1, cy - r - 1, (2 * r + 2) * frac, 2 * r + 2); g.clip();
    starPath(cx, cy, r, on); g.restore();
  }
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  g.closePath(); g.strokeStyle = "rgba(160,110,10,0.45)"; g.lineWidth = Math.max(1, r * 0.08); g.stroke();
}
// Cinco estrellas en fila, centradas en `x`; `value` de 0 a 5.
function starRow(x, cy, r, gap, value) {
  const x0 = x - (4 * gap) / 2;
  for (let i = 0; i < 5; i++) starFrac(x0 + i * gap, cy, r, clamp(value - i, 0, 1));
}

function background() {
  rect(0, 0, W, H, lgrad(0, 0, W * 0.35, H, [[0, "#fdf6e6"], [1, "#f1e2c2"]]));
  g.strokeStyle = "rgba(180,140,70,0.09)"; g.lineWidth = 2;
  for (let y = 110; y < H; y += 46) for (let x = ((y / 46) % 2) * 30 - 20; x < W; x += 60) {
    g.beginPath(); g.arc(x + 15, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.arc(x + 45, y, 15, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
}

function unit(cx, cy, s, draw) {
  g.save(); g.translate(cx, cy); g.scale(s / 20, s / 20); g.lineCap = "round"; g.lineJoin = "round";
  try { draw(); } finally { g.restore(); }
}
function stroke(color, w) { g.strokeStyle = color; g.lineWidth = w; g.stroke(); }
function path(points, close = true) {
  g.beginPath(); points.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); if (close) g.closePath();
}
function glassShape(x0, x1, y0, xb0, xb1, y1) { path([[x0, y0], [x1, y0], [xb1, y1], [xb0, y1]]); }

  stroke("rgba(140,120,100,0.55)", 2.2);
}

function layered(shape, layers) {
  g.save(); shape(); g.clip();
  for (const [y0, y1, c] of layers) rect(-20, y0, 40, y1 - y0, c);
  rect(-20, -20, 40, 40, lgrad(-12, 0, 12, 0, [[0, "rgba(255,255,255,0.35)"], [0.3, "rgba(255,255,255,0)"], [1, "rgba(0,0,0,0.08)"]]));

  const sh = () => path([[-10, -1], [10, -1], [0, 20]]);

  sh(); stroke("#b0742c", 1.3);
}
function tub(stripe) { // la tarrina de papel con sus rayas
  const sh = () => path([[-12, 1], [12, 1], [8, 19], [-8, 19]]);

}
function scoop(x, y, r, c, dk) { // una bola de helado con el borde ondulado
  for (let k = 0; k < 5; k++) dot(x - r * 0.8 + k * r * 0.4, y + r * 0.5, r * 0.3, dk);

  for (let k = 0; k < 4; k++) dot(x - r * 0.6 + k * r * 0.4, y + r * 0.55, r * 0.26, c);

}

// El color de cada contrato (la clave de `contract`) y de cada perfil de candidato.
const CONTRACT_KIND = { indefinido: "green", temporal: "blue", b: "ink" };
const PROFILE_COLOR = { general: "#44546a", joven: C.turqDk, parado: C.bugDk };
// El humor: color, el tono oscuro para el texto y el nombre (la cara de `moodFace` va aparte).
const MOOD = {
  contento: { color: C.green, dark: C.greenDk, label: "Contento" },
  normal: { color: C.amber, dark: "#7a5600", label: "Normal" },
  quemado: { color: C.red, dark: C.redDk, label: "Quemado" },

const SKILL_COLOR = { acierto: C.turqDk, rapidez: C.sun, trato: C.bug };

// La cara del humor, de trazos: sonrisa, boca recta o boca triste con las cejas caídas.
function moodFace(mood, cx, cy, r) {
  const m = MOOD[mood] || MOOD.normal, ink = mood === "normal" ? "#3a2800" : "#fff";
  dot(cx, cy, r, m.color); circle(cx, cy, r); stroke("#fff", Math.max(1.5, r * 0.14));
  dot(cx - r * 0.34, cy - r * 0.16, r * 0.13, ink); dot(cx + r * 0.34, cy - r * 0.16, r * 0.13, ink);
  g.lineCap = "round"; g.beginPath();
  if (mood === "contento") g.arc(cx, cy + r * 0.02, r * 0.46, 0.18 * Math.PI, 0.82 * Math.PI);
  else if (mood === "quemado") g.arc(cx, cy + r * 0.72, r * 0.42, 1.22 * Math.PI, 1.78 * Math.PI);
  else { g.moveTo(cx - r * 0.34, cy + r * 0.36); g.lineTo(cx + r * 0.34, cy + r * 0.36); }
  stroke(ink, r * 0.15);
  if (mood === "quemado") for (const sx of [-1, 1]) line(cx + sx * r * 0.6, cy - r * 0.34, cx + sx * r * 0.16, cy - r * 0.52, ink, r * 0.12);
  g.lineCap = "butt";
}
// Los puestos (el dependiente no tiene insignia ni etiqueta): su nombre, el sello corto, el icono y el color.
const ROLE = {
  encargado: { name: "Encargado de turno", short: "ENCARGADO", icon: "clip", color: "#1f6fb2" },
  repartidor: { name: "Repartidor", short: "REPARTO", icon: "parcel", color: "#e0661c" },
  gerente: { name: "Gerente", short: "GERENTE", icon: "case", color: C.gold, ink: C.ink },
  limpieza: { name: "Limpieza", short: "LIMPIEZA", icon: "spray", color: "#13867f" },
  reponedor: { name: "Mozo de almacén", short: "ALMACÉN", icon: "box", color: "#8a5a2a" },
  redes: { name: "Community manager", short: "REDES", icon: "phone", color: C.bug },
  rrhh: { name: "Recursos humanos", short: "RR. HH.", icon: "people", color: "#7a5aa8" },
};
// La ropa de cada puesto para `person`: delantal del negocio, chaqueta, bata turquesa, delantal marrón, sudadera…
function roleOpts(role, st) {
  const main = st.main || C.atl, accent = st.accent || C.gold;
  switch (role) {
    case "gerente": return { apron: main, pocketColor: accent, tie: main };
    case "encargado": return { apron: main, pocketColor: accent, role };
    case "repartidor": return { shirt: main, accent, role };
    case "limpieza": return { shirt: "#17a8a3", pocket: true, role };
    case "reponedor": return { apron: "#8a5a2a", pocketColor: "#5e3c18", role };
    case "redes": return { shirt: accent, accent: mix(accent, "#000000", 0.5), role };
    case "rrhh": return { accent, role };
    default: return { apron: main, pocketColor: accent };
  }
}
// La insignia redonda de un puesto (el maletín del gerente, la mochila del repartidor…).
function roleBadge(role, cx, cy, r) {
  const d = ROLE[role]; if (!d) return;
  dot(cx, cy, r, d.color); circle(cx, cy, r); stroke("#fff", 2.2); smallIcon(d.icon, cx, cy + r / 15, r * 8 / 15, d.ink || "#fff");
}
const roleName = (role, name) => name || (ROLE[role] ? ROLE[role].name : "");
// El retrato de un empleado o candidato: su busto (de `seed`) con la ropa de su puesto (el delantal del negocio si es dependiente).
function portrait(x, y, s, seed, st, age, role) {
  const main = st.main || C.atl;
  fillRR(x, y, s, s, 14, mix(main, "#ffffff", 0.82));
  g.save(); rr(x, y, s, s, 14); g.clip();
  rect(x, y + s * 0.62, s, s * 0.38, mix(main, "#ffffff", 0.7));
  person(x + s / 2, y + s * 0.1, s * 0.25, seed || 1, { cut: y + s + 6, ...roleOpts(role, st) });
  if (age != null) { // la edad, en una pastilla sobre la foto
    const t = `${age} años`, tw = width(t, F.d(14)) + 14;
    fillRR(x + 5, y + s - 25, tw, 20, 10, "rgba(20,28,36,0.72)");
    T(t, x + 5 + tw / 2, y + s - 15, { font: F.d(14), color: "#fff", align: "center" });
  }
  g.restore();
  rr(x + 0.5, y + 0.5, s - 1, s - 1, 14); stroke("rgba(0,0,0,0.14)", 1.4);
  roleBadge(role, x + 14, y + 14, 15);
}
// El nombre en una línea si cabe a `big`; si no, en dos a `small` (y si ni así, con «…»).
function nameBlock(name, x, cy, w, big, small) {
  const [t, z] = fit(name, w, F.d, big, big - 3);

// El distintivo del contrato: la clave en su color y lo que sigue al « · » (la prueba, el fin) al lado.

// Tres barras de habilidad en columnas: el nombre y el valor encima, la barra debajo.

// «Esta semana: +58.000 Y$» → ["Esta semana", "+58.000 Y$"].
function splitLabel(text) { const s = String(text || ""), i = s.indexOf(": "); return i > 0 ? [s.slice(0, i), s.slice(i + 2)] : ["", s]; }
// El color de lo lleno que está la nave (y su forma: la barra no se lee solo por el color).

}
const BOX_COLORS = [C.red, C.sun, C.turqDk, C.bug, C.blue, C.laurel, "#7a5aa8"];

// La nave por fuera, en su recuadro: el cielo, el monte de picón, el almacén de chapa con su franja, las
// persianas, la puerta de la oficina, unos palés y una palmera. `k` (0-1): lo ancha que es (su tamaño).
function naveArt(x, y, w, h, k = 0.7, seed = 1) {
  g.save(); rr(x, y, w, h, 10); g.clip();
  rect(x, y, w, h, vgrad(y, y + h, "#6fb8e2", "#e4f2f8"));
  cloud(x + w * 0.12, y + h * 0.2, h / 160, 0.85); cloud(x + w * 0.72, y + h * 0.13, h / 200, 0.7);
  const gy = y + h * 0.84;
  poly([[x, gy], [x, y + h * 0.52], [x + w * 0.22, y + h * 0.4], [x + w * 0.5, y + h * 0.55], [x + w * 0.78, y + h * 0.38], [x + w, y + h * 0.5], [x + w, gy]], "#b7ab90");
  rect(x, gy, w, y + h - gy, "#8f979f"); rect(x, gy, w, 2, "rgba(0,0,0,0.2)");
  g.beginPath(); for (let sx = x + 10; sx < x + w; sx += 40) g.rect(sx, gy + (y + h - gy) * 0.5 - 1, 18, 2.2); g.fillStyle = "rgba(255,255,255,0.6)"; g.fill();
  const bw = w * k, bx = x + (w - bw) / 2, bh = h * (0.34 + 0.16 * k), by = gy - bh, roof = h * 0.08;
  poly([[bx - 5, by + 2], [bx + bw / 2, by - roof], [bx + bw + 5, by + 2]], "#5f6f80");
  rect(bx, by, bw, bh, lgrad(bx, 0, bx + bw, 0, [[0, "#e3e9ee"], [1, "#b4c0cb"]]));
  g.beginPath(); for (let sx = bx + 5; sx < bx + bw; sx += 6) g.rect(sx, by + 6, 1, bh - 6); g.fillStyle = "rgba(60,80,100,0.16)"; g.fill();
  rect(bx, by, bw, 6, C.sun);
  const doors = k > 0.7 ? 2 : 1, dw = Math.min(bw * (doors === 1 ? 0.4 : 0.28), bh * 0.95), dh = bh * 0.6;
  for (let d = 0; d < doors; d++) {
    const dx = bx + bw * (doors === 1 ? 0.4 : 0.28 + d * 0.36) - dw / 2;
    rect(dx - 3, gy - dh - 4, dw + 6, dh + 4, "#44546a"); rollShutter(dx, gy - dh, dw, dh);
  }
  const ow = Math.max(12, bw * 0.08), ox = bx + bw - ow - Math.max(8, bw * 0.06); // la oficina, con su ventanuco
  rect(ox, gy - bh * 0.42, ow, bh * 0.42, "#2f6b8a"); rect(ox + ow * 0.2, gy - bh * 0.38, ow * 0.6, bh * 0.12, "#a8d0e8");
  const r = rng(seed); // los palés con sus cajas
  for (let i = 0; i < 2; i++) {
    const px = bx - 30 - i * 26;
    if (px < x + 4) break;
    rect(px, gy - 4, 22, 4, "#a07a4a");
    for (let j = 0, n = 1 + Math.floor(r() * 2); j < n; j++) { fillRR(px + 1, gy - 4 - (j + 1) * 12, 20, 12, 1.5, j % 2 ? "#d8bf8a" : "#c9a86a"); line(px + 11, gy - 4 - (j + 1) * 12, px + 11, gy - 4 - j * 12, "rgba(120,80,30,0.4)", 1); }
  }
  if (x + w - bx - bw > 30) palm(bx + bw + (x + w - bx - bw) / 2, gy + 2, h * 0.42, -0.1, h / 220);
  g.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, 10); stroke("rgba(0,0,0,0.14)", 1.4);
}
// El portacontenedores en el mar, con la isla de fondo; cargado o con la cubierta vacía.
function shipArt(x, y, w, h, seed, loaded) {
  g.save(); rr(x, y, w, h, 10); g.clip();
  rect(x, y, w, h, vgrad(y, y + h, "#86c8ec", "#e8f6fb"));
  const sea = y + h * 0.7;
  poly([[x + w * 0.55, sea], [x + w * 0.7, sea - h * 0.1], [x + w * 0.8, sea - h * 0.22], [x + w * 0.88, sea - h * 0.12], [x + w, sea - h * 0.06], [x + w, sea]], "rgba(80,100,115,0.32)");
  rect(x, sea, w, y + h - sea, vgrad(sea, y + h, "#2c8fc9", "#1d6aa0"));
  const q = rng(seed);
  g.beginPath(); for (let wy = sea + 6; wy < y + h; wy += 8) for (let wx = x + q() * 20; wx < x + w; wx += 26 + q() * 18) { g.moveTo(wx, wy); g.lineTo(wx + 8 + q() * 6, wy); } stroke("rgba(255,255,255,0.4)", 1.4);
  const hx = x + w * 0.07, hw = w * 0.84, hy = sea - h * 0.09, hh = h * 0.18;
  if (loaded) {
    const cw = hw * 0.125, ch = h * 0.12;
    for (let c = 0; c < 6; c++) for (let row = 0; row < 2; row++) container(hx + hw * 0.22 + c * cw, hy - (row + 1) * ch, cw - 2, ch - 1.5, BOX_COLORS[Math.floor(q() * BOX_COLORS.length)]);
  }
  poly([[hx, hy], [hx + hw * 1.04, hy], [hx + hw * 0.97, hy + hh], [hx + hw * 0.05, hy + hh]], C.atlDk);
  poly([[hx + hw * 0.02, hy + hh * 0.62], [hx + hw * 1.0, hy + hh * 0.62], [hx + hw * 0.97, hy + hh], [hx + hw * 0.05, hy + hh]], C.redDk);
  rect(hx, hy, hw * 1.04, 2.4, "#f4f4f0");
  const bx = hx + hw * 0.04, bwd = hw * 0.14, bh = h * 0.27; // el puente, con su chimenea
  rect(bx + bwd * 0.32, hy - bh - h * 0.08, bwd * 0.34, h * 0.08, C.sun);
  rect(bx, hy - bh, bwd, bh, "#f4f4f0"); rect(bx + 2, hy - bh + 4, bwd - 4, 4, "#2a3440"); rect(bx + 2, hy - bh + 12, bwd - 4, 3, "#2a3440");
  g.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, 10); stroke("rgba(0,0,0,0.14)", 1.4);
}

// -- venta --

  rr(-130, -34, 260, 68, 8); g.fillStyle = "rgba(255,253,246,0.85)"; g.fill(); stroke(C.red, 4); rr(-121, -25, 242, 50, 5); stroke(C.red, 1.6);

    const x = lx + 18 + i * (tw + gap), y = y0 + 46;

  }

  card(lx, vy, lw, vh);
  const hw = (lw - 36 - 40) / 2;
  for (const [i, label, value, icon] of [[0, "Media × 5", st.capitalized, "coin"], [1, "Patrimonio neto", st.equity, "safe"]]) {
    const x = lx + 18 + i * (hw + 40), y = vy + 16;
    fillRR(x, y, hw, 70, 12, "#fbf6ea"); rr(x + 0.5, y + 0.5, hw - 1, 69, 12); stroke(C.line, 1.2);
    dot(x + 30, y + 35, 18, i ? C.laurel : C.atl); (SL_ICON[icon] ? slIcon : glyph)(icon, x + 30, y + 35, 9, "#fff");
    fitText(label, x + 58, y + 22, hw - 70, F.m, 16, 13, { color: C.mute });
    fitText(value || "", x + 58, y + 48, hw - 70, F.d, 22, 14, { color: C.ink });

  line(lx + lw / 2, vy + 104, lx + lw / 2, vy + 114, C.sandDk, 2.4);
  const py = vy + 116, ph = vh - 128;
  fillRR(lx + 18, py, lw - 36, ph, 12, "#effaf8"); rr(lx + 18.5, py + 0.5, lw - 37, ph - 1, 12); stroke(C.turqDk, 2);
  T("Precio: el mayor de los dos", lx + 36, py + ph / 2, { font: F.m(17), color: C.turqDk });
  fitText(st.price || "", lx + lw - 36, py + ph / 2, 260, F.t, 30, 18, { color: C.ink, align: "right", fancy: true });
  // lo que se va con ella, o por qué no hay comprador
  const gy = vy + vh + 12, gh = 572 - gy;
  if (st.blocker) {

    dot(lx + 46, gy + gh / 2, 26, C.red); glyph("warn", lx + 46, gy + gh / 2 - 1, 14, "#fff");
    T("Hoy nadie la compra", lx + 88, gy + 28, { font: F.t(24), color: C.redDk });
    paragraph(st.blocker, lx + 88, gy + 58, lw - 108, F.m(17), 21, 3, { color: C.ink });
  } else {
    card(lx, gy, lw, gh);
    sectionLabel("Se va con ella", lx + 18, gy + 24);
    const items = [["building", st.locales], ["people", st.staff], ["safe", "La caja"]].filter(([, t]) => t), iw = (lw - 36) / items.length;
    items.forEach(([icon, t], i) => {

// -- Entrada ---------------------------------------------------------------------------------

const SCREENS = { dia: paintDia, montar: paintMontar, negocio: paintNegocio, almacen: paintAlmacen, cuentas: paintCuentas, cliente: paintCliente, cierre: paintCierre, mejoras: paintMejoras, resenas: paintResenas, sociedad: paintSociedad, plantilla: paintPlantilla, candidatos: paintCandidatos,
  cadena: paintCadena, nave: paintNave, venta: paintVenta };

function paintScreen(st) {
  const draw = SCREENS[st.screen];
  if (!draw) throw new Error(`Pantalla desconocida: ${st.screen}`);
  g.setTransform(S, 0, 0, S, 0, 0);
  g.clearRect(0, 0, W, H);
  g.lineCap = "butt"; g.lineJoin = "miter"; g.globalAlpha = 1; g.setLineDash([]);
  blit(cached("fondo", W, H, background), 0, 0, W, H);
  draw(st);
}

function frame(st) {
  paintScreen(st);
  octx.clearRect(0, 0, W, H);
  octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = "high";
  octx.drawImage(big, 0, 0, W * S, H * S, 0, 0, W, H);
  return { x: 0, y: 0, u: window.exportFrame(out) };
}

// En Chromium cada pantalla va como data URL de PNG; el pintor de Node
// (assets/escena_node.cjs) pone su exportFrame, que devuelve los píxeles tal cual.
window.exportFrame ??= (canvas) => canvas.toDataURL("image/png");
window.loadFonts = async () => {
  await Promise.all([document.fonts.load("700 20px Montserrat"), document.fonts.load("20px RobotoM"), document.fonts.load("20px RobotoR"), document.fonts.load("20px Luckiest")]);
  await document.fonts.ready;
  return true;
};
// Sin estado entre pantallas: cada una se pinta entera, así que no hay nada que reiniciar
// (el fondo de `cached` es fijo y sale igual en todos los procesos).
window.setup = async (meta) => true;
window.renderFrames = (states, first = 0) => states.map((st) => frame(st));
