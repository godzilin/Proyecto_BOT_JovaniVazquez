# Despliegue del bot: `docker compose up -d --build`
# Requiere un archivo .env junto a este (copia .env.example y pon el token).
services:
  bot:
    build: .
    image: bot-jovani-vazquez:latest
    container_name: bot-jovani-vazquez
    # Arranca con el NAS y se reinicia solo si falla; no si lo paras a mano.
    restart: unless-stopped
    env_file: .env
    # tini como PID 1: reenvía señales y recoge los procesos ffmpeg huérfanos.
    init: true
    # SIGINT = el mismo apagado ordenado que Ctrl+C.
    stop_signal: SIGINT
    stop_grace_period: 20s
    volumes:
      # Niveles y estadísticas (SQLite). Sobrevive a reconstrucciones.
      - bot-data:/app/.data
      # Buzón con actualizar.sh para el comando `reinicio` (ver
      # src/bot/services/deploy.py). Lo crea el script con permisos de escritura.
      - ./.despliegue/buzon:/app/.despliegue/buzon
      # Informe de uso diario (bot/cogs/telemetry.py, `export_loop`). Se puede
      # compartir por SMB para que un agente lo lea sin pedirlo. Lo crea
      # actualizar.sh con permisos de escritura.
      - ./informes:/app/informes
    # Los límites evitan que un fallo acapare el NAS. La memoria se la llevan el
    # Chromium de la parrilla y el boleto de los caballos (ver
    # bot/services/horses_scene.py): unos 170 MB, que se cierra tras 10 min sin
    # uso. La moneda, los dados, la ruleta, el Pollo, el autobús, el bacará, el
    # póker, la timba, los gallos, el 4 en raya, la torre, Allá tú, la guerra, el blackjack, las tragaperras (la clásica y
    # los Botes), la carrera de los caballos, el panel de `pisos`, el del negocio de `pala` (~75 MB medidos con la fase 2), la lotería (una sola escena para sus cinco imágenes) y el retrato de `mascota` ya no usan Chromium: los pintan procesos de Node
    # (bot/services/node_scene.py) compartidos por todos los juegos: uno siempre abierto y hasta 4, de ~80 MB más ~50 MB
    # por escena cargada (3 como mucho; la de los Botes, con las tres máquinas cargadas, ~120 MB), así que como mucho ~1,2 GB. Con el bot (~300 MB) y el Chromium de los caballos
    # se queda por debajo de los 2 GB; los procesos de más se cierran a los 10 min sin uso. Con 768 MB el sistema mataba
    # procesos. El informe de octubre de 2026 marcó 391 MB de máximo en un día. CPU: 3,5 de los 4 hilos del NAS, para que las dos pestañas y
    # los hilos que montan el GIF trabajen a la vez y quede medio hilo al NAS.
    mem_limit: 2g
    cpus: 3.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sin esto los logs crecen sin límite en el disco del NAS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Túnel de Tailscale Funnel para el Jovaniverso (`universo`, la Activity de Discord).
  # Discord llega a la página por aquí sin abrir puertos en el router y sin dominio
  # propio: Tailscale da una dirección fija `https://jovaniverso.<red>.ts.net` y
  # reenvía al servidor web del bot (http://bot:8080) por la red interna de compose,
  # según `tailscale/serve.json`. El puerto 8080 no se publica fuera.
  # Solo arranca con `COMPOSE_PROFILES=universo` en el .env y, la primera vez,
  # necesita `TS_AUTHKEY` (secreto: una clave de Tailscale). Después recuerda su
  # sesión en el volumen `tunel-state`. Pasos en el README, «Jovaniverso (Activity)».
  # Modo userspace: no necesita /dev/net/tun ni permisos de red del NAS.
  tunel:
    image: tailscale/tailscale:v1.104.2
    container_name: bot-jovani-vazquez-tunel
    profiles: ["universo"]
    hostname: jovaniverso
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: jovaniverso
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tunel-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - bot
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    name: bot-jovani-vazquez-data
  # Sesión de Tailscale del túnel: sin ella habría que dar una clave nueva en cada arranque.
  tunel-state:
    name: bot-jovani-vazquez-tunel
