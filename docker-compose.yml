# Despliegue del bot: `docker compose up -d --build`
# Requiere un archivo .env junto a este (copia .env.example y pon el token).
services:
  bot:
    build: .
    image: bot-jovani-vazquez:latest
    container_name: bot-jovani-vazquez
    # Arranca con el NAS y se reinicia solo si falla; no si lo paras a mano.
    restart: unless-stopped
    env_file: .env
    # tini como PID 1: reenvía señales y recoge los procesos ffmpeg huérfanos.
    init: true
    # SIGINT = el mismo apagado ordenado que Ctrl+C.
    stop_signal: SIGINT
    stop_grace_period: 20s
    volumes:
      # Niveles y estadísticas (SQLite). Sobrevive a reconstrucciones.
      - bot-data:/app/.data
      # Buzón con actualizar.sh para el comando `reinicio` (ver
      # src/bot/services/deploy.py). Lo crea el script con permisos de escritura.
      - ./.despliegue/buzon:/app/.despliegue/buzon
    # Los límites evitan que un fallo acapare el NAS. La memoria se la llevan los
    # Chromium de los juegos (ver bot/services/browser_scene.py): la ruleta con
    # sus dos pestañas ocupa ~370 MB, el autobús otros ~370 MB (también dibuja
    # con dos pestañas) y los dados y los caballos unos 170 MB cada uno, que se
    # cierran tras 10 min sin uso. La moneda ya no usa Chromium: la pintan dos
    # procesos de Node (bot/services/node_scene.py) de ~90 MB cada uno. Con el bot (~300 MB) y todos
    # abiertos se rondan los 1,6 GB; con 768 MB el sistema mataba
    # procesos. CPU: 3,5 de los 4 hilos del NAS, para que las dos pestañas y
    # los hilos que montan el GIF trabajen a la vez y quede medio hilo al NAS.
    mem_limit: 2g
    cpus: 3.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sin esto los logs crecen sin límite en el disco del NAS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    name: bot-jovani-vazquez-data
